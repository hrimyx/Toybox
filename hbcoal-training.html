    function isWareCompleted(ware) {
      return safeNumber(ware?.Progress, 0) >= 100;
    }

    function getFirstIncompleteWare(wares) {
      return (wares || []).find((ware) => !isWareCompleted(ware)) || null;
    }

    function getNextIncompleteWare(wares, currentWare) {
      if (!Array.isArray(wares) || !wares.length) return null;
      const currentIndex = wares.findIndex((ware) => String(ware.WareId) === String(currentWare?.WareId));
      if (currentIndex < 0) return getFirstIncompleteWare(wares);
      return wares.slice(currentIndex + 1).find((ware) => !isWareCompleted(ware)) || null;
    }

    function ensureAutoStudyWindow(reset = false) {
      if (!state.autoStudy) return false;
      const now = Date.now();
      if (reset || !state.autoStudyStartedAt || !state.autoStudyDeadlineAt || now >= state.autoStudyDeadlineAt) {
        state.autoStudyStartedAt = now;
        state.autoStudyDeadlineAt = now + CONFIG.AUTO_STUDY_MAX_DURATION_MS;
      }
      return true;
    }

    function clearAutoStudyWindow() {
      state.autoStudyStartedAt = 0;
      state.autoStudyDeadlineAt = 0;
    }

    function autoStudyTimeExceeded() {
      return Boolean(state.autoStudyDeadlineAt) && Date.now() >= state.autoStudyDeadlineAt;
    }

    async function findNextIncompleteCourse(currentCourse) {
      const courses = Array.isArray(state.stageCourses) ? state.stageCourses : [];
      const currentIndex = courses.findIndex((course) => String(course.id) === String(currentCourse?.id));
      if (currentIndex < 0) return null;

      for (const course of courses.slice(currentIndex + 1)) {
        if (safeNumber(course.learnProcess, 0) === 2) continue;
        let detail = state.courseDetailCache.get(`${state.selectedStage?.id}:${course.id}`);
        if (!detail) {
          detail = await requestJson({
            path: CONFIG.COURSE_DETAIL_PATH,
            method: 'POST',
            body: { courseId: course.id, relationId: state.selectedStage.id, source: 2 },
            lockKey: `course-detail-${course.id}-${state.selectedStage.id}`
          });
          state.courseDetailCache.set(`${state.selectedStage.id}:${course.id}`, detail);
        }
        const sections = Array.isArray(detail?.course?.sectionList) ? detail.course.sectionList : [];
        const wares = [];
        sections.forEach((section) => {
          const list = Array.isArray(section.courseWareList) ? section.courseWareList : [];
          list.forEach((ware) => wares.push({ ...ware, sectionId: ware.sectionId ?? section.SectionId }));
        });
        if (wares.some((ware) => !isWareCompleted(ware))) return course;
        course.learnProcess = 2;
      }
      return null;
    }

    async function advanceAutoStudy(currentSession) {
      if (!state.autoStudy || state.selectedCourse !== currentSession.course) return;

      // 连续学习达到 1 小时后，不中断当前课件；只在当前课件完成后停止，不再开启下一课件。
      if (autoStudyTimeExceeded()) {
        state.autoStudy = false;
        $('auto-study-toggle').checked = false;
        clearAutoStudyWindow();
        showNotice($('study-notice'), '已连续学习满 1 小时，当前课件已完成，连续学习停止。', 'success');
        return;
      }

      const nextWare = getNextIncompleteWare(currentSession.course.wares, currentSession.ware);
      if (nextWare) {
        if (state.studySession === currentSession) {
          await stopStudySession({ silent: true, syncBeforeStop: false });
        }
        await selectCourseWare(nextWare, false, false);
        if (state.autoStudy && !isWareCompleted(nextWare)) await startStudySession();
        return;
      }

      currentSession.course.learnProcess = 2;
      refreshSelectionHighlights();

      if (autoStudyTimeExceeded()) {
        state.autoStudy = false;
        $('auto-study-toggle').checked = false;
        clearAutoStudyWindow();
        showNotice($('study-notice'), '已连续学习满 1 小时，当前课件完成后停止连续学习。', 'success');
        return;
      }

      const nextCourse = await findNextIncompleteCourse(currentSession.course);
      if (!nextCourse) {
        state.autoStudy = false;
        $('auto-study-toggle').checked = false;
        clearAutoStudyWindow();
        showNotice($('study-notice'), '当前阶段已无未完成课程，连续学习已停止。', 'success');
        return;
      }

      await loadCourseDetail(nextCourse, state.selectedStage);
      if (state.autoStudy && state.selectedCourse?.wares?.length) {
        const firstIncomplete = getFirstIncompleteWare(state.selectedCourse.wares);
        if (firstIncomplete) {
          await selectCourseWare(firstIncomplete, false, false);
          if (state.autoStudy) await startStudySession();
        }
      }
    }

    function clearSmsCountdown() {
      if (state.exchange.smsTimerId) clearInterval(state.exchange.smsTimerId);
      state.exchange.smsTimerId = null;
      state.exchange.smsCountdown = 0;
      $('exchange-send-sms').textContent = '获取验证码';
    }

    function stopExchangeViewTimers() {
      clearSmsCountdown();
    }

    function getExchangeNodeDescription(node) {
      return node?.descr || node?.DESCR || `${safeNumber(node?.metaTime)} 分钟兑换 ${safeNumber(node?.metaIntegral)} 积分`;
    }

    function getExchangeNodeKey(node) {
      return node?.nodeKey || node?.metaKey || node?.METAKEY || '';
    }

    function canSelectExchangeNode(node) {
      return safeNumber(node?.canExchange, 0) === 1 && safeNumber(node?.isExchange, 0) !== 1;
    }

    async function loadExchangeView({ silent = false } = {}) {
      if (!state.auth) return;
      try {
        const [info, history] = await Promise.all([
          requestJson({ path: CONFIG.STUDY_INFO_PATH, method: 'POST', lockKey: 'exchange-info' }),
          requestJson({ path: CONFIG.STUDY_EXCHANGE_DATA_PATH, method: 'POST', body: { page: 1, pageSize: 10 }, lockKey: 'exchange-history' })
        ]);
        state.exchange.info = info?.data || null;
        const nodes = Array.isArray(state.exchange.info?.node) ? state.exchange.info.node : [];
        const selectedStillValid = nodes.some((node) => getExchangeNodeKey(node) === state.exchange.selectedNodeKey && canSelectExchangeNode(node));
        if (!selectedStillValid) state.exchange.selectedNodeKey = null;
        $('exchange-duration').textContent = safeNumber(state.exchange.info?.duration).toLocaleString('zh-CN');
        renderExchangeNodes(nodes);
        renderExchangeHistory(Array.isArray(history?.data) ? history.data : []);
        if (!silent) hideNotice($('exchange-notice'));
      } catch (error) {
        if (!silent) showNotice($('exchange-notice'), error.message, 'error');
        else showNotice($('exchange-notice'), error.message, 'error');
      }
    }

    function renderExchangeNodes(nodes) {
      const container = $('exchange-node-list');
      container.innerHTML = '';
      if (!nodes.length) {
        container.innerHTML = '<div class="empty-state">暂无可兑换项目</div>';
        $('exchange-send-sms').disabled = true;
        $('exchange-submit').disabled = true;
        $('exchange-selected').textContent = '暂无可兑换项目';
        return;
      }
      nodes.forEach((node) => {
        const key = getExchangeNodeKey(node);
        const selectable = canSelectExchangeNode(node);
        const item = document.createElement('div');
        item.className = 'exchange-node';
        if (key && key === state.exchange.selectedNodeKey) item.classList.add('selected');
        const main = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'exchange-node-title';
        title.textContent = getExchangeNodeDescription(node);
        const meta = document.createElement('div');
        meta.className = 'exchange-node-meta';
        const statusText = safeNumber(node?.isExchange, 0) === 1 ? '已兑换' : (safeNumber(node?.canExchange, 0) === 1 ? '可兑换' : '暂不可兑换');
        meta.textContent = `${safeNumber(node?.metaTime)} 分钟 · ${safeNumber(node?.metaIntegral)} 分 · ${statusText}`;
        main.append(title, meta);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = selectable ? 'secondary-button exchange-node-action' : 'ghost-button exchange-node-action';
        button.textContent = key && key === state.exchange.selectedNodeKey ? '已选择' : (statusText === '已兑换' ? '已兑换' : (selectable ? '选择' : '不可用'));
        button.disabled = !selectable;
        button.addEventListener('click', () => selectExchangeNode(node));
        item.append(main, button);
        container.appendChild(item);
      });
      updateExchangeForm();
    }

    function selectExchangeNode(node) {
      state.exchange.selectedNodeKey = getExchangeNodeKey(node);
      renderExchangeNodes(Array.isArray(state.exchange.info?.node) ? state.exchange.info.node : []);
      hideNotice($('exchange-notice'));
    }

    function getSelectedExchangeNode() {
      const nodes = Array.isArray(state.exchange.info?.node) ? state.exchange.info.node : [];
      return nodes.find((node) => getExchangeNodeKey(node) === state.exchange.selectedNodeKey && canSelectExchangeNode(node)) || null;
    }

    function updateExchangeForm() {
      const node = getSelectedExchangeNode();
      $('exchange-selected').textContent = node ? `${getExchangeNodeDescription(node)} · 将兑换 ${safeNumber(node.metaIntegral)} 分` : '请选择可兑换项目';
      $('exchange-send-sms').disabled = !node || state.exchange.smsCountdown > 0;
      $('exchange-submit').disabled = !node || !String($('exchange-sms-code').value).trim();
    }

    async function sendExchangeSms() {
      const node = getSelectedExchangeNode();
      if (!node || state.exchange.smsCountdown > 0) return;
      const button = $('exchange-send-sms');
      setButtonBusy(button, true, '发送中…');
      try {
        const response = await requestJson({
          path: CONFIG.STUDY_EXCHANGE_SEND_SMS_PATH,
          method: 'POST',
          body: { type: 1 },
          lockKey: 'exchange-sms'
        });
        if (response && Number(response.result) !== 1) throw new Error(response.msg || '验证码发送失败');
        state.exchange.smsCountdown = 60;
        button.textContent = '60秒后重试';
        state.exchange.smsTimerId = setInterval(() => {
          state.exchange.smsCountdown -= 1;
          if (state.exchange.smsCountdown <= 0) {
            clearSmsCountdown();
            updateExchangeForm();
            return;
          }
          button.textContent = `${state.exchange.smsCountdown}秒后重试`;
        }, 1000);
        showNotice($('exchange-notice'), response.msg || '短信验证码已发送。', 'success');
      } catch (error) {
        showNotice($('exchange-notice'), error.message, 'error');
        setButtonBusy(button, false, '获取验证码');
      } finally {
        if (state.exchange.smsCountdown > 0) button.disabled = true;
        else setButtonBusy(button, false, '获取验证码');
      }
    }

    async function submitStudyExchange() {
      const node = getSelectedExchangeNode();
      const smsCode = String($('exchange-sms-code').value || '').trim();
      if (!node) {
        showNotice($('exchange-notice'), '请选择可兑换项目。', 'error');
        return;
      }
      if (!smsCode) {
        showNotice($('exchange-notice'), '请输入短信验证码。', 'error');
        $('exchange-sms-code').focus();
        return;
      }
      const button = $('exchange-submit');
      setButtonBusy(button, true, '兑换中…');
      try {
        const response = await requestJson({
          path: CONFIG.STUDY_EXCHANGE_SUBMIT_PATH,
          method: 'POST',
          body: { smsCode, nodeKey: getExchangeNodeKey(node) },
          lockKey: 'exchange-submit'
        });
        if (response && Number(response.result) !== 1) throw new Error(response.msg || '兑换失败');
        $('exchange-sms-code').value = '';
        clearSmsCountdown();
        showNotice($('exchange-notice'), response.msg || '兑换成功。', 'success');
        await loadExchangeView({ silent: true });
        await loadSummary();
      } catch (error) {
        showNotice($('exchange-notice'), error.message, 'error');
      } finally {
        updateExchangeForm();
        setButtonBusy(button, false, '提交兑换');
        updateExchangeForm();
      }
    }

    function renderExchangeHistory(records) {
      const container = $('exchange-history');
      container.innerHTML = '';
      if (!records.length) {
        container.innerHTML = '<div class="empty-state">暂无兑换记录</div>';
        return;
      }
      records.forEach((record) => {
        const item = document.createElement('div');
        item.className = 'exchange-history-item';
        const main = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'exchange-history-title';
        title.textContent = `${safeNumber(record.studyLength)} 分钟兑换 ${safeNumber(record.exchangeIntegral)} 分`;
        const meta = document.createElement('div');
        meta.className = 'exchange-history-meta';
        meta.textContent = `${formatDateTime(record.createTime)} · ${record.transMsg || record.transState || '—'}`;
        main.append(title, meta);
        const points = document.createElement('div');
        points.className = 'exchange-history-points';
        points.textContent = `+${safeNumber(record.exchangeIntegral)}`;
        item.append(main, points);
        container.appendChild(item);
      });
    }

    function getIntegralDelta(record) {
      const desc = String(record?.integralDesc ?? '').trim();
      const descMatch = desc.match(/[+-]?\s*\d+(?:\.\d+)?/);
      if (descMatch) {
        const normalized = descMatch[0].replace(/\s+/g, '');
        const parsed = Number(normalized);
        if (Number.isFinite(parsed)) return parsed;
      }
      return safeNumber(record?.integral, 0);
    }

    function integralRecordKey(record) {
      return String(record?.recordId ?? `${record?.getTime || ''}-${record?.actionCode || ''}-${record?.integralDesc || record?.integral || ''}-${record?.actionName || ''}`);
    }

    function classifyIntegralRecords(earnedRecords, spentRecords) {
      const earnedSource = Array.isArray(earnedRecords) ? earnedRecords : [];
      const spentSource = Array.isArray(spentRecords) ? spentRecords : [];
      const spentKeys = new Set(spentSource.map(integralRecordKey));
      const earned = [];
      const spent = [];
      const earnedKeys = new Set();
      const spentFallback = [];

      spentSource.forEach((record) => {
        const key = integralRecordKey(record);
        if (spentKeys.has(key) && !spentFallback.some((item) => integralRecordKey(item) === key)) spentFallback.push(record);
      });

      // scoreType=1 在后端用于筛选另一类流水；即使 integral 本身为正数，也应按该列表归入消费。
      spentFallback.forEach((record) => {
        const key = integralRecordKey(record);
        if (!spent.find((item) => integralRecordKey(item) === key)) spent.push(record);
      });

      earnedSource.forEach((record) => {
        const key = integralRecordKey(record);
        if (spentKeys.has(key)) return;
        const delta = getIntegralDelta(record);
        if (delta >= 0 && !earnedKeys.has(key)) {
          earned.push(record);
          earnedKeys.add(key);
        } else if (delta < 0 && !spent.find((item) => integralRecordKey(item) === key)) {
          spent.push(record);
        }
      });

      return { earned, spent };
    }

    async function loadIntegralRecords({ silent = false } = {}) {
      if (!state.auth) return;
      try {
        const [scoreZero, scoreOne] = await Promise.all([
          requestJson({ path: CONFIG.INTEGRAL_LIST_PATH, method: 'POST', body: { scoreType: 0, page: 1, pageSize: 16 }, lockKey: 'integral-list-0' }),
          requestJson({ path: CONFIG.INTEGRAL_LIST_PATH, method: 'POST', body: { scoreType: 1, page: 1, pageSize: 16 }, lockKey: 'integral-list-1' })
        ]);
        state.integralRecords = classifyIntegralRecords(scoreZero?.data, scoreOne?.data);
        renderIntegralRecords();
        if (!silent) hideNotice($('integral-notice'));
      } catch (error) {
        showNotice($('integral-notice'), error.message, 'error');
      }
    }

    function renderIntegralRecords() {
      const render = (container, records, totalElement, negative = false) => {
        container.innerHTML = '';
        const total = records.reduce((sum, record) => sum + Math.abs(safeNumber(record?.integral, 0)), 0);
        $(totalElement).textContent = `${total.toLocaleString('zh-CN')} 分`;
        if (!records.length) {
          container.innerHTML = '<div class="empty-state">暂无记录</div>';
          return;
        }
        records.forEach((record) => {
          const item = document.createElement('div');
          item.className = 'record-item';
          const main = document.createElement('div');
          const title = document.createElement('div');
          title.className = 'record-title';
          title.textContent = record?.actionName || record?.inteCategroy || '积分记录';
          const meta = document.createElement('div');
          meta.className = 'record-meta';
          meta.textContent = `${formatDateTime(record?.getTime)} · ${record?.inteCategroy || '—'}`;
          main.append(title, meta);
          const points = document.createElement('div');
          points.className = `record-points ${negative ? 'negative' : 'positive'}`;
          const delta = getIntegralDelta(record);
          const displayAmount = negative ? -Math.abs(delta) : delta;
          points.textContent = `${displayAmount > 0 ? '+' : ''}${displayAmount}`;
          item.append(main, points);
          container.appendChild(item);
        });
      };
      render($('integral-earned-list'), state.integralRecords.earned, 'integral-earned-total', false);
      render($('integral-spent-list'), state.integralRecords.spent, 'integral-spent-total', true);
    }

    function openFeatureView(viewId) {
      if (!state.auth) {
        $('dashboard-view').classList.add('hidden');
        $('exchange-view').classList.add('hidden');
        $('integral-view').classList.add('hidden');
        $('login-view').classList.remove('hidden');
        $('summary-grid').classList.add('hidden');
        stopExchangeViewTimers();
        return;
      }
      $('login-view').classList.add('hidden');
      $('dashboard-view').classList.toggle('hidden', viewId !== 'dashboard-view');
      $('exchange-view').classList.toggle('hidden', viewId !== 'exchange-view');
      $('integral-view').classList.toggle('hidden', viewId !== 'integral-view');
      $('summary-grid').classList.remove('hidden');
      if (viewId !== 'exchange-view') stopExchangeViewTimers();
    }

    function renderAuthState() {
      const loggedIn = Boolean(state.auth);
      $('login-view').classList.toggle('hidden', loggedIn);
      $('dashboard-view').classList.toggle('hidden', !loggedIn);
      $('summary-grid').classList.toggle('hidden', !loggedIn);
      $('exchange-view').classList.add('hidden');
      $('integral-view').classList.add('hidden');
      if (!loggedIn) stopExchangeViewTimers();
      $('user-name-top').textContent = loggedIn ? state.auth.name : '';
      setStatus(loggedIn ? '已登录 · 点击退出' : '未登录', loggedIn);
      $('status-chip').title = loggedIn ? '点击退出登录' : '当前未登录';
    }

    function logout() {
      void stopStudySession({ silent: true });
      state.auth = null;
      state.plans = [];
      state.selectedPlanId = null;
      state.selectedCourse = null;
      state.selectedCourseWare = null;
      state.autoStudy = false;
      clearAutoStudyWindow();
      state.selectedStage = null;
      state.stageCourses = [];
      $('auto-study-toggle').checked = false;
      state.stageCache.clear();
      state.courseDetailCache.clear();
      state.exchange.selectedNodeKey = null;
      stopExchangeViewTimers();
      openFeatureView('dashboard-view');
      $('plan-list').innerHTML = '<div class="empty-state">登录后加载学习计划</div>';
      $('study-empty').classList.remove('hidden');
      $('study-content').classList.add('hidden');
      $('username').value = '';
      $('password').value = '';
      renderAuthState();
      hideNotice($('login-notice'));
      hideNotice($('study-notice'));
    }

    async function runWithTransientRetry(operation) {
      try {
        return await operation();
      } catch (error) {
        if (!isTransientRequestError(error)) throw error;
        await waitMs(350);
        return operation();
      }
    }

    async function onLoginSubmit(event) {
      event.preventDefault();
      const username = $('username').value.trim();
      const password = $('password').value;
      const domain = $('domain').value.trim();
      hideNotice($('login-notice'));

      if (!username) {
        showNotice($('login-notice'), '请输入账号。', 'error');
        $('username').focus();
        return;
      }
      if (!password) {
        showNotice($('login-notice'), '请输入密码。', 'error');
        $('password').focus();
        return;
      }
      if (!domain) {
        showNotice($('login-notice'), '请输入企业域。', 'error');
        $('domain').focus();
        return;
      }

      setButtonBusy($('login-button'), true, '登录中…');
      try {
        await login(username, password, domain);
        renderAuthState();
        $('month-label').textContent = `${currentMonthLabel()}学习时长`;

        const failures = [];
        try {
          await runWithTransientRetry(loadSummary);
        } catch (error) {
          failures.push(`学习时长/积分：${error.message}`);
        }
        try {
          await runWithTransientRetry(loadPlans);
        } catch (error) {
          failures.push(`学习计划：${error.message}`);
        }

        if (failures.length) {
          showNotice($('login-notice'), `登录成功，但部分学习数据暂未加载。${failures.join('；')} 可使用各区域刷新按钮重试。`, 'info');
        } else {
          showNotice($('login-notice'), '登录成功，学习数据已加载。', 'success');
        }
      } catch (error) {
        state.auth = null;
        renderAuthState();
        showNotice($('login-notice'), error.message, 'error');
      } finally {
        setButtonBusy($('login-button'), false, '登录');
      }
    }

    function init() {
      $('tool-title').textContent = TOOL_META.name;
      $('tool-version').textContent = `v${TOOL_META.version}`;
      document.title = TOOL_META.name;
      $('footer-text').textContent = `${TOOL_META.name} · v${TOOL_META.version} · ${TOOL_META.author}`;
      $('month-label').textContent = `${currentMonthLabel()}学习时长`;

      $('login-form').addEventListener('submit', onLoginSubmit);
      $('status-chip').addEventListener('click', () => {
        if (state.auth) {
          if (window.confirm('确定退出登录吗？')) logout();
        }
      });
      $('refresh-study-info').addEventListener('click', (event) => { event.stopPropagation(); void refreshStudyInfo(); });
      $('refresh-integral').addEventListener('click', (event) => { event.stopPropagation(); void refreshIntegral(); });
      $('refresh-plans').addEventListener('click', refreshPlans);
      $('study-stat-card').addEventListener('click', (event) => {
        if (event.target.closest('.icon-button')) return;
        openFeatureView('exchange-view');
        void loadExchangeView();
      });
      $('study-stat-card').addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('.icon-button')) {
          event.preventDefault();
          openFeatureView('exchange-view');
          void loadExchangeView();
        }
      });
      $('integral-stat-card').addEventListener('click', (event) => {
        if (event.target.closest('.icon-button')) return;
        openFeatureView('integral-view');
        void loadIntegralRecords();
      });
      $('integral-stat-card').addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('.icon-button')) {
          event.preventDefault();
          openFeatureView('integral-view');
          void loadIntegralRecords();
        }
      });
      $('exchange-back').addEventListener('click', () => openFeatureView('dashboard-view'));
      $('integral-back').addEventListener('click', () => openFeatureView('dashboard-view'));
      $('refresh-exchange').addEventListener('click', () => void loadExchangeView());
      $('refresh-exchange-history').addEventListener('click', () => void loadExchangeView({ silent: true }));
      $('exchange-send-sms').addEventListener('click', () => void sendExchangeSms());
      $('exchange-submit').addEventListener('click', () => void submitStudyExchange());
      $('exchange-sms-code').addEventListener('input', updateExchangeForm);
      $('refresh-integral-records').addEventListener('click', () => void loadIntegralRecords());
      $('auto-study-toggle').addEventListener('change', () => {
        state.autoStudy = $('auto-study-toggle').checked;
        if (state.autoStudy) {
          if (state.studySession?.active) ensureAutoStudyWindow(true);
          else clearAutoStudyWindow();
        } else {
          clearAutoStudyWindow();
        }
      });
      $('start-study-button').addEventListener('click', startStudySession);
      $('pause-study-button').addEventListener('click', pauseStudySession);
      $('sync-study-button').addEventListener('click', () => void syncStudyProgress(false, true));
      document.addEventListener('visibilitychange', () => { void resumeAfterVisibility(); });

      renderAuthState();
    }

    init();
  </script>
</body>
</html>
