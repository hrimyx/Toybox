    }
    async function handleBackgroundReporterMessage(message) {
      const session = state.studySession;
      if (!message || message.type !== 'sync-due' || !session?.active || session.background === false) return;
      if (session.syncing) {
        session.nextSyncAt = Date.now() + CONFIG.BACKGROUND_SYNC_RETRY_DELAY_MS;
        rescheduleBackgroundReporter(session.nextSyncAt);
        return;
      }
      await syncSessionProgress(session, { fromBackground: true });
    }
    async function syncSessionProgress(session, { fromBackground = false } = {}) {
      if (!session || session.syncing || !state.auth) return;
      const serial = session.serial;
      session.syncing = true;
      try {
        const progressMs = getSessionProgressMs(session);
        const query = buildProgressSyncQuery(session, progressMs);
        beginReporting(); // 上报进度：边框七彩跑马灯，按请求实际起止显示
        try {
          await runWithTransientRetry(() => requestJson({
            path: CONFIG.AFTER_WARE_PATH, method: 'GET', query, authRequired: false, lockKey: `sync-${serial}`
          }));
        } finally {
          endReporting();
        }
        if (state.studySession?.serial !== serial) return;
        const prevReportedMs = Math.max(session.lastSyncMs || 0, session.baseMs || 0);
        applyStudySyncResult(session, progressMs);
        // 完成判定用同步结束后的最新进度重算：上报请求本身要花时间，刚到学完时刻的唤醒
        // 若按请求开始时的进度算，可能差几毫秒被判成未完成，后台又要再等 5 分钟
        const finalProgressMs = getSessionProgressMs(session);
        const done = finalProgressMs >= Math.max(1, session.totalMs) - 1;
        // 回写课件进度：会话与 detail.wares 共享同一课件对象；不回写则连学判断会用过期 Progress
        // 把以前已学完的课件重新拉起来再学一遍；学完直接写 100，不用 floor
        if (session.ware && session.totalMs > 0) {

        if (done) await completeSession(session);

        // 学完时跳过：completeSession 开头已把行标为已完成，stopSession 内也已用活会话刷新过；
        // 此时会话已死，再按 baseMs 重算会把 0% 写回去（自然学完的行会显示 0%）
        if (!done) refreshWareRow(session);

        rescheduleBackgroundReporter(session.nextSyncAt);

    // 回到前台对账：后台可能冻结/节流了上报，若同步已逾期则立即补一次（仅一次，syncing 守卫防并发，
    // 不会把积压的请求一股脑全发）；未逾期则确认 worker/降级定时器仍在排期；最后检查连学安全截止
    async function reconcileAfterVisible() {
      const session = state.studySession;
      updateSessionUi();
      // 保活音频可能在后台被系统打断（来电/Siri/锁屏）：回前台时按模式把它接回来，下次进后台才继续有效
      if (state.keepalive && session?.active && !session.paused && state.keepaliveAudio?.el?.paused) {
        const p = state.keepaliveAudio.el.play();
        if (p && p.catch) p.catch(() => {});

      }
    }

    /* ================= 会话生命周期 ================= */
    function showSessionNotice(message) {
      if (message) showToast(message);
    }
    /* ================= 学习控制台内容 ================= */
    // 空面板：无待学/学习中课件时的默认显示
    function resetPanelIdle() {
      $('session-course').textContent = '—';
      $('session-ware').textContent = '—';
      $('session-progress-fill').style.width = '0%';
      $('session-time-text').textContent = '00:00 / 00:00';
      const btn = $('btn-start');
      btn.textContent = '开始';
      btn.disabled = true;
      $('btn-end').disabled = true;
      setPanelStateClass('st-ready');
      refreshSpeedButton();
    }
    // 待开始面板：显示选中的课程/课件，进度条归零
    async function showPendingPanel(detail, ware) {
      $('session-course').textContent = detail?.courseName || detail?.course?.CourseName || '—';
      $('session-ware').textContent = ware?.WareName ?? ware?.wareName ?? '—';
      $('session-progress-fill').style.width = '0%';
      $('session-time-text').textContent = '00:00 / --:--';
      const btn = $('btn-start');
      btn.textContent = '开始';
      btn.disabled = false;
      // 已完成课件进控制台后不可再学：开始按钮直接禁用（结束=取消仍可点）
      if (wareProgress(ware) >= 100) btn.disabled = true;
      $('btn-end').disabled = false; // 待学习时结束=取消该课件，可点
      setPanelStateClass('st-ready');
      refreshSpeedButton();
      // 异步解析真实时长与已学进度（与开始学习用同一套逻辑），解析完再填上
      try {
        const totalMs = await resolveMediaDurationMs(ware);
        if (state.pendingStudy?.ware !== ware) return; // 已切换到其他课件，丢弃过期结果
        if (totalMs > 0) {
          const totalSec = Math.round(totalMs / 1000);
          const baseSec = Math.round(normalizeBaseProgressMs(ware, totalMs) / 1000);
          $('session-progress-fill').style.width = `${totalSec > 0 ? Math.min(100, (baseSec / totalSec) * 100) : 0}%`;
          $('session-time-text').textContent = `${formatHms(baseSec)} / ${formatHms(totalSec)}`;
        }
      } catch { /* 解析失败则保持 --:-- */ }
    }
    function setPanelStateClass(cls) {
      const panel = $('session-panel');
      panel.classList.remove('st-ready', 'st-playing', 'st-paused');
      panel.classList.add(cls);
    }
    /* ============ 全局单例浮动学习控制台：ball（悬浮球）/ panel（完整）/ mini（小型学习台） ============ */
    // 每次登录后悬浮球回到右下角默认位置（清除拖动残留的内联定位）
    function resetFloatPosition() {
      for (const id of ['session-ball', 'session-mini', 'session-panel']) {
        const el = $(id);
        if (!el) continue;
        el.style.left = ''; el.style.top = ''; el.style.right = ''; el.style.bottom = '';
      }
    }
    // 学习控制台位置持久化：拖动结束与页面隐藏时保存当前可见浮动元素的位置，登录/刷新后恢复到悬浮球
    function saveFloatPosition() {
      try {
        const el = ['session-ball', 'session-mini', 'session-panel'].map((id) => $(id)).find((e) => e && !e.classList.contains('hidden'));
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.width <= 0) return;
        localStorage.setItem(CONFIG.LS_FLOAT, JSON.stringify({ left: Math.round(r.left), top: Math.round(r.top) }));
      } catch { /* 忽略 */ }
    }
    function restoreFloatPosition() {
      try {
        const saved = JSON.parse(localStorage.getItem(CONFIG.LS_FLOAT) || 'null');
        if (!saved || typeof saved.left !== 'number' || typeof saved.top !== 'number') return;
        const ball = $('session-ball');
        const left = Math.min(Math.max(saved.left, 0), Math.max(0, window.innerWidth - (ball.offsetWidth || 56)));
        const top = Math.min(Math.max(saved.top, 0), Math.max(0, window.innerHeight - (ball.offsetHeight || 56)));
        placeElAt(ball, left, top);
      } catch { /* 忽略 */ }
    }
    function setFloatMode(mode) {
      state.floatMode = mode;
      $('session-ball').classList.toggle('hidden', mode !== 'ball');
      $('session-panel').classList.toggle('hidden', mode !== 'panel');
      $('session-mini').classList.toggle('hidden', mode !== 'mini');
      if (mode === 'mini') refreshMiniMarquee();
    }
    // 把元素放到指定左上角坐标（切换形态时保证从当前位置出现）
    function placeElAt(el, x, y) {
      el.style.left = `${Math.round(x)}px`;
      el.style.top = `${Math.round(y)}px`;
      el.style.right = 'auto';
      el.style.bottom = 'auto';
    }
    // 边缘感知锚点：取矩形离视口最近的边（悬空时用，平局按左>右>上>下）
    function nearestEdge(r) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const cands = [
        { edge: 'left', dist: r.left },
        { edge: 'right', dist: vw - r.right },
        { edge: 'top', dist: r.top },
        { edge: 'bottom', dist: vh - r.bottom },
      ];
      let best = cands[0];
      for (const c of cands) if (c.dist < best.dist) best = c;
      return best.edge;
    }
    // 贴边判定阈值：球/面板默认边距与拖动吸附边距均为 12px，24px 足以覆盖吸附位
    const EDGE_NEAR = 24;
    // 边缘信息：每条边的精确距离、是否贴近；每轴选一条边（贴近者优先按距离，平局取 right/bottom）
    function edgeInfo(r) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const dist = { left: r.left, right: vw - r.right, top: r.top, bottom: vh - r.bottom };
      const near = {
        left: dist.left <= EDGE_NEAR, right: dist.right <= EDGE_NEAR,
        top: dist.top <= EDGE_NEAR, bottom: dist.bottom <= EDGE_NEAR,
      };
      const pick = (a, b) => {
        if (near[a] !== near[b]) return near[a] ? a : b;
        return dist[b] <= dist[a] ? b : a;
      };
      return { dist, near, hx: pick('left', 'right'), vy: pick('top', 'bottom') };
    }
    // 面板展开锚定：角落（含横跨整宽/整高）→ 面板贴进该角；单边 → 面板贴该边、居中于来源。
    // 返回面板生长原点。调用前隐藏测量，调用后恢复显示
    function anchorPanelToSource(r) {
      const panel = $('session-panel');
      panel.style.visibility = 'hidden';
      panel.classList.remove('hidden');
      const pw = panel.offsetWidth, ph = panel.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      const rr = { left: r.left, top: r.top, right: r.left + r.width, bottom: r.top + r.height };
      const scx = (rr.left + rr.right) / 2, scy = (rr.top + rr.bottom) / 2;
      const info = edgeInfo(rr);
      let left, top, origin;
      if (info.near[info.hx] && info.near[info.vy]) {
        left = info.hx === 'right' ? vw - pw - 12 : 12;
        top = info.vy === 'bottom' ? vh - ph - 12 : 12;
        origin = `${info.hx} ${info.vy}`;
      } else if (info.near[info.hx]) {
        left = info.hx === 'right' ? vw - pw - 12 : 12;
        top = scy - ph / 2;
        origin = `${info.hx} center`;
      } else if (info.near[info.vy]) {
        left = scx - pw / 2;
        top = info.vy === 'bottom' ? vh - ph - 12 : 12;
        origin = `center ${info.vy}`;
      } else {
        const edge = nearestEdge(rr);
        if (edge === 'left') { left = 12; top = scy - ph / 2; origin = 'left center'; }
        else if (edge === 'right') { left = vw - pw - 12; top = scy - ph / 2; origin = 'right center'; }
        else if (edge === 'top') { left = scx - pw / 2; top = 12; origin = 'center top'; }
        else { left = scx - pw / 2; top = vh - ph - 12; origin = 'center bottom'; }
      }
      left = Math.min(Math.max(Math.round(left), 12), Math.max(12, vw - pw - 12));
      top = Math.min(Math.max(Math.round(top), 12), Math.max(12, vh - ph - 12));
      placeElAt(panel, left, top);
      panel.style.visibility = '';
      return origin;

    // 面板收起锚点：角落 → 小形态回到该角；单边 → 贴该边（左右边纵向居中，上下边横向居中）。
    // 返回目标位置与面板收缩原点（与展开互为逆运算，往返零漂移）
    function collapseAnchor(p, w, h) {
      const vw = window.innerWidth, vh = window.innerHeight;
      const cx = (p.left + p.right) / 2, cy = (p.top + p.bottom) / 2;
      const info = edgeInfo(p);
      let x, y, origin;
      if (info.near[info.hx] && info.near[info.vy]) {
        x = info.hx === 'right' ? p.right - w : p.left;
        y = info.vy === 'bottom' ? p.bottom - h : p.top;
        origin = `${info.hx} ${info.vy}`;
      } else if (info.near[info.hx]) {
        x = info.hx === 'right' ? p.right - w : p.left;
        y = cy - h / 2;
        origin = `${info.hx} center`;
      } else if (info.near[info.vy]) {
        x = cx - w / 2;
        y = info.vy === 'bottom' ? p.bottom - h : p.top;
        origin = `center ${info.vy}`;
      } else {
        const edge = nearestEdge(p);
        if (edge === 'left') { x = p.left; y = cy - h / 2; origin = 'left center'; }
        else if (edge === 'right') { x = p.right - w; y = cy - h / 2; origin = 'right center'; }
        else if (edge === 'top') { x = cx - w / 2; y = p.top; origin = 'center top'; }
        else { x = cx - w / 2; y = p.bottom - h; origin = 'center bottom'; }
      }
      x = Math.min(Math.max(Math.round(x), 0), Math.max(0, vw - w));
      y = Math.min(Math.max(Math.round(y), 0), Math.max(0, vh - h));

    // 吸附到最近的左/右/下边缘；另一轴如被拖到 0 边距也一并拉回 12px 安全区
    function snapToEdge(el) {

      if (r.width <= 0) return;
      const vw = window.innerWidth, vh = window.innerHeight;
      const M = 12;
      const dLeft = r.left, dRight = vw - r.right, dBottom = vh - r.bottom;
      const m = Math.min(dLeft, dRight, dBottom);
      let x = r.left, y = r.top;
      if (m === dBottom) y = vh - r.height - M;

    // 面板 → 悬浮球：悬浮球放到面板最近的边（左右边贴边且纵向居中，上下边贴边且横向居中），不再吸附跳走
    function collapsePanelToBall() {

          const bh = ball.offsetHeight || 56;

    // 面板布局盒：读取时面板通常处于正常尺寸（缩放动画开始前调用）；
    // 若在动画中途读取，用当前 transform-origin 把视觉矩形还原为布局盒，保证量不错位置
    function panelLayoutBox() {
      const panel = $('session-panel');
      const ow = panel.offsetWidth, oh = panel.offsetHeight;
      if (!ow || !oh) return null;
      const r = panel.getBoundingClientRect();
      if (r.width <= 0) return null;
      const [ox, oy] = (panel.style.transformOrigin || 'center').split(' ');
      let left, top;
      if (ox === 'left') left = r.left;
      else if (ox === 'right') left = r.right - ow;

    // 悬浮球 / 小型学习台 / 控制面板拖动：移动超过阈值视为拖动，松手后自动吸附左/右/下边缘
    // 注意：不能用 setPointerCapture（会把 pointerup 重定向到容器，导致子按钮收不到 click）
    function makeFloatDraggable(el) {
      let dragging = false, moved = false;
      let sx = 0, sy = 0, ox = 0, oy = 0;
      el.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        dragging = true; moved = false;
        sx = event.clientX; sy = event.clientY;
        const r = el.getBoundingClientRect();
        ox = sx - r.left; oy = sy - r.top;
      });
      window.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        if (!moved && Math.hypot(event.clientX - sx, event.clientY - sy) > 8) {
          moved = true;
          el.classList.add('dragging');
        }
        if (moved) {
          const x = Math.min(Math.max(event.clientX - ox, 0), window.innerWidth - el.offsetWidth);
          const y = Math.min(Math.max(event.clientY - oy, 0), window.innerHeight - el.offsetHeight);
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.style.right = 'auto';
          el.style.bottom = 'auto';
        }
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove('dragging');
        if (moved) { snapToEdge(el); setTimeout(saveFloatPosition, 220); } // 吸附动画结束后再存最终位置
      };

      window.addEventListener('pointercancel', endDrag);

    // 点击课件只选中、不自动开始：悬浮球展开为完整控制台，等待手动点击开始

    async function selectWare(detail, ware, module = 'plan', rowEl = null) {

        await startSession(pending.detail, pending.ware, pending.module);
      } finally {
        state.startingSession = false;
        setButtonBusy(btn, false);
      }
    }
    async function startSession(detail, ware, module) {
      if (state.studySession?.active) await stopSession({ silent: true, syncBeforeStop: true });
      const serial = ++state.sessionSerial;
      setFloatMode('panel');
      try {
        const totalMs = await resolveMediaDurationMs(ware);
        if (!totalMs || totalMs <= 0) throw new Error('无法获取课件时长，请稍后重试');
        const course = detail.course || {};
        const source = detail.source ?? 2;
        const relationId = detail.relationId ?? '';
        const relationName = detail.relationName || (course?.CourseName ?? course?.courseName ?? '');
        // HAR 已验证：beforeLearnWare 是 POST 表单，含全部业务参数。
        beginReporting(); // 开始学习上报：边框七彩跑马灯，按请求实际起止显示
        let begin;
        try {
          begin = await runWithTransientRetry(() => requestJson({
            path: CONFIG.BEFORE_WARE_PATH, method: 'POST',
            body: {
              courseId: course?.CourseId ?? course?.courseId ?? '',
              sectionId: ware?.sectionId ?? '',
              wareId: ware?.WareId ?? ware?.wareId ?? '',
              wareType: ware?.Type ?? ware?.type ?? '',
              source,
              relationId,
              relationName,
              tid: state.auth.tid
            },
            lockKey: `begin-${serial}`
          }));
        } finally {
          endReporting();
        }
        const session = {
          serial,
          active: true,
          detail,
          module: module || '', // 课件来源模块：学完后刷新该模块列表用（mine/plan/center）
          paused: false,
          background: false,
          course,
          ware,
          source,
          relationId,
          relationName,
          recordId: begin?.recordId ?? '',
          wareRecordId: begin?.wareRecordId ?? '',
          totalMs,
          baseMs: normalizeBaseProgressMs(ware, totalMs),
          startedAt: Date.now(),
          lastSyncMs: 0,
          lastSyncWallAt: Date.now(),
          nextSyncAt: Date.now() + CONFIG.PROGRESS_FIRST_SYNC_DELAY_MS,
          backgroundFailures: 0,
          syncing: false,
          timerId: null
        };
        state.studySession = session;
        state.pendingStudy = null;
        refreshStatusChip(); // 学习中：右上角改显示学习中
        markSelectedWareRow(ware);
        refreshSpeedButton(); // 学习中：速按钮不可点
        session.timerId = setInterval(() => { if (state.studySession?.serial === serial) updateSessionUi(); }, CONFIG.UI_TICK_INTERVAL_MS);
        startBackgroundReporter(session);
        if (state.keepalive) startKeepaliveAudio(); // 保活模式已启用：开始学习即正式启动音频
        $('btn-start').disabled = false;
        $('btn-end').disabled = false;
        updateSessionUi();
        refreshWareRow(session);
      } catch (error) {
        if (state.studySession?.serial === serial) state.studySession = null;
        refreshStatusChip(); // 开始失败：会话没立起来，右上角回到已登录
        if (!state.studySession) stopKeepaliveAudio(); // 启动失败：不留无会话的空转音频（模式保持，下次开始再启）
        if (state.pendingStudy) showPendingPanel(state.pendingStudy.detail, state.pendingStudy.ware);
        else resetPanelIdle();
        showSessionNotice(error.message || '开始学习失败', 'error');

    }
    function updateSessionUi() {
      const session = state.studySession;
      if (!session) return;
      const progressMs = getSessionProgressMs(session);
      const pct = session.totalMs > 0 ? Math.min(100, (progressMs / session.totalMs) * 100) : 0;
      $('session-course').textContent = session.course?.CourseName ?? session.course?.courseName ?? '';
      $('session-ware').textContent = session.ware?.WareName ?? session.ware?.wareName ?? '';
      // 拖动预览中不覆盖填充与时间（否则每秒刷新会和手指抢进度条）
      if (!seekDrag) {
        $('session-progress-fill').style.width = `${pct}%`;
        $('session-time-text').textContent = `${formatClock(progressMs)} / ${formatClock(session.totalMs)}`;
        $('mini-fill').style.width = `${pct}%`;
        $('mini-time').textContent = `${formatClock(progressMs)} / ${formatClock(session.totalMs)}`;
      }
      $('btn-start').textContent = session.paused ? '继续' : '暂停';
      setPanelStateClass(session.paused ? 'st-paused' : 'st-playing');
      // 小型学习台同步：课件名（溢出轮播）、已学/全时长、进度背景色
      syncMiniWare(session);
      // 进度到顶立即触发完成：之前完成只在 5 分钟定时同步里检测，进度条走满后最长要等 5 分钟才有反应，
      // 看着就像卡死了；这里由每秒 UI 刷新直接触发最终同步，失败时按重试间隔节流、不刷屏请求
      if (session.active && !session.paused && !session.syncing && progressMs >= Math.max(1, session.totalMs) - 1) {
        const now = Date.now();
        if (now - (session.completionAttemptedAt || 0) >= CONFIG.BACKGROUND_SYNC_RETRY_DELAY_MS) {
          session.completionAttemptedAt = now;
          void syncSessionProgress(session);
        }
      }
    }
    // 进度条拖动快进（仅学习中）：只增不减、单次至少增加 1 分钟、拖动后立即上传、3 秒冷却
    const SEEK_MIN_GAIN_MS = 60000;
    const SEEK_COOLDOWN_MS = 3000;
    let seekDrag = null; // { pointerId, targetMs }：拖动中 updateSessionUi 不覆盖预览
    function seekProgressFromClientX(track, clientX) {
      const session = state.studySession;
      if (!session || session.totalMs <= 0) return null;
      const r = track.getBoundingClientRect();
      const ratio = r.width > 0 ? Math.min(1, Math.max(0, (clientX - r.left) / r.width)) : 0;
      const currentMs = getSessionProgressMs(session);
      // 只允许增加：预览下限钳制在当前进度，手指往回拖时填充停在原地
      return { currentMs, targetMs: Math.min(session.totalMs, Math.max(currentMs, Math.round(ratio * session.totalMs))) };
    }
    function renderSeekPreview(targetMs, totalMs) {
      const fill = $('session-progress-fill');
      fill.style.transition = 'none'; // 拖动预览跟手，不走 0.3s 平滑
      fill.style.width = `${totalMs > 0 ? Math.min(100, (targetMs / totalMs) * 100) : 0}%`;
      $('session-time-text').textContent = `${formatClock(targetMs)} / ${formatClock(totalMs)}`;
    }
    // 拖动后上传：若正有同步在途，等它结束再补一次（最多等 3 秒），保证拖动后一定上传最新进度
    function syncAfterSeek(session, waitedMs = 0) {
      if (!session || state.studySession?.serial !== session.serial) return;
      if (session.syncing) {
        if (waitedMs >= 3000) return; // 在途同步按旧进度上报，随后由定时/暂停/结束补齐
        setTimeout(() => syncAfterSeek(session, waitedMs + 300), 300);
        return;
      }
      void syncSessionProgress(session);
    }
    function bindSeekBar() {
      const row = $('session-panel')?.querySelector('.session-progress-row');
      const track = $('session-panel')?.querySelector('.session-pbar');
      if (!row || !track || row.dataset.seekBound) return;
      row.dataset.seekBound = '1';
      row.addEventListener('pointerdown', (event) => {
        const session = state.studySession;
        if (!session?.active || seekDrag) return;
        // 命中判定：轨道左右各放宽 4px、上下各放宽 8px（手指好点），点到时间文字上不触发
        const r = track.getBoundingClientRect();
        if (event.clientX < r.left - 4 || event.clientX > r.right + 4 || event.clientY < r.top - 8 || event.clientY > r.bottom + 8) return;
        if (session.seekCooldownUntil && Date.now() < session.seekCooldownUntil) {
          showToast('拖动太频繁，3 秒后再试');
          return;
        }
        const pos = seekProgressFromClientX(track, event.clientX);
        if (!pos) return;
        event.preventDefault();
        event.stopPropagation(); // 不触发面板拖动
        seekDrag = { pointerId: event.pointerId, targetMs: pos.targetMs, startMs: pos.currentMs };
        try { row.setPointerCapture(event.pointerId); } catch { /* 忽略 */ }
        renderSeekPreview(pos.targetMs, session.totalMs);
      });
      row.addEventListener('pointermove', (event) => {
        if (!seekDrag || event.pointerId !== seekDrag.pointerId) return;
        const session = state.studySession;
        if (!session) return;
        const pos = seekProgressFromClientX(track, event.clientX);
        if (!pos) return;
        seekDrag.targetMs = pos.targetMs;
        renderSeekPreview(pos.targetMs, session.totalMs);
      });
      row.addEventListener('pointerup', (event) => {
        if (!seekDrag || event.pointerId !== seekDrag.pointerId) return;
        const session = state.studySession;
        const targetMs = seekDrag.targetMs;
        const startMs = seekDrag.startMs;
        seekDrag = null;
        $('session-progress-fill').style.transition = '';
        if (!session?.active) { updateSessionUi(); return; }
        const currentMs = getSessionProgressMs(session);
        const reachedEnd = targetMs >= Math.max(1, session.totalMs) - 1;
        // 增量按按下时刻算：播放中松手时刻的当前进度比按下时多走了拖动耗时，拖满 60 秒按住几秒再松手会被误判为不足 60 秒
        if (reachedEnd || targetMs >= (startMs ?? currentMs) + SEEK_MIN_GAIN_MS) {
          session.baseMs = targetMs;
          if (!session.paused) session.startedAt = Date.now(); // 播放中从新进度继续计时；暂停中 startedAt 保持 0，进度冻结在新值
          session.seekCooldownUntil = Date.now() + SEEK_COOLDOWN_MS;
          updateSessionUi();
          syncAfterSeek(session);
        } else {
          updateSessionUi(); // 恢复原进度显示
          showToast('每次拖动至少增加 1 分钟');
        }
      });
      row.addEventListener('pointercancel', () => {
        if (!seekDrag) return;
        seekDrag = null;
        $('session-progress-fill').style.transition = '';
        updateSessionUi(); // 取消则不提交，恢复原进度
      });
    }
    // 迷你台显示待学习课件：课件名（溢出轮播）、已学/总时长、进度条（与待开始面板同一套逻辑）
    function syncMiniFromPending(detail, ware) {
      const span = $('mini-ware');
      const name = ware?.WareName ?? ware?.wareName ?? '—';
      span.dataset.wareId = `pending:${String(ware?.WareId ?? ware?.wareId ?? '')}`;
      span.dataset.name = name;
      span.textContent = name;
      $('mini-ware-wrap').classList.remove('marquee');
      resolveMediaDurationMs(ware).then((totalMs) => {
        if (state.pendingStudy?.ware !== ware) return; // 已切换到其他课件，丢弃
        const baseMs = normalizeBaseProgressMs(ware, totalMs || 0);
        const pct = totalMs > 0 ? Math.min(100, (baseMs / totalMs) * 100) : 0;
        $('mini-fill').style.width = `${pct}%`;
        $('mini-time').textContent = `${formatClock(baseMs)} / ${formatClock(totalMs || 0)}`;
        refreshMiniMarquee();
      }).catch(() => { /* 解析失败则保持原样 */ });
    }
    function syncMiniWare(session) {
      const span = $('mini-ware');
      const wareId = String(session.ware?.WareId ?? session.ware?.wareId ?? '');
      const name = session.ware?.WareName ?? session.ware?.wareName ?? '—';
      if (span.dataset.wareId === wareId) return;
      span.dataset.wareId = wareId;
      span.dataset.name = name;
      span.textContent = name;
      $('mini-ware-wrap').classList.remove('marquee');
      refreshMiniMarquee();
    }
    // 迷你台课件名溢出时轮播（必须在可见时测量）
    function refreshMiniMarquee() {
      const wrap = $('mini-ware-wrap');
      const span = $('mini-ware');
      const name = span.dataset.name || span.textContent || '';
      if (!name || wrap.clientWidth === 0) return;
      span.textContent = name;
      wrap.classList.remove('marquee');
      if (span.scrollWidth > wrap.clientWidth + 4) {
        span.textContent = `${name}\u00A0\u00A0\u00A0\u00A0${name}`;
        wrap.classList.add('marquee');
      }
    }
    function refreshWareRow(session) {
      const wareId = String(session.ware?.WareId ?? session.ware?.wareId ?? '');
      if (!wareId) return;
      const progressMs = getSessionProgressMs(session);
      // 与完成判定一致：差总时长 1ms 内即算完成，不用 floor（否则自然学完显示 99%）
      const done = progressMs >= Math.max(1, session.totalMs) - 1;
      const pct = done ? 100 : (session.totalMs > 0 ? Math.floor(Math.min(100, (progressMs / session.totalMs) * 100)) : 0);
      // 进行中右侧同步加总时长（与列表初次渲染一致）
      const totalSec = safeNumber(session.ware?.total ?? session.ware?.Total);
      const totalText = totalSec > 0 ? ` · ${formatHms(totalSec)}` : '';
      document.querySelectorAll(`#module-plan .ware-row[data-ware-id="${CSS.escape(wareId)}"] .ware-meta, #module-center .ware-row[data-ware-id="${CSS.escape(wareId)}"] .ware-meta, #module-mine .ware-row[data-ware-id="${CSS.escape(wareId)}"] .ware-meta, #module-elective .ware-row[data-ware-id="${CSS.escape(wareId)}"] .ware-meta`).forEach((meta) => {
        meta.textContent = pct >= 100 ? '已完成' : `${pct}%${totalText}`;
        meta.classList.toggle('hot', pct > 0 && pct < 100);
        meta.closest('.ware-row')?.classList.toggle('done', pct >= 100);
      });
    }
    async function pauseSession() {
      const session = state.studySession;
      if (!session?.active || session.pauseBusy) return; // 暂停/继续连点：第一次的同步未完成前忽略后续点击
      session.pauseBusy = true;
      try {
      if (session.paused) {
        session.paused = false;
        session.startedAt = Date.now();
        // 继续不重置 baseMs：暂停时 baseMs 已冻结在暂停点；若暂停同步失败，lastSyncMs 还是旧值，
        // 重置会把暂停前（以及暂停时拖动）的进度全部丢掉，改回旧值后下一次上报还会把服务端进度拉回去
        session.nextSyncAt = Date.now() + CONFIG.PROGRESS_FIRST_SYNC_DELAY_MS;
        startBackgroundReporter(session); // 继续要重启后台上报：暂停时 worker 已停，光重排闹钟唤不回来
        if (state.keepalive) startKeepaliveAudio(); // 继续：按保活模式决定是否启动音频
        updateSessionUi();
        return;
      }
      session.paused = true;
      session.baseMs = getSessionProgressMs(session);
      session.startedAt = 0;
      stopBackgroundReporter();
      stopKeepaliveAudio(); // 暂停：如音频在启动中则关闭（模式保持）
      updateSessionUi();
      await syncSessionProgress(session);
      } finally {
        session.pauseBusy = false;
      }
    }
    async function stopSession({ silent = false, syncBeforeStop = true, keepAudio = false } = {}) {
      const session = state.studySession;
      state.studySession = null;
      refreshStatusChip(); // 会话结束：右上角回到已登录
      state.pendingStudy = null;
      stopBackgroundReporter();
      if (!keepAudio) stopKeepaliveAudio(); // 连学中转课件时 keepAudio=true，不断开保活音频
      if (session?.timerId) clearInterval(session.timerId);
      if (session?.active && syncBeforeStop && state.auth) {
        try {
          const progressMs = getSessionProgressMs(session);
          const prevReportedMs = Math.max(session.lastSyncMs || 0, session.baseMs || 0);
          beginReporting(); // 结束前最终上报：边框七彩跑马灯，按请求实际起止显示
          try {
            await runWithTransientRetry(() => requestJson({
              path: CONFIG.AFTER_WARE_PATH, method: 'GET',
              query: buildProgressSyncQuery(session, progressMs), authRequired: false
            }));
          } finally {
            endReporting();
          }
          recordDailyReport(progressMs - prevReportedMs);
          // 结束时最终进度回写：课件 cell 与课程 cell 原地更新，不重拉列表
          if (session.ware && session.totalMs > 0) {
            const done = progressMs >= Math.max(1, session.totalMs) - 1;
            session.ware.Progress = done ? 100 : Math.floor(Math.min(100, (progressMs / session.totalMs) * 100));
          }
          refreshWareRow(session);
          refreshCourseCell(session.module, session.detail);
        } catch { /* 结束时同步失败不打扰 */ }
      }
      if (session) session.active = false;
      clearSelectedWareRow();
      $('btn-start').disabled = true;
      $('btn-end').disabled = true;
      refreshSpeedButton();
      if (!silent) void loadSummary().catch(() => {});
    }
    async function completeSession(session) {
      // 学完立即把所有模块里该课件的行标为已完成（不只靠后续列表重拉）
      markWareRowComplete(session.ware);
      showSessionNotice('本课件已学完，正在同步最终进度…', 'success');
      if (state.autoStudy) {
        await advanceAutoStudy(session);
      } else {
        await stopSession({ syncBeforeStop: true });
        collapseToBallAnimated();
      }
    }

    // 课件结束时只更新该课件所在课程 cell：按 detail.wares（与会话共享对象，已回写最新进度）
    // 重算课程状态，原地改 .course-state 的文字与 class；不重拉整个列表，避免页面抖动。
    // 我的学习 tab 归属（学习中/已完成）与计划总进度仍以下次列表加载为准。
    function refreshCourseCell(module, detail) {
      const wares = detail?.wares;
      if (!Array.isArray(wares) || !wares.length) return;
      const course = detail.course || {};
      const courseId = String(course?.id ?? course?.CourseId ?? course?.courseId ?? '');
      if (!courseId) return;
      const scope = module === 'center' ? '#module-center' : module === 'mine' ? '#module-mine' : module === 'elective' ? '#module-elective' : '#module-plan';
      const stateEl = document.querySelector(`${scope} .course-row[data-course-id="${CSS.escape(courseId)}"] .course-state`);
      if (!stateEl) return;
      const doneCount = wares.filter((w) => wareProgress(w) >= 100).length;
      const anyProgress = wares.some((w) => wareProgress(w) > 0);
      // 保留 meta 后缀（如“ · 3 个课件”）：只换状态文字
      const suffix = (stateEl.textContent.match(/ · .*$/) || [''])[0];
      let text; let cls;
      if (doneCount >= wares.length) {
        text = '已完成'; cls = 'done';
        // 我的学习：课程学完后从当前学习中列表移除（切到已完成 tab 时服务端会返回它）
        if (module === 'mine' && state.mine.learnStatus === 1) {
          const row = stateEl.closest('.course-row');
          const wrap = row?.nextElementSibling;
          if (row) row.remove();
          if (wrap && wrap.classList.contains('wares')) wrap.remove();
          if (state.mine.openCourseKey === `mine:${courseId}`) state.mine.openCourseKey = null;
          state.mine.courses = state.mine.courses.filter((c) => String(c?.CourseId ?? c?.courseId ?? '') !== courseId);
          const listEl = document.querySelector('#mine-list');
          if (listEl && !listEl.querySelector('.course-row')) {
            listEl.innerHTML = '<div class="empty-state">还没有在学的课程，去学习计划或课程中心找课吧</div>';
          }
          return;
        }
      }
      else if (module === 'mine') { text = '学习中'; cls = 'doing'; }
      else if (!anyProgress) { text = '未开始'; cls = ''; }
      else {
        cls = 'doing';
        // 原来带百分比的（如“进行中 45%”）按课件平均进度重算；原来只有“进行中”的保持原样
        if (/进行中\s*\d+%/.test(stateEl.textContent)) {
          const avg = Math.floor(wares.reduce((sum, w) => sum + wareProgress(w), 0) / wares.length);
          text = `进行中 ${avg}%`;
        } else text = '进行中';
      }
      stateEl.textContent = text + suffix;
      stateEl.className = `course-state${cls ? ` ${cls}` : ''}`;
    }

    /* ================= 连续学习 ================= */
    // 停止连学（静默收尾）
    async function stopAutoStudyQuiet() {
      state.autoStudy = false;
      state.autoStudyCount = 0;
      $('auto-study-toggle').checked = false;
      await stopSession({ syncBeforeStop: true });
      collapseToBallAnimated();
    }
    async function advanceAutoStudy(finishedSession) {
      if (!state.autoStudy) {
        await stopAutoStudyQuiet();
        return;
      }
      // 连学上限 5 个课件：detail.wares 由 getCourseDetail 统一构建，各模块场景通用
      if (state.autoStudyCount >= CONFIG.AUTO_STUDY_MAX_WARES) {
        state.autoStudy = false;
        state.autoStudyCount = 0;
        $('auto-study-toggle').checked = false;
        await stopSession({ syncBeforeStop: true });
        showSessionNotice(`已连续学习 ${CONFIG.AUTO_STUDY_MAX_WARES} 个课件，自动连学停止`, 'info');
        setTimeout(() => { if (!state.studySession && !state.pendingStudy) collapseToBallAnimated(); }, 2600);
        return;
      }
      const detail = finishedSession.detail || null;
      const wares = detail?.wares || [];
      const idx = wares.findIndex((w) => String(w?.WareId ?? w?.wareId) === String(finishedSession.ware?.WareId ?? finishedSession.ware?.wareId));
      // 连学直接跳过外部 H5：课程级 source==1，或课件级 Type!=3
      const next = wares.slice(idx + 1).find((w) => wareProgress(w) < 100 && !isH5Course(detail?.course) && !isH5Ware(w));
      if (next && detail) {
        state.autoStudyCount += 1;
        await stopSession({ silent: true, syncBeforeStop: true, keepAudio: true }); // 连学中不断保活音频
        await startSession(detail, next, finishedSession.module);
        return;
      }
      state.autoStudy = false;
      state.autoStudyCount = 0;
      $('auto-study-toggle').checked = false;
      await stopSession({ syncBeforeStop: true });
      showSessionNotice('连续学习已完成本课程全部课件', 'success');
      setTimeout(() => { if (!state.studySession && !state.pendingStudy) collapseToBallAnimated(); }, 2600);
    }
    /* ================= 兑换积分 ================= */
    function stopExchangeViewTimers() {
      if (state.exchange.smsTimerId) { clearInterval(state.exchange.smsTimerId); state.exchange.smsTimerId = null; }
      state.exchange.smsCountdown = 0;
      const btn = $('exchange-send-sms');
      if (btn) { btn.disabled = !state.exchange.selectedNodeKey; btn.textContent = '获取验证码'; }
    }
    function getExchangeNodeKey(node) {
      return `${safeNumber(node?.metaTime)}_${safeNumber(node?.metaIntegral)}`;
    }
    function getExchangeNodeDescription(node) {
      const metaTime = safeNumber(node?.metaTime);
      const metaIntegral = safeNumber(node?.metaIntegral);
      return `${metaTime} 分钟 → ${metaIntegral} 积分`;
    }
    function canSelectExchangeNode(node) {
      // 兑换资格只看服务端：canExchange / isExchange 与服务端时长；服务端返回 0/1 数字，需归一化后判断
      return node && isTruthyFlag(node.canExchange) && !isTruthyFlag(node.isExchange)
        && safeNumber(node?.metaTime) <= safeNumber(state.studyDuration);
    }
    // 兑换/积分加载防连点：进行中的加载直接忽略，避免第二次请求撞 lock 后刷出错误态或多余提示
    let exchangeLoading = false;
    let integralLoading = false;
    async function loadExchangeView() {
      if (exchangeLoading) return;
      exchangeLoading = true;
      const tierList = $('tier-list');
      tierList.innerHTML = '<div class="empty-state">正在加载兑换规则…</div>';
      try {
        const response = await requestJson({ path: CONFIG.STUDY_INFO_PATH, method: 'POST', lockKey: 'exchange-info' });
        const duration = safeNumber(response?.data?.duration);
        state.tiers = Array.isArray(response?.data?.node) ? response.data.node : [];
        state.studyDuration = duration;
        $('exchange-duration').textContent = Math.round(duration).toLocaleString('zh-CN');
        renderHero();
        renderTiers();
        updateExchangeForm();
        await loadExchangeHistory();
      } catch (error) {
        tierList.innerHTML = `<div class="empty-state">加载失败：${esc(error.message)}<br><button class="text-button" id="retry-tiers" type="button">点击重试</button></div>`;
        $('retry-tiers')?.addEventListener('click', () => void loadExchangeView());
      } finally {
        exchangeLoading = false;
      }
    }
    function renderTiers() {
      const tierList = $('tier-list');
      tierList.innerHTML = '';
      if (!state.tiers.length) { tierList.innerHTML = '<div class="empty-state">暂无可兑换档位</div>'; return; }
      const sorted = [...state.tiers].sort((a, b) => safeNumber(a?.metaTime) - safeNumber(b?.metaTime));
      sorted.forEach((node) => {
        const key = getExchangeNodeKey(node);
        const need = safeNumber(node?.metaTime);
        const got = safeNumber(node?.metaIntegral);
        const claimed = isTruthyFlag(node?.isExchange);
        const eligible = canSelectExchangeNode(node);
        const have = safeNumber(state.studyDuration);
        const pct = need > 0 ? Math.min(100, (have / need) * 100) : 100;
        const card = document.createElement('div');
        card.className = `tier${eligible ? ' eligible' : ''}${claimed ? ' claimed' : ''}`;
        const statusText = claimed ? '已兑换' : (eligible ? '可兑换' : `还差 ${Math.max(0, Math.ceil(need - have))} 分钟`);
        card.innerHTML = `
          <div class="tier-top">
            <div class="tier-title">${need} 分钟 <span class="muted">→</span> ${got} 积分</div>
            <div class="tier-sub num">${Math.min(Math.floor(have), need)} / ${need}</div>
          </div>
          <div class="pbar brand"><div style="width:${pct}%"></div></div>
          <div class="tier-foot">
            <span class="tier-sub">${statusText}</span>
            ${claimed ? '' : `<button class="secondary-button tier-action" type="button" ${eligible ? '' : 'disabled'}>${state.exchange.selectedNodeKey === key ? '已选择' : '选择'}</button>`}
          </div>`;
        const btn = card.querySelector('.tier-action');
        if (btn) btn.addEventListener('click', () => {
          state.exchange.selectedNodeKey = key;
          renderTiers();
          updateExchangeForm();
          $('exchange-selected').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        tierList.appendChild(card);
      });
    }
    function updateExchangeForm() {
      const node = state.tiers.find((n) => getExchangeNodeKey(n) === state.exchange.selectedNodeKey);
      const valid = canSelectExchangeNode(node);
      if (!valid) state.exchange.selectedNodeKey = null;
      const target = state.tiers.find((n) => getExchangeNodeKey(n) === state.exchange.selectedNodeKey);
      $('exchange-selected').innerHTML = target
        ? `已选择：<b>${esc(getExchangeNodeDescription(target))}</b>`
        : '请先选择兑换档位';
      $('exchange-send-sms').disabled = !target || state.exchange.smsCountdown > 0;
      $('exchange-submit').disabled = !target;
    }
    function startSmsCountdown() {
      stopExchangeViewTimers();
      state.exchange.smsCountdown = 60;
      const btn = $('exchange-send-sms');
      btn.disabled = true;
      btn.textContent = `重新获取(${state.exchange.smsCountdown}s)`;
      state.exchange.smsTimerId = setInterval(() => {
        state.exchange.smsCountdown -= 1;
        if (state.exchange.smsCountdown <= 0) { stopExchangeViewTimers(); updateExchangeForm(); return; }
        btn.textContent = `重新获取(${state.exchange.smsCountdown}s)`;
      }, 1000);
    }
    async function sendExchangeSms() {
      const button = $('exchange-send-sms');
      try {
        setButtonBusy(button, true, '发送中…');
        await requestJson({
          path: CONFIG.STUDY_EXCHANGE_SEND_SMS_PATH, method: 'POST',
          body: { type: 1 }, lockKey: 'exchange-sms'
        });
        startSmsCountdown();
        showSessionExchangeNotice('验证码已发送，请注意查收短信', 'success');
      } catch (error) {
        button.disabled = false;
        showSessionExchangeNotice(error.message || '验证码发送失败', 'error');
      } finally {
        setButtonBusy(button, false);
        updateExchangeForm();
      }
    }
    function showSessionExchangeNotice(message) {
      if (message) showToast(message);
    }
    async function submitExchange() {
      const node = state.tiers.find((n) => getExchangeNodeKey(n) === state.exchange.selectedNodeKey);
      if (!canSelectExchangeNode(node)) { showSessionExchangeNotice('请先选择可兑换的档位', 'warning'); return; }
      const code = $('exchange-sms-code').value.trim();
      if (!/^\d{4,12}$/.test(code)) { showSessionExchangeNotice('请输入正确的短信验证码', 'warning'); return; }
      if (!window.confirm(`确认使用 ${safeNumber(node.metaTime)} 分钟学习时长兑换 ${safeNumber(node.metaIntegral)} 积分？`)) return;
      const button = $('exchange-submit');
      try {
        setButtonBusy(button, true, '提交中…');
        await requestJson({
          path: CONFIG.STUDY_EXCHANGE_SUBMIT_PATH, method: 'POST',
          // HAR 已验证：服务端按 nodeKey 认档位（METAKEY，如 StudyEx_node_1），验证码字段是 smsCode；
          // 之前发 studyTime/integral/exchangeCode，服务端认不出档位 → “兑换档位不能为空”
          body: { nodeKey: node.METAKEY ?? node.metaKey ?? getExchangeNodeKey(node), smsCode: code },
          lockKey: 'exchange-submit'
        });
        showSessionExchangeNotice('兑换成功，积分已到账', 'success');
        $('exchange-sms-code').value = '';
        state.exchange.selectedNodeKey = null;
        stopExchangeViewTimers();
        await loadExchangeView();
        await loadSummary().catch(() => {});
      } catch (error) {
        showSessionExchangeNotice(error.message || '兑换提交失败', 'error');
      } finally {
        setButtonBusy(button, false);
        updateExchangeForm();
      }
    }
    async function loadExchangeHistory() {
      const listEl = $('exchange-history');
      try {
        const response = await requestJson({ path: CONFIG.STUDY_EXCHANGE_DATA_PATH, method: 'POST', lockKey: 'exchange-history' });
        const list = response?.data || response?.resultList || [];
        const records = Array.isArray(list) ? list : [];
        if (!records.length) { listEl.innerHTML = '<div class="empty-state">暂无兑换记录</div>'; return; }
        listEl.innerHTML = '';
        records.slice(0, 30).forEach((item) => {
          const row = document.createElement('div');
          row.className = 'history-item';
          row.innerHTML = `
            <div><div class="history-title">${esc(item?.exchangeName || item?.name || '学习时长兑换')}</div>
            <div class="history-meta">${esc(formatDateTime(item?.exchangeTime || item?.createTime))}</div></div>
            <div class="history-points">+${esc(String(item?.integral ?? item?.exchangeIntegral ?? '—'))}</div>`;
          listEl.appendChild(row);
        });
      } catch {
        listEl.innerHTML = '<div class="empty-state">兑换记录加载失败</div>';
      }
    }

    /* ================= 积分记录 ================= */
    function getIntegralDelta(record) {
      const raw = record?.integral ?? record?.score ?? 0;
      const n = safeNumber(raw);
      return n;
    }
    function integralRecordKey(record) {
      return String(record?.recordId ?? `${record?.actionCode}_${record?.getTime}_${record?.integral}`);
    }
    function classifyIntegralRecords(list) {
      const earned = [];
      const spent = [];
      (Array.isArray(list) ? list : []).forEach((record) => {
        const delta = getIntegralDelta(record);
        const category = String(record?.inteCategroy ?? '');
        if (delta < 0 || category === '2' || /消费|扣|兑换-/i.test(String(record?.actionName || ''))) spent.push(record);
        else earned.push(record);
      });
      return { earned, spent };
    }
    async function loadIntegralRecords() {
      if (integralLoading) return;
      integralLoading = true;
      const earnedList = $('integral-earned-list');
      const spentList = $('integral-spent-list');
      try {
        const [earnedResp, spentResp] = await Promise.all([
          requestJson({ path: CONFIG.INTEGRAL_LIST_PATH, method: 'POST', body: { scoreType: 0, pageIndex: 1, pageSize: 50 }, lockKey: 'integral-earned' }),
          requestJson({ path: CONFIG.INTEGRAL_LIST_PATH, method: 'POST', body: { scoreType: 1, pageIndex: 1, pageSize: 50 }, lockKey: 'integral-spent' })
        ]);
        const earned = earnedResp?.resultList || earnedResp?.data || [];
        const spent = spentResp?.resultList || spentResp?.data || [];
        state.integralRecords = { earned: Array.isArray(earned) ? earned : [], spent: Array.isArray(spent) ? spent : [] };
        renderRecordList(earnedList, state.integralRecords.earned, true);
        renderRecordList(spentList, state.integralRecords.spent, false);
      } catch (error) {
        showToast(error.message || '积分记录加载失败');
      } finally {
        integralLoading = false;
      }
    }
    function renderRecordList(container, records, isEarned) {
      container.innerHTML = '';
      if (!records.length) { container.innerHTML = '<div class="empty-state">暂无记录</div>'; return; }
      records.forEach((record) => {
        const delta = getIntegralDelta(record);
        const sign = delta > 0 ? '+' : '';
        const row = document.createElement('div');
        row.className = 'record-item';
        row.innerHTML = `
          <div><div class="record-title">${esc(record?.actionName || '—')}</div>
          <div class="record-meta">${esc(formatDateTime(record?.getTime))}${record?.integralDesc ? ` · ${esc(record.integralDesc)}` : ''}</div></div>
          <div class="record-points ${isEarned ? 'positive' : 'negative'}">${sign}${delta}</div>`;
        container.appendChild(row);
      });
    }

    /* ================= 初始化 ================= */
    function bindStaticEvents() {
      // 密码框显隐切换
      $('toggle-password').addEventListener('click', () => {
        const input = $('password');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        const btn = $('toggle-password');
        btn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        btn.setAttribute('aria-pressed', String(show));
        btn.querySelectorAll('svg').forEach((s) => s.classList.toggle('hidden'));
        input.focus();
      });
      $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = $('username').value.trim();
        const password = $('password').value;
        const domain = $('domain').value.trim();
        if (!username) { showToast('请输入账号'); $('username').focus(); return; }
        if (!password) { showToast('请输入密码'); $('password').focus(); return; }
        if (!domain) { showToast('请输入企业域'); $('domain').focus(); return; }
        const button = $('login-button');
        try {
          setButtonBusy(button, true, '登录中…');
          await login(username, password, domain);
          saveRemember(username, domain, $('remember-me').checked);
          renderAuthState();
          void afterLogin();
        } catch (error) {
          showToast(error.message || '登录失败');
        } finally {
          setButtonBusy(button, false);
        }
      });

      $('status-chip').addEventListener('click', () => {
        if (!state.auth) return;
        if (window.confirm('确认退出登录？')) logout();
      });

      // 主界面 Hero 入口：点分钟数进兑换，点积分可用进积分记录
      $('hero-duration-card').addEventListener('click', () => { switchView('exchange-view'); void loadExchangeView(); });
      $('hero-goal-card').addEventListener('click', () => { switchView('exchange-view'); void loadExchangeView(); });
      $('hero-points-card').addEventListener('click', () => { switchView('integral-view'); void loadIntegralRecords(); });
      $('exchange-back').addEventListener('click', goBackToStudy);
      $('integral-back').addEventListener('click', goBackToStudy);
      // 浏览器返回：二级页面压过历史，返回先回到学习；前进则恢复对应二级页面
      window.addEventListener('popstate', (event) => {
        const view = event.state?.view;
        if (view === 'exchange-view' || view === 'integral-view') {
          state.subViewPushed = true;
          switchView(view, { fromHistory: true });
          if (view === 'exchange-view') void loadExchangeView();
          else void loadIntegralRecords();
        } else {
          state.subViewPushed = false;
          switchView('study-view', { fromHistory: true });
        }
      });

      document.querySelectorAll('#integral-tabs button').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('#integral-tabs button').forEach((b) => {
            const on = b === button;
            b.classList.toggle('active', on);
            b.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          const tab = button.dataset.tab;
          $('integral-earned-list').classList.toggle('hidden', tab !== 'earned');
          $('integral-spent-list').classList.toggle('hidden', tab !== 'spent');
        });
      });

      // 开始按钮：待开始时开始学习，学习中时暂停/继续二合一
      // 速按钮：直接学完当前课件（二次确认，风险操作）
      $('btn-speed').addEventListener('click', onSpeedButtonClick);
      $('btn-start').addEventListener('click', () => {
        if (state.studySession?.active) void pauseSession();
        else void startSessionFromSelection();
      });
      // 结束按钮：学习中时结束并同步，待开始时等同取消选择
      $('btn-end').addEventListener('click', async () => {
        // 已完成课件：结束只做 dismiss，不上报、不确认（正常结束仍需确认并同步）
        const currentWare = state.studySession?.ware ?? state.pendingStudy?.ware;
        if (currentWare && wareProgress(currentWare) >= 100) {
          if (state.studySession?.active) {
            await stopSession({ syncBeforeStop: false });
            collapseToBallAnimated();
          } else {
            cancelSelection();
          }
          return;
        }
        if (state.studySession?.active) {
          if (!window.confirm('结束本次学习并同步进度？')) return;
          await stopSession({ syncBeforeStop: true });
          collapseToBallAnimated();
        } else {
          cancelSelection();
        }
      });
      // 右上角缩小：播放中→迷你台（出现在面板当前位置），未播/暂停→悬浮球
      $('btn-minimize').addEventListener('click', () => {
        const s = state.studySession;
        // 当前存在课件（学习中或已选中待学）时缩小进迷你台，否则回悬浮球
        if (s?.active || state.pendingStudy) {
          if (!s?.active && state.pendingStudy) syncMiniFromPending(state.pendingStudy.detail, state.pendingStudy.ware);
          minimizeToMini();
        } else collapseToBallAnimated();
      });
      // 迷你台无按钮，点击整个迷你台展开为控制台（拖动不会误触发）
      $('session-mini').addEventListener('click', () => expandPanelFromMini());
      $('session-mini').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); expandPanelFromMini(); }
      });
      // 悬浮球恒为书本图标，点击总是打开控制台
      $('session-ball').addEventListener('click', () => expandPanelFromBall());
      // 后台回来对账：计时按时间戳累计不受影响，这里只补到期的上报（一次）、确认排期、刷新 UI
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) void reconcileAfterVisible();
      });
      // 刷新/切走页面时保存控制台位置（恢复时用）
      window.addEventListener('pagehide', saveFloatPosition);
      makeFloatDraggable($('session-ball'));
      makeFloatDraggable($('session-mini'));
      makeFloatDraggable($('session-panel'));
      bindSeekBar(); // 学习中进度条拖动快进
      $('auto-study-toggle').addEventListener('change', (event) => {
        // 开关只改变状态，不改变布局；打开时 toast 提示上限
        state.autoStudy = event.target.checked;
        if (state.autoStudy) {
          if (state.autoStudyCount < 1) state.autoStudyCount = 1;
          showToast('连学已开启：最大连续学习 5 个课件');
        } else {
          state.autoStudyCount = 0;
        }
      });
      // 保活开关只代表"启用此模式"：音频在开始学习时启动、学完/结束时关闭；打开时 toast 提示局限性
      $('keepalive-toggle').addEventListener('change', (event) => {
        const on = event.target.checked;
        setKeepalive(on);
        if (on && state.keepalive) showToast('保活已开启：基于无声音频方式，非 100% 有效');
      });

      $('refresh-exchange').addEventListener('click', () => void loadExchangeView());
      $('refresh-exchange-history').addEventListener('click', () => void loadExchangeHistory());
      $('exchange-send-sms').addEventListener('click', () => void sendExchangeSms());
      $('exchange-submit').addEventListener('click', () => void submitExchange());

      document.querySelectorAll('#learn-module-tabs button').forEach((button) => {
        button.addEventListener('click', () => switchLearnModule(button.dataset.module));
      });
      document.querySelectorAll('#mine-status-tabs button').forEach((button) => {
        button.addEventListener('click', () => switchMineStatus(Number(button.dataset.status)));
      });
      $('cc-reload-top').addEventListener('click', () => void loadCenterTopCourses());
      // 选课中心：加载更多
      $('elective-more').addEventListener('click', () => void loadElectiveCourses({ append: true }));
    }
    async function afterLogin() {
      $('month-label').textContent = `${currentMonthLabel()}学习`;
      try {
        await loadSummary();
      } catch (error) {
        $('hero-goal-text').textContent = `总览加载失败：${error.message}`;
      }
      state.mine.loaded = true;
      await loadMineCourses();
    }
    function boot() {
      document.title = TOOL_META.name;
      $('tool-title').textContent = TOOL_META.name;
      $('tool-version').textContent = `v${TOOL_META.version}`;
      $('footer-text').textContent = `${TOOL_META.name} v${TOOL_META.version} · by ${TOOL_META.author}`;
      state.daily = loadDaily();
      loadRemember();
      loadAuth(); // 恢复上次登录态（若服务端已失效，首次请求会走登录失效流程弹回登录页）
      bindStaticEvents();
      renderAuthState();
      setupHeaderMiniStats();
      if (state.auth) void afterLogin();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  </script>

  <!-- 全局单例浮动学习控制台：悬浮球 / 完整面板 / 小型学习台 -->
  <div id="global-toast" role="status" aria-live="polite"></div>
  <div id="session-float" class="hidden">
    <button id="session-ball" class="session-ball" type="button" aria-label="学习控制台">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
    </button>
    <section id="session-panel" class="panel session hidden" aria-label="学习控制台" aria-live="polite">
      <button id="btn-speed" type="button" aria-label="直接学完当前课件" disabled>速</button>
      <div class="session-top">
        <span id="session-course">—</span>
        <button class="icon-button" id="btn-minimize" type="button" aria-label="缩小">—</button>
      </div>
      <div class="session-ware" id="session-ware">—</div>
      <div class="session-progress-row">
        <div class="pbar session-pbar"><div id="session-progress-fill"></div></div>
        <span class="session-time-text num" id="session-time-text">00:00 / 00:00</span>
      </div>
      <div class="session-actions">
        <button class="primary-button" id="btn-start" type="button" disabled>开始</button>
        <button class="ghost-button" id="btn-end" type="button">结束</button>
        <div class="session-toggles">
          <label class="toggle-label" aria-label="自动连学">
            <span>连学</span>
            <span class="switch"><input type="checkbox" id="auto-study-toggle"><span class="track"><span class="thumb"></span></span></span>
          </label>
          <label class="toggle-label" aria-label="后台保活">
            <span>保活</span>
            <span class="switch"><input type="checkbox" id="keepalive-toggle"><span class="track"><span class="thumb"></span></span></span>
          </label>
        </div>
      </div>
    </section>
    <div id="session-mini" class="session-mini hidden" role="button" tabindex="0" aria-label="小型学习台，点击展开控制台">
      <div class="session-mini-fill" id="mini-fill"></div>
      <div class="session-mini-info">
        <div class="session-mini-ware" id="mini-ware-wrap"><span id="mini-ware">—</span></div>
        <div class="session-mini-time num" id="mini-time">00:00 / 00:00</div>
      </div>
    </div>

</body>
