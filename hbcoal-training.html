<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="name" content="淮矿培训">
  <meta name="version" content="1.21.0">
  <meta name="author" content="Hrimyx">
  <title></title>
  <style>
    :root {
      --brand-primary: #1A6AFF;
      --brand-light: #78A2F8;
      --brand-dark: #0D3B8C;
      --on-brand: #FFFFFF;
      --accent-cyan: #18B8D8;
      --success: #0B9468;
      --warning: #C77A08;
      --danger: #D0445A;
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --surface-alt: #EBEEF5;
      --border: #D0D7E5;
      --text: #1A202C;
      --text-secondary: #4A5568;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0A0F1A;
        --surface: #141C2B;
        --surface-alt: #1F2A3F;
        --border: #2C3A54;
        --text: #E2E8F0;
        --text-secondary: #A0B0C8;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .62; }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .top-fixed-shell {
      position: sticky;
      top: 0;
      z-index: 70;
      padding: 10px 0 9px;
      margin-top: -28px;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(10px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 8px;
    }

    .brand-block { min-width: 0; }
    .brand-title {
      margin: 0;
      font-size: clamp(22px, 3vw, 30px);
      letter-spacing: -.02em;
    }
    .brand-meta {
      margin-top: 6px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .account-area { display: flex; align-items: center; gap: 9px; }
    .account-name { color: var(--text); font-size: 14px; font-weight: 650; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      padding: 8px 11px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 13px;
      appearance: none;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }
    .status-chip.ready .status-dot { background: var(--success); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(13, 59, 140, .05);
    }

    .login-panel {
      max-width: 480px;
      margin: 60px auto 0;
      padding: 26px;
    }
    .panel-title { margin: 0; font-size: 20px; }
    .panel-subtitle { margin: 7px 0 0; color: var(--text-secondary); font-size: 14px; line-height: 1.6; }

    .form-grid {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }
    .field { display: grid; gap: 7px; }
    .field label { font-size: 14px; font-weight: 600; }
    .field input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      min-height: 44px;
      padding: 10px 12px;
      outline: none;
    }
    .field input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-primary) 16%, transparent);
    }
    .field-hint { color: var(--text-secondary); font-size: 12px; }

    .primary-button,
    .secondary-button,
    .ghost-button {
      min-height: 42px;
      border-radius: 10px;
      padding: 9px 15px;
      border: 1px solid transparent;
      transition: background-color .15s ease, border-color .15s ease, transform .05s ease;
    }
    .primary-button {
      background: var(--brand-primary);
      color: var(--on-brand);
    }
    .primary-button:hover { background: var(--brand-dark); }
    .primary-button:active, .secondary-button:active, .ghost-button:active { transform: translateY(1px); }
    .secondary-button {
      background: var(--surface-alt);
      color: var(--text);
      border-color: var(--border);
    }
    .secondary-button:hover { border-color: var(--brand-primary); }
    .ghost-button {
      background: transparent;
      color: var(--brand-primary);
      border-color: var(--border);
    }
    .ghost-button:hover { background: var(--surface-alt); }

    .notice {
      margin-top: 14px;
      min-height: 42px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.55;
      display: none;
    }
    .notice.show { display: block; }
    .notice.error { background: color-mix(in srgb, var(--danger) 9%, var(--surface)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 22%, var(--border)); }
    .notice.success { background: color-mix(in srgb, var(--success) 8%, var(--surface)); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 22%, var(--border)); }
    .notice.info { background: color-mix(in srgb, var(--brand-primary) 7%, var(--surface)); color: var(--text-secondary); border: 1px solid var(--border); }

    .hidden { display: none !important; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 0;
    }
    .stat-card { padding: 6px 9px; }
    .stat-card .stat-label { margin-bottom: 0; }
    .stat-card .stat-value { gap: 4px; margin-top: 1px; line-height: 1.05; }
    .stat-card .stat-foot { margin-top: 0; font-size: 11px; line-height: 1.25; }
    .stat-label-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .icon-button { width:28px; height:28px; padding:0; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text-secondary); cursor:pointer; font-size:17px; line-height:1; }
    .icon-button:hover { border-color:var(--brand-primary); color:var(--brand-primary); }
    .icon-button:disabled { opacity:.55; cursor:not-allowed; }
    .stat-label { color: var(--text-secondary); font-size: 13px; }
    .stat-value { font-size: clamp(18px, 2.4vw, 22px); font-weight: 760; letter-spacing: -.03em; }
    .stat-unit { font-size: 11px; color: var(--text-secondary); margin-left: 3px; font-weight: 500; }
    .stat-foot { margin-top: 5px; color: var(--text-secondary); font-size: 12px; }
    .integral-value { display: inline-flex; align-items: baseline; gap: 2px; white-space: nowrap; }
    .integral-usable { font-size: inherit; font-weight: 760; }
    .integral-total { font-size: .72em; font-weight: 650; color: var(--text-secondary); }
    .integral-separator { font-size: .82em; color: var(--text-secondary); font-weight: 500; margin: 0 1px; }
    .integral-usable-unit { font-size: 1em; color: var(--text-secondary); font-weight: 500; }
    .integral-total-unit { font-size: .72em; color: var(--text-secondary); font-weight: 500; }

    .content-grid {
      display: grid;
      gap: 12px;
      padding-bottom: 406px;
    }
    .plan-panel { padding: 16px; }
    .plan-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr));
      gap: 12px;
      align-items: start;
    }

    .stat-card-link { cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease; }
    .stat-card-link:hover { border-color: color-mix(in srgb, var(--brand-primary) 42%, var(--border)); background: color-mix(in srgb, var(--brand-primary) 3%, var(--surface)); }
    .stat-card-link:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
    .stat-card-link .icon-button { cursor: pointer; }

    .study-dock {
      position: fixed;
      z-index: 80;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: min(1180px, calc(100% - 32px));
      display: grid;
      grid-template-rows: 230px 158px;
      gap: 0;
      pointer-events: none;
    }
    .study-dock > .panel { pointer-events: auto; min-height: 0; }

    .section-panel { padding: 20px; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    .section-title { margin: 0; font-size: 17px; }
    .section-note { margin: 0; color: var(--text-secondary); font-size: 12px; }

    .plan-list, .stage-list, .ware-list { display: grid; gap: 10px; }
    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: var(--text-secondary);
      border: 1px dashed var(--border);
      border-radius: 12px;
      font-size: 13px;
    }

    .plan-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }
    .plan-main {
      width: 100%;
      border: 0;
      padding: 14px 15px;
      display: grid;
      gap: 5px;
      text-align: left;
      background: transparent;
      color: var(--text);
    }
    .plan-main:hover { background: var(--surface-alt); }
    .plan-title-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .plan-name { font-weight: 700; line-height: 1.45; }
    .plan-percent { color: var(--brand-primary); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-alt);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--brand-primary);
      width: 0;
      transition: width .2s ease;
    }
    .plan-meta { color: var(--text-secondary); font-size: 12px; }
    .plan-detail {
      padding: 0 0 12px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 12px;
    }
    .plan-detail .stage-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      padding: 0 0 3px;
      scrollbar-width: thin;
    }

    .stage-card {
      flex: 0 0 auto;
      min-width: 108px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface-alt) 36%, var(--surface));
    }
    .stage-card.active {
      border-color: var(--brand-primary);
      background: color-mix(in srgb, var(--brand-primary) 8%, var(--surface));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand-primary) 18%, transparent);
    }
    .stage-head {
      width: 100%;
      min-height: 34px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: center;
      border: 0;
      border-radius: 6px;
      padding: 5px 6px;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .stage-head:hover { background: var(--surface-alt); }
    .stage-name { font-size: 12px; font-weight: 700; white-space: nowrap; }
    .stage-process { color: var(--text-secondary); font-size: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stage-head-main { min-width: 0; display: flex; align-items: center; gap: 4px; }
    .stage-chevron { color: var(--text-secondary); font-size: 10px; width: 10px; text-align: center; }
    .course-list { display: grid; gap: 7px; margin-top: 2px; padding: 0 0 4px; }
    .course-button {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      text-align: left;
      padding: 10px 11px;
    }
    .course-button:hover { border-color: var(--brand-primary); }
    .course-button.active {
      border-color: var(--brand-primary);
      background: color-mix(in srgb, var(--brand-primary) 15%, var(--surface));
      box-shadow: inset 5px 0 0 var(--brand-primary), 0 0 0 2px color-mix(in srgb, var(--brand-primary) 24%, transparent);
      outline: 1px solid color-mix(in srgb, var(--brand-primary) 32%, transparent);
      outline-offset: 1px;
    }
    .course-button.active .course-title::before {
      content: '✓';
      display: inline-block;
      margin-right: 6px;
      color: var(--brand-primary);
      font-weight: 800;
    }
    .course-button.active .course-title { font-weight: 760; }
    .course-button.in-progress .course-progress { color: var(--brand-primary); }
    .course-button.done { background: color-mix(in srgb, var(--success) 8%, var(--surface)); border-color: color-mix(in srgb, var(--success) 28%, var(--border)); }
    .course-button.done.active {
      background: color-mix(in srgb, var(--brand-primary) 10%, var(--success) 7%, var(--surface));
      border-color: var(--brand-primary);
      box-shadow: inset 4px 0 0 var(--brand-primary), 0 0 0 2px color-mix(in srgb, var(--brand-primary) 18%, transparent);
    }
    .course-title { font-size: 13px; line-height: 1.45; }
    .course-progress { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }


    .study-panel {
      position: relative;
      width: 100%;
      height: 158px;
      padding: 9px 14px 10px;
      border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 26px rgba(13, 59, 140, .13);
      overflow: hidden;
    }
    .study-console-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .study-console-body { margin-top: 7px; }
    .study-course-line { min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
    .study-course-line .study-title, .study-course-line .ware-current-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .study-empty-inline { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
    .study-notice-toast { position: fixed; left: 50%; bottom: 118px; transform: translateX(-50%); width: min(620px, calc(100vw - 32px)); z-index: 90; box-shadow: 0 8px 24px rgba(13, 59, 140, .14); }
    .ware-panel { height: 230px; overflow: hidden; }
    .ware-panel-head {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ware-panel-head .section-title { flex: 0 0 auto; }
    .ware-course-caption {
      min-width: 0;
      margin-left: auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 620;
      text-align: right;
    }
    .ware-list { height: calc(100% - 44px); overflow: auto; padding-right: 3px; }
    .study-title { margin: 0; font-size: 18px; line-height: 1.45; }
    .study-hero {
      margin-top: 14px;
      padding: 14px;
      border-radius: 13px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }
    .ware-current-title { margin-top: 4px; color: var(--text-secondary); font-weight: 650; line-height: 1.35; font-size: 12px; }
    .study-time-line { display: flex; justify-content: space-between; gap: 10px; margin-top: 11px; color: var(--text-secondary); font-size: 13px; }
    .study-time-value { color: var(--text); font-weight: 700; white-space: nowrap; }
    .study-progress-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
    .study-progress-track { flex: 1; min-width: 0; height: 10px; border: 1px solid var(--border); }
    .study-progress-fill { background: var(--accent-cyan); }
    .study-progress-percent { min-width: 38px; text-align: right; color: var(--text-secondary); font-size: 12px; font-weight: 650; }
    .study-actions { margin-top: 11px; display: flex; gap: 6px; flex-wrap: wrap; }
    .study-actions .primary-button,
    .study-actions .secondary-button,
    .study-actions .ghost-button { min-height: 30px; padding: 5px 9px; border-radius: 7px; font-size: 11px; }

    .ware-item {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: stretch;
      min-height: 0;
      border: 1px solid transparent;
      border-bottom: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px 8px;
    }
    .ware-item:last-child { border-bottom: 0; }
    .ware-item.active {
      border-color: var(--brand-primary);
      background: color-mix(in srgb, var(--brand-primary) 15%, var(--surface));
      box-shadow: inset 5px 0 0 var(--brand-primary), 0 0 0 2px color-mix(in srgb, var(--brand-primary) 23%, transparent);
      outline: 1px solid color-mix(in srgb, var(--brand-primary) 30%, transparent);
      outline-offset: 1px;
    }
    .ware-item.active .ware-name::before {
      content: '✓';
      display: inline-block;
      margin-right: 6px;
      color: var(--brand-primary);
      font-weight: 800;
    }
    .ware-item.active .ware-name { font-weight: 760; }
    .ware-item.done { background: color-mix(in srgb, var(--success) 8%, var(--surface)); border-color: color-mix(in srgb, var(--success) 25%, var(--border)); }
    .ware-item.done.active {
      background: color-mix(in srgb, var(--brand-primary) 10%, var(--success) 7%, var(--surface));
      border-color: var(--brand-primary);
      box-shadow: inset 4px 0 0 var(--brand-primary), 0 0 0 2px color-mix(in srgb, var(--brand-primary) 16%, transparent);
    }

    .ware-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; line-height: 1.45; align-self: center; }
    .ware-sub { display: none; }
    .ware-status {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      align-self: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 2px 5px;
      font-size: 10px;
      line-height: 1.2;
      color: var(--text-secondary);
    }
    .badge.active { color: var(--brand-primary); border-color: var(--brand-primary); }
    .badge.done { color: var(--success); border-color: var(--success); }
    .ware-duration { color: var(--text-secondary); font-size: 10px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .study-console-tools { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .switch-control { display: inline-flex; align-items: center; gap: 7px; color: var(--text-secondary); font-size: 11px; white-space: nowrap; user-select: none; cursor: pointer; }
    .switch-control input { position: absolute; opacity: 0; pointer-events: none; }
    .switch-track { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-alt); border: 1px solid var(--border); padding: 2px; display: inline-flex; align-items: center; transition: background-color .15s ease, border-color .15s ease; }
    .switch-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.18); transform: translateX(0); transition: transform .15s ease; }
    .switch-control input:checked + .switch-track { background: var(--brand-primary); border-color: var(--brand-primary); }
    .switch-control input:checked + .switch-track .switch-thumb { transform: translateX(14px); }
    .switch-control input:focus-visible + .switch-track { outline: 2px solid var(--brand-primary); outline-offset: 2px; }

    .feature-view { padding: 12px 0 40px; min-height: calc(100vh - 95px); }
    .feature-view-inner { width: 100%; display: grid; gap: 12px; }
    .feature-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .back-button, .text-button { border: 0; background: transparent; color: var(--brand-primary); padding: 7px 5px; border-radius: 8px; font-size: 13px; }
    .back-button:hover, .text-button:hover { background: var(--surface-alt); }
    .feature-title { margin: 0; font-size: 20px; }
    .feature-subtitle { margin-top: 2px; color: var(--text-secondary); font-size: 12px; }
    .exchange-summary-grid { display: grid; grid-template-columns: minmax(180px, 1fr); gap: 10px; }
    .feature-stat { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 12px 14px; display: flex; align-items: baseline; gap: 5px; }
    .feature-stat span { color: var(--text-secondary); font-size: 12px; }
    .feature-stat strong { margin-left: auto; font-size: 18px; }
    .feature-stat small { color: var(--text-secondary); font-size: 10px; }
    .feature-section { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 13px; }
    .feature-section-head, .record-column-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
    .feature-section-head h3, .record-column-head h3 { margin: 0; font-size: 14px; }
    .exchange-node-list { display: grid; gap: 8px; }
    .exchange-node { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 10px 11px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; }
    .exchange-node.selected { border-color: var(--brand-primary); background: color-mix(in srgb, var(--brand-primary) 8%, var(--surface)); box-shadow: inset 3px 0 0 var(--brand-primary); }
    .exchange-node-title { font-size: 13px; font-weight: 680; line-height: 1.4; }
    .exchange-node-meta { margin-top: 3px; color: var(--text-secondary); font-size: 11px; }
    .exchange-node-action { min-width: 78px; }
    .exchange-selected { min-height: 40px; border: 1px dashed var(--border); border-radius: 9px; padding: 10px; color: var(--text-secondary); font-size: 12px; }

  <script>
    'use strict';

    const TOOL_META = Object.freeze({
      name: document.querySelector('meta[name="name"]').content,
      version: document.querySelector('meta[name="version"]').content,
      author: document.querySelector('meta[name="author"]').content
    });

    const CONFIG = Object.freeze({
      API_BASE: 'https://cors-proxy.hrimyx.workers.dev/hbcoal-training',
      LOGIN_PATH: '/appLogin/login.action',
      PLAN_LIST_PATH: '/appRes/getLearnPlanList.action',
      STAGE_LIST_PATH: '/appRes/getLearnPlanStageList.action',
      STAGE_COURSES_PATH: '/appRes/getLearnPlanStageCourses.action',
      COURSE_DETAIL_PATH: '/appRes/getCourseDetail.action',
      BEFORE_WARE_PATH: '/appRes/beforeLearnWare.action',
      AFTER_WARE_PATH: '/appRes/afterLearnWareNew.action',
      STUDY_INFO_PATH: '/appStudyIntegral/getStudyExchangeInfo.action',
      INTEGRAL_COUNT_PATH: '/appIntegral/getIntegralCount.action',
      INTEGRAL_LIST_PATH: '/appIntegral/getIntegralList.action',
      STUDY_EXCHANGE_SEND_SMS_PATH: '/appSms/sendBaseMsg.action',
      STUDY_EXCHANGE_SUBMIT_PATH: '/appStudyIntegral/submitStudyExchange.action',
      STUDY_EXCHANGE_DATA_PATH: '/appStudyIntegral/getStudyExchangeData.action',
      REQUEST_TIMEOUT_MS: 12000,
      PROGRESS_FIRST_SYNC_DELAY_MS: 60000,
      PROGRESS_SYNC_INTERVAL_MS: 300000,
      BACKGROUND_SYNC_RETRY_DELAY_MS: 15000,
      BACKGROUND_SYNC_STALE_SYNC_MS: 90000,
      BACKGROUND_SYNC_FAILURE_LIMIT: 3,
      AUTO_STUDY_MAX_DURATION_MS: 60 * 60 * 1000,
      UI_TICK_INTERVAL_MS: 1000,
      MEDIA_META_RANGE_BYTES: 1024 * 1024
    });

    const state = {
      auth: null,
      plans: [],
      selectedPlanId: null,
      selectedCourse: null,
      selectedCourseWare: null,
      mediaDurationCache: new Map(),
      stageCache: new Map(),
      courseDetailCache: new Map(),
      studySession: null,
      planFingerprint: '',
      requestLock: new Set(),
      backgroundReporter: null,
      sessionSerial: 0,
      autoStudy: false,
      autoStudyStartedAt: 0,
      autoStudyDeadlineAt: 0,
      selectedStage: null,
      stageCourses: [],
      exchange: { info: null, selectedNodeKey: null, smsCountdown: 0, smsTimerId: null },
      integralRecords: { earned: [], spent: [] }
    };

    const $ = (id) => document.getElementById(id);

    function setStatus(text, ready = false) {
      $('status-text').textContent = text;
      $('status-chip').classList.toggle('ready', ready);
    }

    function showNotice(element, message, type = 'info') {
      element.textContent = message || '';
      element.className = `notice show ${type}`;
    }

    function hideNotice(element) {
      element.textContent = '';
      element.className = 'notice';
    }

    function setButtonBusy(button, busy, busyText) {
      if (!button.dataset.normalText) button.dataset.normalText = button.textContent;
      button.disabled = busy;
      button.innerHTML = busy ? `<span class="loader" aria-hidden="true"></span>${busyText}` : button.dataset.normalText;
    }

    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function formatDateTime(value) {
      return value ? String(value).replace(/\.0$/, '') : '—';
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.floor(safeNumber(seconds)));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hours > 0) return `${hours}小时${minutes}分`;
      if (minutes > 0) return `${minutes}分${secs}秒`;
      return `${secs}秒`;
    }

    function formatHms(seconds) {
      const total = Math.max(0, Math.floor(safeNumber(seconds)));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      const pad = (value) => String(value).padStart(2, '0');
      return `${pad(hours)}:${pad(minutes)}:${pad(secs)}`;
    }

    function formatClock(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = total % 60;
      const pad = (v) => String(v).padStart(2, '0');
      return hours > 0 ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}` : `${pad(minutes)}:${pad(seconds)}`;
    }

    function currentMonthLabel() {
      const now = new Date();
      return `${now.getFullYear()}年${String(now.getMonth() + 1).padStart(2, '0')}月`;
    }

    function authParams() {
      if (!state.auth) throw new Error('请先登录');
      return {
        uid: state.auth.uid,
        domain: state.auth.domain,
        codon: state.auth.codon
      };
    }

    function buildQuery(params) {
      const query = new URLSearchParams();
      Object.entries(params || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== '') query.set(key, String(value));
      });
      return query.toString();
    }

    async function requestJson({ path, method = 'POST', body = null, query = null, authRequired = true, lockKey = null }) {
      if (lockKey && state.requestLock.has(lockKey)) throw new Error('操作正在处理中，请勿重复点击');
      if (lockKey) state.requestLock.add(lockKey);

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);

      try {
        let url = `${CONFIG.API_BASE}${path}`;
        const headers = { 'Accept': 'application/json' };
        const requestInit = { method, headers, signal: controller.signal, credentials: 'omit', cache: 'no-store' };

        if (query && method === 'GET') {
          const qs = buildQuery(query);
          if (qs) url += `?${qs}`;
        }

        if (method !== 'GET') {
          const mergedBody = authRequired ? { ...authParams(), ...(body || {}) } : (body || {});
          headers['Content-Type'] = 'application/x-www-form-urlencoded; charset=UTF-8';
          requestInit.body = buildQuery(mergedBody);
        }

        const response = await fetch(url, requestInit);
        const text = await response.text();
        let data;
        try {
          data = text ? JSON.parse(text) : {};
        } catch {
          throw new Error('服务器返回的数据格式无法识别');
        }

        if (!response.ok) throw new Error('网络请求失败，请稍后重试');
        if (data && Object.prototype.hasOwnProperty.call(data, 'result') && Number(data.result) !== 1) {
          throw new Error(data.msg || '接口处理失败');
        }
        return data;
      } catch (error) {
        if (error?.name === 'AbortError') throw new Error('请求超时，请检查网络后重试');
        if (error instanceof TypeError) throw new Error('网络连接失败，请检查网络连接。');
        throw error;
      } finally {
        clearTimeout(timeoutId);
        if (lockKey) state.requestLock.delete(lockKey);
      }
    }

    function isTransientRequestError(error) {
      const message = String(error?.message || '');
      return message.includes('网络连接失败') || message.includes('请求超时') || message.includes('网络请求失败');
    }

    async function waitMs(ms) {
      await new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function login(username, password, domain) {
      // HAR 已验证：登录本身是 POST 表单，不携带 uid/codon；认证态由响应顶层字段返回。
      for (let attempt = 0; attempt < 2; attempt += 1) {
        try {
          const response = await requestJson({
            path: CONFIG.LOGIN_PATH,
            method: 'POST',
            authRequired: false,
            body: {
              userName: username,
              pwd: password,
              domain,
              registrationId: '',
              type: 1
            },
            lockKey: 'login'
          });

          if (!response || Number(response.result) !== 1 || response.uid === undefined || response.uid === null || !response.codon) {
            throw new Error(response?.msg || '登录失败');
          }

          state.auth = {
            uid: response.uid,
            codon: response.codon,
            domain: response.domain || domain,
            tid: response.tid,
            name: response.name || response.userName || username,
            userName: response.userName || username,
            deptName: response.deptName || ''
          };
          return;
        } catch (error) {
          if (attempt === 0 && isTransientRequestError(error)) {
            await waitMs(400);
            continue;
          }
          throw error;
        }
      }
    }

      return { label: '未开始', done: false, inProgress: false };
    }

      try {
        const response = await requestJson({
          path: CONFIG.STAGE_COURSES_PATH,
          method: 'POST',
          body: { stageId: stage.id },
          lockKey: `courses-${stage.id}`
        });
        const courses = Array.isArray(response?.dataList) ? response.dataList : [];
        state.selectedStage = stage;
        state.stageCourses = courses;
        container.innerHTML = '';
        if (!courses.length) {
          container.innerHTML = '<div class="empty-state">该阶段暂无课程</div>';
          return;

      setStatus('加载课程…', true);

        await stopStudySession({ silent: true, syncBeforeStop: true });
        const cacheKey = `${stage.id}:${course.id}`;
        let detail = state.courseDetailCache.get(cacheKey);

          detail = await requestJson({
            path: CONFIG.COURSE_DETAIL_PATH,
            method: 'POST',
            body: {
              courseId: course.id,
              relationId: stage.id,
              source: 2

          state.courseDetailCache.set(cacheKey, detail);

        const sections = Array.isArray(detail?.course?.sectionList) ? detail.course.sectionList : [];
        const wares = [];
        sections.forEach((section) => {

          const courseProcess = safeNumber(state.selectedCourse.learnProcess, 0);

    async function selectCourseWare(ware, stopCurrent = false, autoStart = false) {
      if (stopCurrent) await stopStudySession({ silent: true, syncBeforeStop: true });
      state.selectedCourseWare = ware;
      refreshSelectionHighlights();
      if (!ware) {
        $('study-ware-title').textContent = '—';
        $('session-time-display').textContent = '00:00 / 00:00';
        $('session-progress-text').textContent = '0%';
        $('study-progress-fill').style.width = '0%';
        return;
      }

      const totalMs = Math.max(0, safeNumber(ware.total) * 1000);
      const baseMs = normalizeBaseProgressMs(ware, totalMs);
      const percent = totalMs > 0 ? Math.min(100, baseMs / totalMs * 100) : 0;
      $('study-ware-title').textContent = ware.WareName || ware.FileName || '未命名课件';
      $('session-time-display').textContent = `${formatClock(baseMs)} / ${formatClock(totalMs)}`;
      $('session-progress-text').textContent = `${Math.round(percent)}%`;
      $('study-progress-fill').style.width = `${percent}%`;
      $('start-study-button').disabled = percent >= 100;
      $('pause-study-button').disabled = true;
      $('sync-study-button').disabled = true;
      hideNotice($('study-notice'));
      if (autoStart && state.autoStudy && !isWareCompleted(ware) && !state.studySession?.active) await startStudySession();
    }

    function normalizeBaseProgressMs(ware, totalMs) {
      if (totalMs <= 0) return 0;
      // HAR 已验证：getCourseDetail 返回的 current 是播放器当前位置（秒），
      // Progress 是百分比；afterLearnWareNew 则回传毫秒级 progress。优先使用 current，
      // 避免使用四舍五入后的百分比反推当前位置。
      const currentSeconds = safeNumber(ware?.current);
      if (ware?.current !== null && ware?.current !== undefined && currentSeconds > 0) {
        return Math.min(totalMs, currentSeconds * 1000);
      }
      const rawPercent = safeNumber(ware?.Progress);
      if (rawPercent <= 0) return 0;
      return Math.min(totalMs, totalMs * Math.min(100, rawPercent) / 100);
    }

    function readUint32(view, offset) {
      return offset + 4 <= view.byteLength ? view.getUint32(offset, false) : 0;
    }

    function readUint64(view, offset) {
      if (offset + 8 > view.byteLength) return 0;
      const high = view.getUint32(offset, false);
      const low = view.getUint32(offset + 4, false);
      return high * 4294967296 + low;
    }

    function findMp4Box(bytes, wantedType, start = 0, end = bytes.byteLength) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let offset = start;
      while (offset + 8 <= end) {
        let size = readUint32(view, offset);
        const type = String.fromCharCode(
          view.getUint8(offset + 4), view.getUint8(offset + 5),
          view.getUint8(offset + 6), view.getUint8(offset + 7)
        );
        let headerSize = 8;
        if (size === 1) {
          size = readUint64(view, offset + 8);
          headerSize = 16;
        } else if (size === 0) {
          size = end - offset;
        }
        if (!size || size < headerSize || offset + size > end) break;
        if (type === wantedType) return { offset, size, headerSize };
        offset += size;
      }
      return null;
    }

    function parseMp4DurationMs(arrayBuffer) {
      // 读取 MP4 的 moov/mvhd 元数据，不创建 video 元素，也不播放媒体。
      const bytes = new Uint8Array(arrayBuffer);
      const moov = findMp4Box(bytes, 'moov');
      if (!moov) return 0;
      const moovStart = moov.offset + moov.headerSize;
      const moovEnd = moov.offset + moov.size;
      const mvhd = findMp4Box(bytes, 'mvhd', moovStart, moovEnd);
      if (!mvhd) return 0;
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const payload = mvhd.offset + mvhd.headerSize;
      if (payload + 20 > moovEnd) return 0;
      const version = view.getUint8(payload);
      let timescale;
      let duration;
      if (version === 1) {
        if (payload + 32 > moovEnd) return 0;
        timescale = readUint32(view, payload + 20);
        duration = readUint64(view, payload + 24);
      } else {
        timescale = readUint32(view, payload + 12);
        duration = readUint32(view, payload + 16);
      }
      if (!timescale || !duration) return 0;
      return Math.round(duration / timescale * 1000);
    }

    async function resolveMediaDurationMs(ware) {
      const path = String(ware?.Path || '').trim();
      if (!path) return Math.max(0, safeNumber(ware?.total) * 1000);
      if (state.mediaDurationCache.has(path)) return state.mediaDurationCache.get(path);

      const fallback = Math.max(0, safeNumber(ware?.total) * 1000);
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);
        const url = `${CONFIG.API_BASE}${path.startsWith('/') ? path : `/${path}`}`;
        const response = await fetch(url, {
          method: 'GET',
          headers: { Range: `bytes=0-${CONFIG.MEDIA_META_RANGE_BYTES - 1}`, Accept: 'video/mp4,application/octet-stream' },
          credentials: 'omit',
          cache: 'no-store',
          signal: controller.signal
        });
        const contentLength = Number(response.headers.get('content-length') || 0);
        const isPartial = response.status === 206;
        if (!response.ok || (!isPartial && contentLength > CONFIG.MEDIA_META_RANGE_BYTES)) {
          clearTimeout(timeoutId);
          state.mediaDurationCache.set(path, fallback);
          return fallback;
        }
        const buffer = await response.arrayBuffer();
        clearTimeout(timeoutId);
        const durationMs = parseMp4DurationMs(buffer);
        const resolved = durationMs > 0 ? durationMs : fallback;
        state.mediaDurationCache.set(path, resolved);
        return resolved;
      } catch {
        state.mediaDurationCache.set(path, fallback);
        return fallback;
      }
    }

    function buildProgressSyncQuery(session, progressMs) {
      const allprogress = Math.max(0, Math.round(session.totalMs));
      return {
        ...authParams(),
        allprogress,
        courseId: session.course.id,
        progress: Math.round(progressMs),
        relationId: session.course.stageId,
        relationName: session.course.stageName || '',
        sectionId: session.ware.sectionId,
        source: 2,
        tid: state.auth.tid,
        uid: state.auth.uid,
        wareId: session.ware.WareId,
        wareType: session.ware.Type
      };
    }

    function applyStudySyncResult(session, progressMs) {
      session.lastSyncMs = progressMs;
      session.lastSyncWallAt = Date.now();
      const percentNow = session.totalMs > 0 ? Math.min(100, progressMs / session.totalMs * 100) : 0;
      session.ware.current = String(Math.floor(progressMs / 1000));
      session.ware.Progress = Math.floor(percentNow);
      session.ware.currentThisYear = session.ware.current;
      session.ware.progressThisYear = session.ware.Progress;
      if (session.course) {
        const wares = Array.isArray(session.course.wares) ? session.course.wares : [];
        session.course.learnProcess = wares.length > 0 && wares.every((ware) => isWareCompleted(ware)) ? 2 : 1;
      }
      session.elapsedMs = Math.max(0, progressMs - session.baseMs);
      return session.totalMs > 0 && progressMs >= session.totalMs;
    }

    function stopBackgroundReporter() {
      const reporter = state.backgroundReporter;
      if (!reporter) return;
      try {
        reporter.worker?.terminate();
      } catch {
        // 浏览器已回收 Worker 时无需额外处理。
      }
      if (reporter.url) URL.revokeObjectURL(reporter.url);
      state.backgroundReporter = null;
    }

    function createBackgroundReporter(session) {
      if (!window.Worker || !window.Blob || !window.URL?.createObjectURL) return null;

      const workerSource = `
        'use strict';
        let timerId = null;
        let completionTimerId = null;
        let working = false;
        let payload = null;
        let lastSuccessAt = 0;
        let failures = 0;

        function stop() {
          if (timerId !== null) clearTimeout(timerId);
          if (completionTimerId !== null) clearTimeout(completionTimerId);
          timerId = null;
          completionTimerId = null;
          working = false;
        }

        function scheduleNext(delayMs) {
          if (timerId !== null) clearTimeout(timerId);
          timerId = setTimeout(() => void syncNow(), Math.max(0, Number(delayMs) || 0));
        }

        function scheduleCompletion(payload) {
          if (completionTimerId !== null) clearTimeout(completionTimerId);
          const totalMs = Number(payload.totalMs) || 0;
          if (totalMs <= 0) return;
          const progressMs = Math.max(0, Number(payload.baseMs) || 0) + Math.max(0, Date.now() - (Number(payload.startedAt) || Date.now()));
          const remainingMs = totalMs - progressMs;
          if (remainingMs <= 0) {
            completionTimerId = setTimeout(() => void syncNow(), 0);
            return;
          }
          completionTimerId = setTimeout(() => void syncNow(), remainingMs);
        }

        async function syncNow() {
          if (!payload || working) return;
          working = true;
          const now = Date.now();
          const progressMs = Math.min(
            Number(payload.totalMs) || Number.MAX_SAFE_INTEGER,
            Math.max(0, Number(payload.baseMs) + Math.max(0, now - Number(payload.startedAt)))
          );
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), Number(payload.timeoutMs) || 12000);
          try {
            const url = new URL(payload.url);
            url.searchParams.set('progress', String(Math.round(progressMs)));
            const response = await fetch(url.toString(), {
              method: 'GET',
              headers: { 'Accept': 'application/json' },
              signal: controller.signal,
              credentials: 'omit',
              cache: 'no-store'
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch { throw new Error('服务器返回的数据格式无法识别'); }
            if (!response.ok) throw new Error('网络请求失败，请稍后重试');
            if (data && Object.prototype.hasOwnProperty.call(data, 'result') && Number(data.result) !== 1) {
              throw new Error(data.msg || '接口处理失败');
            }
            failures = 0;
            lastSuccessAt = Date.now();
            self.postMessage({ type: 'success', sessionId: payload.sessionId, progressMs, response: data, at: lastSuccessAt });
            if ((Number(payload.totalMs) || 0) > 0 && progressMs >= Number(payload.totalMs)) {
              self.postMessage({ type: 'complete', sessionId: payload.sessionId, progressMs });
              stop();
            } else {
              scheduleNext(Number(payload.intervalMs) || 300000);
            }
          } catch (error) {
            failures += 1;
            self.postMessage({ type: 'failure', sessionId: payload.sessionId, failures, message: error?.message || '后台进度同步失败', at: Date.now() });
            if (failures < Number(payload.failureLimit || 3)) {
              scheduleNext(Number(payload.retryDelayMs) || 15000);
            } else {
              // 临时网络波动不应中断连续学习：达到失败阈值后恢复到原生 5 分钟周期继续尝试。
              failures = 0;
              scheduleNext(Number(payload.intervalMs) || 300000);
            }
          } finally {
            clearTimeout(timeoutId);
            working = false;
          }
        }

        self.onmessage = (event) => {
          const message = event.data || {};
          if (message.type === 'start') {
            stop();
            payload = message.payload;
            lastSuccessAt = Number(payload.lastSuccessAt) || Date.now();
            failures = 0;
            const nextSyncAt = Number(payload.nextSyncAt) || (Date.now() + Number(payload.firstDelayMs || 60000));
            scheduleNext(nextSyncAt - Date.now());
            scheduleCompletion(payload);
          } else if (message.type === 'stop') {
            stop();
          }
        };
      `;
      try {
        const blob = new Blob([workerSource], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        const worker = new Worker(url);
        return { worker, url };
      } catch {
        return null;
      }
    }

    function startBackgroundReporter(session) {
      stopBackgroundReporter();
      const reporter = createBackgroundReporter(session);
      if (!reporter) return false;

      const query = buildProgressSyncQuery(session, getSessionProgressMs(session));
      const workerUrl = `${CONFIG.API_BASE}${CONFIG.AFTER_WARE_PATH}?${buildQuery(query)}`;
      state.backgroundReporter = { ...reporter, sessionId: session.id };
      reporter.worker.onmessage = (event) => handleBackgroundReporterMessage(event.data || {});
      reporter.worker.onerror = () => {
        const current = state.studySession;
        if (current?.id !== session.id || !current.active) return;
        // Worker 不可用时自动降级到主线程周期上报，不中断学习与连续学习链。
        stopBackgroundReporter();
        showNotice($('study-notice'), '后台上报通道不可用，已切换兼容模式继续学习。', 'warning');
        void syncStudyProgress(false, false, true);
      };
      reporter.worker.postMessage({
        type: 'start',
        payload: {
          sessionId: session.id,
          url: workerUrl,
          startedAt: session.startedAt,
          baseMs: session.baseMs,
          totalMs: session.totalMs,
          nextSyncAt: session.nextSyncAt,
          firstDelayMs: CONFIG.PROGRESS_FIRST_SYNC_DELAY_MS,
          intervalMs: CONFIG.PROGRESS_SYNC_INTERVAL_MS,
          retryDelayMs: CONFIG.BACKGROUND_SYNC_RETRY_DELAY_MS,
          timeoutMs: CONFIG.REQUEST_TIMEOUT_MS,
          failureLimit: CONFIG.BACKGROUND_SYNC_FAILURE_LIMIT,
          lastSuccessAt: session.lastSyncWallAt
        }
      });
      return true;
    }

    function handleBackgroundReporterMessage(message) {
      const session = state.studySession;
      if (!session || !session.active || message.sessionId !== session.id) return;

      if (message.type === 'success') {
        session.backgroundFailures = 0;
        session.lastSyncWallAt = Number(message.at) || Date.now();
        session.nextSyncAt = session.lastSyncWallAt + CONFIG.PROGRESS_SYNC_INTERVAL_MS;
        const progressMs = Math.max(session.lastSyncMs, Math.min(session.totalMs || Number.MAX_SAFE_INTEGER, safeNumber(message.progressMs)));
        const completedNow = applyStudySyncResult(session, progressMs);
        if (completedNow) {
          session.completed = true;
          session.active = false;
          clearInterval(session.timerId);
          session.timerId = null;
          stopBackgroundReporter();
          if (state.selectedCourse?.wares) {
            const currentWare = state.selectedCourse.wares.find((ware) => String(ware.WareId) === String(session.ware.WareId));
            if (currentWare) {
              currentWare.Progress = 100;
              currentWare.current = String(Math.floor(progressMs / 1000));
              currentWare.currentThisYear = currentWare.current;
              currentWare.progressThisYear = 100;
            }
            renderWareList(state.selectedCourse.wares);
          }
          refreshSelectionHighlights();
          hideNotice($('study-notice'));
          $('pause-study-button').disabled = true;
          $('start-study-button').disabled = true;
          $('start-study-button').textContent = '已完成';
          void loadSummary().then(() => advanceAutoStudy(session));
        } else {
          updateStudyUi();
        }
      } else if (message.type === 'failure') {
        session.backgroundFailures = safeNumber(message.failures, session.backgroundFailures + 1);
      } else if (message.type === 'pause') {
        void pauseStudySession('后台连续无法确认课件进度已上报，已自动暂停学习，防止本地计时与服务器记录不一致。', { syncAndRefresh: false });
      } else if (message.type === 'complete') {
        // success 消息会负责完成态的 UI 与数据更新。
      }
    }

    async function startStudySession() {
      const course = state.selectedCourse;
      if (state.autoStudy) ensureAutoStudyWindow();
      const ware = state.selectedCourseWare;
      if (!course || !ware) {
        showNotice($('study-notice'), '请先选择一个课程课件。', 'error');
        return;
      }

      const pausedSession = state.studySession;
      if (pausedSession && !pausedSession.active && !pausedSession.completed &&
          pausedSession.course?.id === course.id && pausedSession.ware?.WareId === ware.WareId) {
        pausedSession.startedAt = Date.now();
        pausedSession.active = true;
        pausedSession.lastSyncWallAt = Date.now();
        pausedSession.nextSyncAt = Date.now() + CONFIG.PROGRESS_FIRST_SYNC_DELAY_MS;
        pausedSession.backgroundFailures = 0;
        pausedSession.timerId = setInterval(updateStudyUi, CONFIG.UI_TICK_INTERVAL_MS);
        startBackgroundReporter(pausedSession);
        $('pause-study-button').disabled = false;
        $('sync-study-button').disabled = false;
        $('start-study-button').disabled = true;
        $('start-study-button').textContent = '继续学习';
        updateStudyUi();
        return;
      }
      if (state.studySession?.active) return;

      const button = $('start-study-button');
      setButtonBusy(button, true, '建立学习记录…');
      hideNotice($('study-notice'));

      try {
        const totalMs = await resolveMediaDurationMs(ware);
        const response = await requestJson({
          path: CONFIG.BEFORE_WARE_PATH,
          method: 'POST',
          body: {
            courseId: course.id,
            relationId: course.stageId,
            relationName: course.stageName || '',
            sectionId: ware.sectionId,
            source: 2,
            tid: state.auth.tid,
            wareId: ware.WareId,
            wareType: ware.Type
          },
          lockKey: `before-ware-${course.id}-${ware.WareId}`
        });

        const baseMs = normalizeBaseProgressMs(ware, totalMs);
        state.studySession = {
          id: ++state.sessionSerial,
          active: true,
          course,
          ware,
          totalMs,
          baseMs,
          startedAt: Date.now(),
          lastSyncMs: baseMs,
          lastSyncWallAt: Date.now(),
          nextSyncAt: Date.now() + CONFIG.PROGRESS_FIRST_SYNC_DELAY_MS,
          backgroundFailures: 0,
          recordId: response?.recordId,
          wareRecordId: response?.wareRecordId,
          timerId: null,
          syncing: false,
          completed: false
        };
        if (safeNumber(course.learnProcess, 0) === 0) course.learnProcess = 1;
        startBackgroundReporter(state.studySession);
        state.studySession.timerId = setInterval(updateStudyUi, CONFIG.UI_TICK_INTERVAL_MS);
        updateStudyUi();
        $('pause-study-button').disabled = false;
        $('sync-study-button').disabled = false;
        button.textContent = '继续学习';
        button.disabled = true;
        hideNotice($('study-notice'));
      } catch (error) {
        showNotice($('study-notice'), error.message, 'error');
      } finally {
        if (!state.studySession?.active) setButtonBusy(button, false, '开始学习');
        else if (button.dataset.normalText) button.innerHTML = button.dataset.normalText;
      }
    }

    async function pauseStudySession(message = '已暂停学习计时，当前进度已同步。', options = {}) {
      const session = state.studySession;
      if (!session?.active || session.syncing) return;
      const { syncAndRefresh = true } = options;
      const currentProgressMs = getSessionProgressMs(session);
      session.baseMs = Math.min(session.totalMs || Number.MAX_SAFE_INTEGER, currentProgressMs);
      session.elapsedMs = 0;
      session.startedAt = Date.now();
      session.lastSyncMs = Math.max(session.lastSyncMs, session.baseMs);
      clearInterval(session.timerId);
      session.timerId = null;
      session.active = false;
      stopBackgroundReporter();
      updateStudyUi();
      $('pause-study-button').disabled = true;
      $('sync-study-button').disabled = true;
      $('start-study-button').disabled = session.completed;
      $('start-study-button').textContent = session.completed ? '已完成' : '继续学习';
      if (syncAndRefresh && state.studySession === session) {
        await syncStudyProgress(false, true);
      }
      if (message && state.studySession === session && !session.completed) {
        hideNotice($('study-notice'));
      }
      if (state.studySession === session) $('sync-study-button').disabled = false;
    }

    async function stopStudySession({ silent = false, syncBeforeStop = false } = {}) {
      const session = state.studySession;
      if (!session) return;
      stopBackgroundReporter();
      if (session.active) {
        session.elapsedMs = Math.max(0, getSessionProgressMs(session) - session.baseMs);
      }
      clearInterval(session.timerId);
      session.timerId = null;
      session.active = false;
      if (syncBeforeStop && !session.syncing) await syncStudyProgress(false, false, false);
      if (state.studySession !== session) return;
      state.studySession = null;
      $('pause-study-button').disabled = true;
      $('sync-study-button').disabled = true;
      $('start-study-button').disabled = false;
      $('start-study-button').textContent = '开始学习';
      if (!silent) hideNotice($('study-notice'));
    }

    function getSessionProgressMs(session) {
      if (!session) return 0;
      const liveElapsed = session.active ? Math.max(0, Date.now() - session.startedAt) : (session.elapsedMs || 0);
      return Math.min(session.totalMs || Number.MAX_SAFE_INTEGER, session.baseMs + liveElapsed);
    }

    function updateStudyUi() {
      const session = state.studySession;
      if (!session) return;
      const progressMs = getSessionProgressMs(session);
      const elapsedFromBase = Math.max(0, progressMs - session.baseMs);
      const percent = session.totalMs > 0 ? Math.min(100, progressMs / session.totalMs * 100) : 0;
      session.elapsedMs = elapsedFromBase;
      $('session-time-display').textContent = `${formatClock(progressMs)} / ${formatClock(session.totalMs)}`;
      $('session-progress-text').textContent = `${Math.floor(percent)}%`;
      $('study-progress-fill').style.width = `${percent}%`;

      if (session.active && !state.backgroundReporter && Date.now() >= safeNumber(session.nextSyncAt) && !session.syncing) {
        void syncStudyProgress(false);
      }

      if (percent >= 100 && session.active && !session.syncing) {
        void syncStudyProgress(true, true);
      }
    }

    async function syncStudyProgress(finalSync, refreshSummary = false, allowAutoAdvance = true) {
      const session = state.studySession;
      if (!session || session.syncing) return;

      const hadBackgroundReporter = state.backgroundReporter?.sessionId === session.id;
      if (hadBackgroundReporter) stopBackgroundReporter();
      session.syncing = true;
      $('sync-study-button').disabled = true;

      try {
        const progressMs = getSessionProgressMs(session);
        // HAR 已验证：allprogress 是媒体实际总时长（毫秒），progress 是当前播放位置（毫秒）。
        const response = await requestJson({
          path: CONFIG.AFTER_WARE_PATH,
          method: 'GET',
          authRequired: false,
          query: buildProgressSyncQuery(session, progressMs),
          lockKey: 'after-ware'
        });

        if (response && Number(response.result) !== 1) throw new Error(response.msg || '进度同步失败');
        const completedNow = applyStudySyncResult(session, progressMs);
        session.nextSyncAt = Date.now() + CONFIG.PROGRESS_SYNC_INTERVAL_MS;
        session.completed = completedNow;
        if (completedNow) {
          session.active = false;
          clearInterval(session.timerId);
          session.timerId = null;
          if (state.selectedCourse?.wares) {
            const currentWare = state.selectedCourse.wares.find((ware) => String(ware.WareId) === String(session.ware.WareId));
            if (currentWare) {
              currentWare.Progress = 100;
              currentWare.current = String(Math.floor(progressMs / 1000));
              currentWare.currentThisYear = currentWare.current;
              currentWare.progressThisYear = 100;
            }
            renderWareList(state.selectedCourse.wares);
          }
          refreshSelectionHighlights();
          hideNotice($('study-notice'));
          $('pause-study-button').disabled = true;
          $('start-study-button').disabled = true;
          $('start-study-button').textContent = '已完成';
        } else {
          hideNotice($('study-notice'));
        }

        if (refreshSummary) await loadSummary();
        if (allowAutoAdvance && completedNow && state.studySession === session) {
          await advanceAutoStudy(session);
        }
      } catch (error) {
        showNotice($('study-notice'), error.message, 'error');
      } finally {
        session.syncing = false;
        if (state.studySession === session) {
          $('sync-study-button').disabled = false;
          if (session.active && !session.completed && hadBackgroundReporter) startBackgroundReporter(session);
        }
      }
    }

    async function resumeAfterVisibility() {
      const session = state.studySession;
      if (!session || session.completed || !session.active) return;

      // 后台上报器贯穿整个学习会话，不因前后台切换被销毁；切回前台时仅做一次追赶校正。
      if (!state.backgroundReporter || state.backgroundReporter.sessionId !== session.id) {
        startBackgroundReporter(session);
      }

      if (!document.hidden) {
        const stale = Date.now() - safeNumber(session.lastSyncWallAt, Date.now()) >= CONFIG.BACKGROUND_SYNC_STALE_SYNC_MS;
        const reachedEnd = getSessionProgressMs(session) >= session.totalMs;
        if (stale || reachedEnd) {
          void syncStudyProgress(reachedEnd, true);
        } else {
          updateStudyUi();
        }
        refreshSelectionHighlights();
      }
    }

    async function refreshStudyInfo() {
      if (!state.auth) return;
      const button = $('refresh-study-info');
      setButtonBusy(button, true, '');
      try {
        const response = await requestJson({ path: CONFIG.STUDY_INFO_PATH, method: 'POST', lockKey: 'study-info' });
        $('study-duration').textContent = safeNumber(response?.data?.duration).toLocaleString('zh-CN');
      } catch (error) {
        showNotice($('study-notice'), error.message, 'error');
      } finally {

        button.innerHTML = '↻';
      }
    }

    async function refreshIntegral() {

      setButtonBusy(button, true, '');

        $('usable-integral').textContent = safeNumber(response?.useable).toLocaleString('zh-CN');

    async function refreshPlans() {
      if (!state.auth) return;
      const button = $('refresh-plans');
      setButtonBusy(button, true, '');
      try {
        await loadPlans({ clearConsole: true });
      } catch (error) {
