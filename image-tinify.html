<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <!-- 应用元信息：名称、版本、作者只维护这一个来源，其他位置动态读取 -->
    <meta name="name" content="图片压缩" />
    <meta name="version" content="3.2.0" />
    <meta name="author" content="Hrimyx" />
    <title></title>
    <script>
      document.title = document.querySelector('meta[name="name"]').content;
    </script>
    <!-- 唯一外部依赖：JSZip，仅用于“全部下载”打包；浏览器无原生 zip 能力 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
      /* 工具开发基础规范 §10-§12 冷蓝色彩体系：业务样式只用以下 Token */
      :root {
        --brand-primary: #1a6aff;
        --brand-light: #78a2f8;
        --brand-dark: #0d3b8c;
        --on-brand: #ffffff;

        --accent-cyan: #18b8d8;

        --success: #0b9468;
        --warning: #c77a08;
        --danger: #d0445a;

        --bg: #f7f9fc;
        --surface: #ffffff;
        --surface-alt: #ebeef5;
        --border: #d0d7e5;

        --text: #1a202c;
        --text-secondary: #4a5568;

        --shadow-sm: 0 2px 8px rgba(26, 32, 44, 0.04);
        --shadow-md: 0 6px 20px rgba(26, 32, 44, 0.08);
        --shadow-lg: 0 12px 32px rgba(26, 32, 44, 0.12);
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 16px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0f1a;
          --surface: #141c2b;
          --surface-alt: #1f2a3f;
          --border: #2c3a54;

          --text: #e2e8f0;
          --text-secondary: #a0b0c8;

          --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
          --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        height: 100vh;
        display: flex;
        justify-content: center;
        overflow: hidden;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .app-container {
        width: 100%;
        max-width: 1080px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--surface);
      }

      @media (min-width: 768px) {
        body {
          padding: 24px;
        }
        .app-container {
          height: calc(100vh - 48px);
          border-radius: var(--radius-lg);
          box-shadow: var(--shadow-md);
          border: 1px solid var(--border);
        }
      }

      header {
        flex-shrink: 0;
        padding: 12px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
        background: var(--surface);
        flex-wrap: wrap;
        gap: 12px;
      }
      .header-left {
        display: flex;
        align-items: center;
      }

      .top-brand {
        font-weight: 600;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--brand-primary);
      }
      .top-brand .version-tag {
        font-size: 11px;
        font-weight: normal;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        padding: 1px 6px;
        border-radius: 10px;
      }
      .top-brand .author-tag {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .api-count {
        font-size: 14px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .api-count span {
        font-weight: 600;
        padding: 3px 10px;
        border-radius: var(--radius-md);
        border: 1px solid transparent;
        transition: all 0.3s;
      }

      button {
        cursor: pointer;
        border: none;
        border-radius: var(--radius-md);
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      button:active:not(:disabled) {
        transform: scale(0.96);
      }
      .btn-primary {
        background: var(--brand-primary);
        color: var(--on-brand);
        box-shadow: var(--shadow-sm);
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--brand-dark);
      }
      .btn-primary:disabled {
        background: var(--surface-alt);
        color: var(--text-secondary);
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
      .btn-outline {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-outline:hover:not(:disabled) {
        background: var(--surface-alt);
        border-color: var(--text-secondary);
      }
      .btn-danger-outline {
        color: var(--danger);
        border-color: var(--danger);
        background: transparent;
      }
      .btn-danger-outline:hover:not(:disabled) {
        background: color-mix(in srgb, var(--danger) 12%, var(--surface));
      }
      .btn-icon {
        padding: 8px;
        width: 36px;
        height: 36px;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      .upload-section {
        flex-shrink: 0;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        z-index: 5;
      }
      .upload-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius-md);
        padding: 18px 20px;
        text-align: center;
        background: var(--surface);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .upload-zone:hover,
      .upload-zone.dragover {
        border-color: var(--brand-primary);
        background: var(--surface-alt);
      }
      .upload-zone svg {
        stroke: var(--brand-primary);
        width: 28px;
        height: 28px;
        margin-bottom: 8px;
        transition: transform 0.3s;
      }
      .upload-zone:hover svg {
        transform: translateY(-4px);
      }
      .upload-zone h3 {
        font-size: 16px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 4px;
      }
      .upload-zone p {
        font-size: 13px;
        color: var(--text-secondary);
      }
      #file-input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
      }

      .list-section {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        padding-bottom: 180px;
        background: var(--bg);
      }
      .file-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
        font-size: 15px;
      }

      .file-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        position: relative;
        overflow: hidden;
      }
      .file-item:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }
      .file-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: nowrap;
        gap: 12px;
      }

      .file-info {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
      }
      .file-thumb {
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        object-fit: cover;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--bg);
      }
      .file-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow: hidden;
        min-width: 0;
      }
      .file-name {
        font-size: 15px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
      }
      .file-type {
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        gap: 8px;
        align-items: center;
        overflow: hidden;
      }

      .file-status {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .file-stats {
        font-size: 14px;
        color: var(--text-secondary);
        text-align: right;
        line-height: 1.4;
        transition: color 0.3s;
        white-space: nowrap;
      }
      .file-stats .percent {
        color: var(--success);
        font-weight: 600;
        font-size: 16px;
      }

      .progress-bar-container {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--surface-alt);
        z-index: 1;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      .progress-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
      }
      .upload-fill {
        background: var(--accent-cyan);
        z-index: 2;
        transition: width 0.2s linear;
      }
      .compress-fill {
        background: var(--brand-primary);
        z-index: 3;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .compress-fill.animating {
        background-image: linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.2) 25%,
          transparent 25%,
          transparent 50%,
          rgba(255, 255, 255, 0.2) 50%,
          rgba(255, 255, 255, 0.2) 75%,
          transparent 75%,
          transparent
        );
        background-size: 1rem 1rem;
        animation: progress-stripes 1s linear infinite;
      }
      @keyframes progress-stripes {
        from {
          background-position: 1rem 0;
        }
        to {
          background-position: 0 0;
        }
      }

      .floating-container {
        position: absolute;
        bottom: 24px;
        left: 24px;
        right: 24px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 50;
        pointer-events: none;
      }
      .floating-container > * {
        pointer-events: auto;
      }
      .stats-pill {
        background: var(--surface);
        padding: 6px 14px;
        border-radius: 20px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-secondary);
        display: flex;
        align-items: baseline;
        gap: 4px;
      }
      .stats-pill .highlight {
        color: var(--success);
        font-weight: 600;
        font-size: 14px;
      }
      .floating-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-end;
      }
      .floating-btn {
        border-radius: 20px;
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        letter-spacing: 0.5px;
      }
      .btn-danger-outline.floating-btn {
        background: var(--surface);
      }
      .btn-danger-outline.floating-btn:disabled {
        background: var(--surface-alt);
        border-color: var(--border);
        color: var(--text-secondary);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 15, 26, 0.6);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
        backdrop-filter: blur(4px);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .modal-overlay.active {
        display: flex;
        opacity: 1;
      }
      .modal-content {
        background: var(--surface);
        width: 90%;
        max-width: 500px;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        transform: scale(0.95);
        transition: transform 0.2s;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .modal-overlay.active .modal-content {
        transform: scale(1);
      }
      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-header h2 {
        font-size: 18px;
        font-weight: 600;
        margin: 0;
      }
      .btn-close {
        background: none;
        border: none;
        font-size: 24px;
        cursor: pointer;
        color: var(--text-secondary);
        padding: 0;
        line-height: 1;
      }
      .btn-close:hover {
        color: var(--danger);
        transform: none;
      }
      .modal-body {
        padding: 24px;
        max-height: 65vh;
        overflow-y: auto;
      }

      .form-group {
        margin-bottom: 20px;
      }
      .form-group:last-child {
        margin-bottom: 0;
      }
      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--text);
      }
      .form-hint {
        font-size: 12px;
        color: var(--text-secondary);
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .form-control {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s;
      }
      .form-control:focus {
        outline: none;
        border-color: var(--brand-primary);
      }
      .form-control:disabled {
        background-color: var(--surface-alt);
        color: var(--text-secondary);
        cursor: not-allowed;
        opacity: 0.7;
      }
      textarea.form-control {
        resize: vertical;
        min-height: 70px;
      }

      .checkbox-group label {
        cursor: pointer;
        color: var(--text);
        font-size: 14px;
      }
      .checkbox-group input[type="checkbox"] {
        cursor: pointer;
        accent-color: var(--brand-primary);
        width: 16px;
        height: 16px;
      }
      .flex-row {
        display: flex;
        gap: 12px;
      }

      .modal-footer {
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--bg);
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .toast-container {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: none;
      }
      .toast {
        background: var(--text);
        color: var(--surface);
        padding: 10px 20px;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 500;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--shadow-md);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast-icon {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      @media (max-width: 600px) {
        header {
          padding: 8px 12px;
          gap: 4px;
        }
        .header-left {
          width: 100%;
          border-bottom: 1px dashed var(--border);
          padding-bottom: 6px;
        }
        .top-brand {
          font-size: 16px;
        }
        .header-right {
          width: 100%;
          justify-content: space-between;
          padding-top: 4px;
          gap: 8px;
        }
        .api-count {
          font-size: 12px;
        }
        .api-count span {
          padding: 2px 8px;
          font-size: 12px;
        }
        .btn-icon {
          width: 32px;
          height: 32px;
          padding: 6px;
        }
        .upload-section {
          padding: 12px 16px;
        }
        .upload-zone {
          padding: 14px 12px;
        }
        .upload-zone svg {
          width: 24px;
          height: 24px;
          margin-bottom: 6px;
        }
        .upload-zone h3 {
          font-size: 13px;
        }
        .upload-zone p {
          font-size: 11px;
        }
        .list-section {
          padding: 12px;
          padding-bottom: 140px;
        }
        .floating-container {
          bottom: 16px;
          left: 16px;
          right: 16px;
        }
        .file-item {
          padding: 12px;
          gap: 8px;
        }
        .file-content {
          gap: 8px;
        }
        .file-info {
          gap: 8px;
        }
        .file-thumb {
          width: 40px;
          height: 40px;
        }
        .file-name {
          font-size: 14px;
        }
        .file-type {
          font-size: 12px;
        }
        .file-status {
          gap: 8px;
        }
        .file-stats {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div id="toast-root" class="toast-container"></div>

    <div class="app-container">
      <!-- 头部 -->
      <header>
        <div class="header-left">
          <div class="top-brand">
            <span id="brand-name-text"></span>
            <span class="version-tag" id="brand-version-text"></span>
            <span class="author-tag" id="brand-author-text"></span>
          </div>
        </div>
        <div class="header-right">
          <div class="api-count">
            <span id="ui-api-count">本月已用：待获取</span>
          </div>
          <button class="btn-outline btn-icon" id="btn-settings" title="配置">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              ></path>
            </svg>
          </button>
        </div>
      </header>

      <main>
        <div class="upload-section">
          <div class="upload-zone" id="upload-zone">
            <input
              type="file"
              id="file-input"
              multiple
              accept="image/jpeg, image/png, image/webp, image/avif, image/jxl"
            />
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <h3>点击或拖拽图片至此（单次最多 30 张，列表最多 50 张）</h3>
            <p>支持 JPG、PNG、WebP、AVIF、JPEG XL，单文件最大 15MB</p>
          </div>
        </div>

        <div class="list-section">
          <div class="file-list" id="file-list">
            <div class="empty-state" id="empty-state">
              尚未添加图片，赶紧上传体验吧！
            </div>
          </div>
        </div>

        <div
          class="floating-container"
          id="floating-container"
          style="display: none"
        >
          <div class="stats-pill">
            共 <span class="highlight" id="ui-total-count">0</span> 张 节省
            <span class="highlight" id="ui-total-saved">0 B</span>
          </div>
          <div class="floating-buttons">
            <button
              class="btn-danger-outline floating-btn"
              id="btn-clear-all"
              disabled
            >
              清空
            </button>
            <button
              class="btn-primary floating-btn"
              id="btn-download-all"
              disabled
            >
              全部下载
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- 配置弹窗 -->
    <div class="modal-overlay" id="modal-settings">
      <div class="modal-content">
        <div class="modal-header">
          <h2>参数配置</h2>
          <button class="btn-close" id="btn-close-settings">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>接口</label>
            <div class="form-hint">
              压缩经代理接口统一鉴权，无需配置 API 密钥；用量计入代理侧账号本月额度，压缩结果保留 8 小时。打开页面或离开一段时间回来时会自动刷新已用次数（不计次数）。
            </div>
          </div>
          <div class="form-group">
            <label>图片缩放规则 (Resize)</label>
            <select
              class="form-control"
              id="input-resize-method"
              style="margin-bottom: 12px"
            >
              <option value="">-- 不进行缩放处理 --</option>
              <option value="scale">Scale (按比例缩放)</option>
              <option value="fit">Fit (自适应缩放)</option>
              <option value="cover">Cover (裁剪填充)</option>
              <option value="thumb">Thumb (生成缩略图)</option>
            </select>
            <div class="flex-row">
              <input
                type="text"
                class="form-control"
                id="input-resize-w"
                placeholder="宽(1-2560)"
                inputmode="numeric"
              />
              <input
                type="text"
                class="form-control"
                id="input-resize-h"
                placeholder="高(1-2560)"
                inputmode="numeric"
              />
            </div>
          </div>
          <div class="form-group">
            <label>图像转换 (Convert)</label>
            <div class="form-hint">
              勾选目标格式，将自动返回其中体积最小的格式。不勾选则保持原图格式。转 JPEG 时透明区域将填为白色底。
            </div>
            <div class="checkbox-group flex-row" style="flex-wrap: wrap">
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="convertType" value="image/webp" />
                WebP</label
              >
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="convertType" value="image/jpeg" />
                JPEG</label
              >
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="convertType" value="image/png" />
                PNG</label
              >
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="convertType" value="image/avif" />
                AVIF</label
              >
            </div>
          </div>
          <div class="form-group">
            <label>保存元数据 (Preserve)</label>
            <div class="form-hint">
              勾选需保留的元数据信息（默认移除所有元数据以减小体积）。
            </div>
            <div class="checkbox-group flex-row" style="flex-wrap: wrap">
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="preserveMeta" value="copyright" />
                版权</label
              >
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="preserveMeta" value="creation" />
                创建时间</label
              >
              <label style="display: flex; align-items: center; gap: 6px"
                ><input type="checkbox" name="preserveMeta" value="location" />
                位置(GPS)</label
              >
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-outline" id="btn-cancel-settings">取消</button>
          <button class="btn-primary" id="btn-save-settings">保存配置</button>
        </div>
      </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modal-confirm">
      <div class="modal-content" style="max-width: 400px">
        <div class="modal-header">
          <h2
            style="
              color: var(--danger);
              display: flex;
              align-items: center;
              gap: 8px;
            "
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
              ></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            重要提示
          </h2>
        </div>
        <div
          class="modal-body"
          id="confirm-msg"
          style="font-size: 15px; color: var(--text)"
        >
          确定要执行此操作吗？
        </div>
        <div class="modal-footer">
          <button class="btn-outline" id="btn-confirm-cancel">取消</button>
          <button
            class="btn-primary"
            id="btn-confirm-ok"
            style="background: var(--danger); color: var(--on-brand)"
          >
            确定执行
          </button>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      const AppMeta = {
        name: document.querySelector('meta[name="name"]').content,
        version: document.querySelector('meta[name="version"]').content,
        author: document.querySelector('meta[name="author"]').content,
      };

      /* 配置项统一管理：Tinify 官方 HTTP 接口经通用 CORS 代理转发
         （Worker 只做跨域 + 按 UPSTREAM_HEADERS Secret 向 api.tinify.com
         注入 Basic 鉴权，不做任何业务合并；密钥只存在 Worker 侧）。
         流程（https://tinypng.com/developers/reference/http），每个接口单独调：
         1) shrink：POST {SHRINK_URL} 图片二进制 -> 201 JSON，output.url 为压缩结果
            地址（8 小时有效，Worker 已把地址改写回代理域名），响应头
            Compression-Count 为代理侧账号本月已用次数；
         2) download：GET output.url 直接下载；
         3) resize：POST output.url JSON {resize}；
         4) convert：POST output.url JSON {convert[, transform]}；
         5) preserve：POST output.url JSON {preserve}。
         本页不发送、不存储任何 API 密钥。
         次数：Tinify 没有单独的次数接口，唯一途径是响应头 Compression-Count。
         本页用 GET 一个不存在的 output 地址读它（返回 404 + 真实次数，不计次数，
         实测有效）；每次压缩 / 变换的响应头也会顺带更新次数。 */
      const CONFIG = {
        shrinkUrl: "https://api.tasy.day/api.tinify.com/shrink",
        // 次数探测地址：不存在的 output id，GET 返回 404 + 真实 Compression-Count，不计次数
        countProbeUrl:
          "https://api.tasy.day/api.tinify.com/output/00000000000000000000000000000000",
        countFetchTimeoutMs: 15000,
        // 离开超过该时长回来时刷新一次次数
        countStaleMs: 10 * 60 * 1000,
        requestTimeoutMs: 120000,
        retryDelayMs: 3000,
        maxFileBytes: 15 * 1024 * 1024,
        maxBatchFiles: 30,
        maxListFiles: 50,
        concurrency: 5,
        acceptedTypes: [
          "image/jpeg",
          "image/png",
          "image/webp",
          "image/avif",
          "image/jxl",
        ],
        monthlyLimitHint: 500,
        storageKey: "hrimyx_tinify_v3",
        legacyStorageKey: "hrimyx_tinify_data",
      };
      const EXT_BY_MIME = {
        "image/jpeg": ".jpg",
        "image/png": ".png",
        "image/webp": ".webp",
        "image/avif": ".avif",
        "image/jxl": ".jxl",
      };

      let lastGlobalErrorAt = 0;
      function reportGlobalError(err) {
        console.error("全局异常捕获:", err);
        const now = Date.now();
        if (now - lastGlobalErrorAt < 3000) return;
        lastGlobalErrorAt = now;
        if (typeof UI !== "undefined" && UI.toast)
          UI.toast("程序出现异常，请刷新页面后重试");
      }
      window.onerror = (message, source, lineno, colno, error) => {
        reportGlobalError(error || message);
        return true;
      };
      window.addEventListener("unhandledrejection", (event) => {
        reportGlobalError(event.reason);
      });

      const Store = {
        state: {
          settings: {
            resize: { method: "", width: "", height: "" },
            convert: [],
            preserve: [],
          },
          totalSavedBytes: 0,
          successCount: 0,
          activeTasks: 0,
          apiCount: null,
          apiCountAt: null,
        },
        init() {
          try {
            const raw = localStorage.getItem(CONFIG.storageKey);
            if (raw) {
              const data = JSON.parse(raw);
              if (data.settings) this.state.settings = this.normalizeSettings(data.settings);
              if (data.apiCount !== undefined) this.state.apiCount = data.apiCount;
              if (data.apiCountAt !== undefined) this.state.apiCountAt = data.apiCountAt;
              return;
            }
            // 迁移旧版：只取缩放/转换/保留设置，旧版 API 密钥一律丢弃，不再存储
            const legacy = JSON.parse(
              localStorage.getItem(CONFIG.legacyStorageKey) || "{}",
            );
            if (legacy.settings) {
              this.state.settings = this.normalizeSettings(legacy.settings);
              if (legacy.apiCount !== undefined)
                this.state.apiCount = legacy.apiCount;
              this.persist();
            }
            localStorage.removeItem(CONFIG.legacyStorageKey);
          } catch (e) {
            console.error("Local storage init failed:", e);
          }
        },
        normalizeSettings(settings) {
          const base = {
            resize: { method: "", width: "", height: "" },
            convert: [],
            preserve: [],
          };
          if (!settings || typeof settings !== "object") return base;
          if (settings.resize && typeof settings.resize === "object") {
            base.resize.method = ["scale", "fit", "cover", "thumb"].includes(
              settings.resize.method,
            )
              ? settings.resize.method
              : "";
            base.resize.width = settings.resize.width || "";
            base.resize.height = settings.resize.height || "";
          }
          if (Array.isArray(settings.convert))
            base.convert = settings.convert.filter((t) =>
              CONFIG.acceptedTypes.includes(t),
            );
          if (Array.isArray(settings.preserve))
            base.preserve = settings.preserve.filter((t) =>
              ["copyright", "creation", "location"].includes(t),
            );
          return base;
        },
        save(settingsObj) {
          this.state.settings = this.normalizeSettings(settingsObj);
          this.persist();
        },
        saveApiCount(count) {
          this.state.apiCount = count;
          this.state.apiCountAt = Date.now();
          this.persist();
        },
        persist() {
          try {
            localStorage.setItem(
              CONFIG.storageKey,
              JSON.stringify({
                settings: this.state.settings,
                apiCount: this.state.apiCount,
                apiCountAt: this.state.apiCountAt,
              }),
            );
          } catch (e) {
            UI.toast("本地存储写入失败");
          }
        },
        addSavedResult(bytes) {
          this.state.totalSavedBytes += bytes;
          this.state.successCount++;
          UI.updateStats(this.state.successCount, this.state.totalSavedBytes);
        },
        clearStats() {
          this.state.totalSavedBytes = 0;
          this.state.successCount = 0;
          this.state.activeTasks = 0;
          UI.updateStats(0, 0);
        },
      };

      const Utils = {
        _trackedBlobUrls: new Set(),
        formatBytes(bytes) {
          if (!bytes || bytes <= 0) return "0 B";
          const sizes = ["B", "KB", "MB", "GB"];
          const i = Math.floor(Math.log(bytes) / Math.log(1024));
          return (bytes / Math.pow(1024, i)).toFixed(2) + " " + sizes[i];
        },
        id() {
          return "file_" + Math.random().toString(36).substr(2, 9);
        },
        // 文件名来自用户输入，拼进 HTML 前必须转义（规范 §6）
        esc(value) {
          return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        },
        trackBlobUrl(url) {
          this._trackedBlobUrls.add(url);
          return url;
        },
        revokeAllBlobUrls() {
          this._trackedBlobUrls.forEach((url) => {
            try {
              URL.revokeObjectURL(url);
            } catch (e) {}
          });
          this._trackedBlobUrls.clear();
        },
      };

      const UI = {
        setApiCountText(count) {
          const apiSpan = document.getElementById("ui-api-count");
          if (!apiSpan) return;
          apiSpan.style.color = "";
          apiSpan.style.borderColor = "";
          apiSpan.style.background = "";

          if (Store.state.apiCountAt) {
            const at = new Date(Store.state.apiCountAt);
            apiSpan.title = `上次更新 ${at.toLocaleString("zh-CN", { hour12: false })}`;
          } else {
            apiSpan.title = "";
          }

          if (count === null || count === undefined) {
            apiSpan.innerText = "本月已用：待获取";
            apiSpan.style.color = "var(--brand-primary)";
          } else {
            // Compression-Count 是代理侧账号本月已用次数（非剩余额度）
            apiSpan.innerText = `本月已用：${count} 次`;
            if (count >= CONFIG.monthlyLimitHint - 50) {
              apiSpan.style.color = "var(--warning)";
              apiSpan.style.borderColor = "var(--warning)";
              apiSpan.style.background =
                "color-mix(in srgb, var(--warning) 12%, var(--surface))";
            } else {
              apiSpan.style.color = "var(--brand-primary)";
              apiSpan.style.borderColor = "var(--border)";
              apiSpan.style.background = "var(--bg)";
            }
          }
        },
        checkEmptyState() {
          const list = document.getElementById("file-list");
          const empty = document.getElementById("empty-state");
          const items = list.querySelectorAll(".file-item");
          const floating = document.getElementById("floating-container");

          if (items.length === 0) {
            if (!empty)
              list.innerHTML = `<div class="empty-state" id="empty-state">尚未添加图片，赶紧上传体验吧！</div>`;
            floating.style.display = "none";
          } else {
            if (empty) empty.remove();
            floating.style.display = "flex";
          }
        },
        createFileItem(file, id) {
          this.checkEmptyState();
          const url = Utils.trackBlobUrl(URL.createObjectURL(file));
          const safeName = Utils.esc(file.name);
          const typeLabel = (file.type.split("/")[1] || "").toUpperCase();
          const html = `
                    <div class="file-item" id="${id}">
                        <div class="file-content">
                            <div class="file-info">
                                <img src="${url}" class="file-thumb" alt="thumb">
                                <div class="file-meta">
                                    <div class="file-name" title="${safeName}">${safeName}</div>
                                    <div class="file-type"><span>${Utils.formatBytes(file.size)}</span><span style="color:var(--border)">|</span><span>${Utils.esc(typeLabel)}</span></div>
                                </div>
                            </div>
                            <div class="file-status" id="status-${id}"><div class="file-stats" id="stats-text-${id}">排队等待...</div></div>
                        </div>
                        <div class="progress-bar-container" id="prog-container-${id}">
                            <div class="progress-bar-fill upload-fill" id="bar-up-${id}"></div>
                            <div class="progress-bar-fill compress-fill" id="bar-cp-${id}"></div>
                        </div>
                    </div>`;
          document
            .getElementById("file-list")
            .insertAdjacentHTML("afterbegin", html);
          this.checkEmptyState();
        },
        updateProgress(id, stage, percent, text) {
          const barUp = document.getElementById(`bar-up-${id}`);
          const barCp = document.getElementById(`bar-cp-${id}`);
          const stats = document.getElementById(`stats-text-${id}`);
          if (stage === "upload") {
            if (barUp) barUp.style.width = percent + "%";
            if (stats)
              stats.innerText =
                percent === 100 ? "正在处理..." : `上传中 ${percent}%`;
          } else if (stage === "compress") {
            if (barCp) {
              barCp.style.opacity = "1";
              barCp.style.width = percent + "%";
              if (percent === 100 && text !== "完成" && text !== "失败")
                barCp.classList.add("animating");
              else barCp.classList.remove("animating");
            }
            if (stats) stats.innerText = text;
          }
        },
        renderSuccess(id, oldSize, newSize, blobUrl, name) {
          this.updateProgress(id, "upload", 100, "");
          this.updateProgress(id, "compress", 100, "完成");
          const progGroup = document.getElementById(`prog-container-${id}`);
          if (progGroup) {
            progGroup.style.opacity = "0";
            setTimeout(() => progGroup.remove(), 300);
          }
          const saved = oldSize - newSize;
          const ratio = saved > 0 ? ((saved / oldSize) * 100).toFixed(1) : 0;
          Store.addSavedResult(saved > 0 ? saved : 0);
          const statusEl = document.getElementById(`status-${id}`);
          if (!statusEl) return;
          const originalNameEl = document
            .getElementById(id)
            .querySelector(".file-name");
          if (originalNameEl) {
            originalNameEl.innerText = name;
            originalNameEl.title = name;
          }
          const safeUrl = Utils.esc(blobUrl);
          const safeName = Utils.esc(name);
          statusEl.innerHTML = `
                    <div class="file-stats"><span class="percent">-${ratio}%</span><br>${Utils.formatBytes(newSize)}</div>
                    <button class="btn-outline btn-icon btn-dl" data-url="${safeUrl}" data-name="${safeName}" title="下载">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>`;
          statusEl
            .querySelector(".btn-dl")
            .addEventListener("click", function () {
              const a = document.createElement("a");
              a.href = this.getAttribute("data-url");
              a.download = this.getAttribute("data-name");
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              UI.toast(`文件已开始下载: ${this.getAttribute("data-name")}`);
            });
        },
        renderError(id, msg) {
          this.updateProgress(id, "compress", 100, "失败");
          const bar = document.getElementById(`bar-cp-${id}`);
          if (bar) {
            bar.style.opacity = "1";
            bar.style.width = "100%";
            bar.classList.remove("animating");
            bar.style.background = "var(--danger)";
          }
          const stats = document.getElementById(`stats-text-${id}`);
          if (stats) {
            stats.innerText = msg;
            stats.style.color = "var(--danger)";
          }
        },
        updateStats(count, bytes) {
          document.getElementById("ui-total-count").innerText = count;
          document.getElementById("ui-total-saved").innerText =
            Utils.formatBytes(bytes);
        },
        updateActionButtons() {
          const isProcessing = Store.state.activeTasks > 0;
          const dlCount = document.querySelectorAll(".btn-dl").length;
          const fileCount = document.querySelectorAll(".file-item").length;

          document.getElementById("btn-clear-all").disabled =
            isProcessing || fileCount === 0;
          document.getElementById("btn-download-all").disabled =
            isProcessing || dlCount === 0;
        },
        toast(msg) {
          const root = document.getElementById("toast-root");
          const el = document.createElement("div");
          el.className = "toast";
          el.innerHTML = `<svg class="toast-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span></span>`;
          el.querySelector("span").textContent = msg;
          root.appendChild(el);
          void el.offsetWidth;
          el.classList.add("show");
          setTimeout(() => {
            el.classList.remove("show");
            setTimeout(() => {
              if (el.parentNode) el.remove();
            }, 300);
          }, 3000);
        },
        confirm(msg) {
          return new Promise((resolve) => {
            const modal = document.getElementById("modal-confirm");
            document.getElementById("confirm-msg").innerText = msg;
            modal.classList.add("active");
            const cleanup = () => {
              modal.classList.remove("active");
              document.getElementById("btn-confirm-ok").onclick = null;
              document.getElementById("btn-confirm-cancel").onclick = null;
            };
            document.getElementById("btn-confirm-ok").onclick = () => {
              cleanup();
              resolve(true);
            };
            document.getElementById("btn-confirm-cancel").onclick = () => {
              cleanup();
              resolve(false);
            };
          });
        },
      };

      // Tinify 官方错误体为 {"error": "...", "message": "..."}，按状态码转中文提示
      function tinifyErrorMessage(status, body) {
        const serverMsg =
          body && typeof body.message === "string" ? body.message : "";
        if (status === 400)
          return "请求无效：图片无法识别或参数有误";
        if (status === 401) return "代理鉴权失败，请稍后重试";
        if (status === 404) return "压缩结果已过期，请重新上传";
        if (status === 415) return "不支持的图片格式";
        if (status === 429) {
          if (/month/i.test(serverMsg)) return "本月压缩额度已用完";
          return "请求过于频繁，请稍后重试";
        }
        if (status >= 500) return "服务端临时故障，请稍后重试";
        return serverMsg || "服务器处理异常";
      }
      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      const TinifyService = {
        // 第 1 步：POST shrink 上传原图，201 返回 JSON；XHR 只为保留上传进度
        shrink(file, id, attempt) {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", CONFIG.shrinkUrl);
            xhr.timeout = CONFIG.requestTimeoutMs;
            xhr.responseType = "text";
            xhr.ontimeout = () =>
              reject(new Error("请求超时，请检查网络后重试"));
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) {
                const percent = Math.floor((e.loaded / e.total) * 100);
                UI.updateProgress(id, "upload", percent, "");
                if (percent === 100)
                  UI.updateProgress(id, "compress", 100, "云端处理中...");
              }
            };
            xhr.onload = () => {
              const countHeader = xhr.getResponseHeader("compression-count");
              if (countHeader !== null) {
                const count = parseInt(countHeader, 10);
                if (!Number.isNaN(count)) {
                  Store.saveApiCount(count);
                  UI.setApiCountText(count);
                }
              }
              let body = null;
              try {
                body = xhr.responseText ? JSON.parse(xhr.responseText) : null;
              } catch (e) {
                body = null;
              }
              if (xhr.status === 201 && body && body.output && body.output.url) {
                resolve(body.output.url);
                return;
              }
              const err = new Error(
                tinifyErrorMessage(xhr.status, body),
              );
              err.status = xhr.status;
              err.retryable =
                xhr.status === 429 || xhr.status >= 500;
              err.monthlyLimit =
                xhr.status === 429 &&
                body &&
                /month/i.test(body.message || "");
              reject(err);
            };
            xhr.onerror = () => reject(new Error("网络请求失败"));
            xhr.send(file);
          }).catch(async (err) => {
            // 429 限速 / 5xx 临时故障：官方文档称可重试，只重试一次
            if (err.retryable && !err.monthlyLimit && attempt === 0) {
              await sleep(CONFIG.retryDelayMs);
              return this.shrink(file, id, 1);
            }
            throw err;
          });
        },

        // 刷新本月已用次数：Tinify 没有单独的次数接口，唯一途径是响应头
        // Compression-Count。这里 GET 一个不存在的 output 地址：返回 404 是预期的，
        // 响应头里带的就是代理侧账号本月真实已用次数，且不计次数（下载不计次，
        // 404 更不计次）。失败时静默保留缓存值，不弹提示、不影响页面。
        async fetchCount() {
          const controller = new AbortController();
          const timer = setTimeout(
            () => controller.abort(),
            CONFIG.countFetchTimeoutMs,
          );
          try {
            const response = await fetch(CONFIG.countProbeUrl, {
              method: "GET",
              signal: controller.signal,
            });
            const countHeader = response.headers.get("compression-count");
            if (countHeader === null) return null;
            const count = parseInt(countHeader, 10);
            if (Number.isNaN(count)) return null;
            Store.saveApiCount(count);
            UI.setApiCountText(count);
            return count;
          } catch (e) {
            return null;
          } finally {
            clearTimeout(timer);
          }
        },

        // output 接口的统一传输：无 body 时 GET 下载，有 body 时 POST 一次 JSON 变换。
        // 下载 / 缩放 / 转换 / 保留元数据四个接口分别调它，body 各自由对应的
        // build 方法单独拼，不共用、不混写。
        async requestOutput(outputUrl, body, label, id, attempt) {
          const controller = new AbortController();
          const timer = setTimeout(
            () => controller.abort(),
            CONFIG.requestTimeoutMs,
          );
          try {
            UI.updateProgress(id, "compress", 100, label);
            const response = await fetch(outputUrl, {
              method: body ? "POST" : "GET",
              headers: body
                ? { "Content-Type": "application/json" }
                : undefined,
              body: body ? JSON.stringify(body) : undefined,
              signal: controller.signal,
            });
            const countHeader = response.headers.get("compression-count");
            if (countHeader !== null) {
              const count = parseInt(countHeader, 10);
              if (!Number.isNaN(count)) {
                Store.saveApiCount(count);
                UI.setApiCountText(count);
              }
            }
            if (!response.ok) {
              let errBody = null;
              try {
                errBody = await response.json();
              } catch (e) {
                errBody = null;
              }
              const err = new Error(
                tinifyErrorMessage(response.status, errBody),
              );
              err.status = response.status;
              err.retryable =
                response.status === 429 || response.status >= 500;
              err.monthlyLimit =
                response.status === 429 &&
                errBody &&
                /month/i.test(errBody.message || "");
              throw err;
            }
            return await response.blob();
          } catch (err) {
            if (err && err.name === "AbortError")
              throw new Error("请求超时，请检查网络后重试");
            if (
              err.retryable &&
              !err.monthlyLimit &&
              attempt === 0
            ) {
              await sleep(CONFIG.retryDelayMs);
              return this.requestOutput(outputUrl, body, label, id, 1);
            }
            if (err instanceof TypeError)
              throw new Error("网络请求失败");
            throw err;
          } finally {
            clearTimeout(timer);
          }
        },

        // 接口 3：缩放的请求体，单独拼；未配缩放规则返回 null
        buildResizeBody() {
          const { settings } = Store.state;
          if (!settings.resize || !settings.resize.method) return null;
          const resize = { method: settings.resize.method };
          const w = parseInt(settings.resize.width, 10);
          const h = parseInt(settings.resize.height, 10);
          if (Number.isInteger(w) && w > 0) resize.width = w;
          if (Number.isInteger(h) && h > 0) resize.height = h;
          return { resize };
        },

        // 接口 4：转换的请求体，单独拼
        buildConvertBody() {
          const { settings } = Store.state;
          if (!settings.convert || settings.convert.length === 0) return null;
          const body = {
            convert: {
              type:
                settings.convert.length === 1
                  ? settings.convert[0]
                  : settings.convert.slice(),
            },
          };
          // 转 JPEG 时透明图无背景会 400：透明区域填白底，不透明图不受影响
          if (settings.convert.includes("image/jpeg"))
            body.transform = { background: "white" };
          return body;
        },

        // 接口 5：保留元数据的请求体，单独拼
        buildPreserveBody() {
          const { settings } = Store.state;
          if (!settings.preserve || settings.preserve.length === 0)
            return null;
          return { preserve: settings.preserve.slice() };
        },

        // 接口 2：下载，GET output.url
        download(outputUrl, id) {
          return this.requestOutput(outputUrl, null, "正在下载...", id, 0);
        },

        // 接口 3：缩放，POST output.url {resize}
        resizeImage(outputUrl, id) {
          const body = this.buildResizeBody();
          if (!body) throw new Error("未配置缩放规则");
          return this.requestOutput(outputUrl, body, "正在缩放...", id, 0);
        },

        // 接口 4：转换，POST output.url {convert[, transform]}
        convertImage(outputUrl, id) {
          const body = this.buildConvertBody();
          if (!body) throw new Error("未配置转换格式");
          return this.requestOutput(outputUrl, body, "正在转换...", id, 0);
        },

        // 接口 5：保留元数据，POST output.url {preserve}
        preserveImage(outputUrl, id) {
          const body = this.buildPreserveBody();
          if (!body) throw new Error("未配置保留元数据");
          return this.requestOutput(outputUrl, body, "正在处理元数据...", id, 0);
        },

        // 多变换合并：output 请求是按次计费的无状态变换，分开发没有叠加效果——
        // 实测：同一 output.url 先 POST fit 50x50 再 POST 转 webp，回来是 100px
        // webp，缩放丢了；一次 POST 合并 resize+convert+preserve 才是 50px webp，
        // 且官方文档明确这样只多计 1 次。所以只选一个变换时走上面对应的单独接口，
        // 选了多个时按文档一次 POST 合并，而不是分开发导致结果丢变换。
        buildCombinedBody() {
          const body = {};
          const resize = this.buildResizeBody();
          if (resize) Object.assign(body, resize);
          const convert = this.buildConvertBody();
          if (convert) Object.assign(body, convert);
          const preserve = this.buildPreserveBody();
          if (preserve) Object.assign(body, preserve);
          return Object.keys(body).length > 0 ? body : null;
        },

        async process(file, id) {
          const outputUrl = await this.shrink(file, id, 0);
          const ops = [];
          if (this.buildResizeBody()) ops.push("resize");
          if (this.buildConvertBody()) ops.push("convert");
          if (this.buildPreserveBody()) ops.push("preserve");
          let blob;
          if (ops.length === 0) {
            blob = await this.download(outputUrl, id);
          } else if (ops.length === 1) {
            if (ops[0] === "resize") blob = await this.resizeImage(outputUrl, id);
            else if (ops[0] === "convert") blob = await this.convertImage(outputUrl, id);
            else blob = await this.preserveImage(outputUrl, id);
          } else {
            blob = await this.requestOutput(
              outputUrl,
              this.buildCombinedBody(),
              "云端处理中...",
              id,
              0,
            );
          }
          let finalName = file.name;
          if (blob.type) {
            const newExt = EXT_BY_MIME[blob.type];
            const dot = finalName.lastIndexOf(".");
            const oldExt = dot >= 0 ? finalName.substring(dot) : "";
            if (newExt && oldExt.toLowerCase() !== newExt)
              finalName =
                (dot >= 0 ? finalName.substring(0, dot) : finalName) + newExt;
          }
          return {
            size: blob.size,
            blobUrl: Utils.trackBlobUrl(URL.createObjectURL(blob)),
            name: finalName,
          };
        },
      };

      const AppController = {
        init() {
          this.renderBrand();
          Store.init();
          UI.setApiCountText(Store.state.apiCount);
          this.bindEvents();
          this.fillSettingsForm();
          UI.checkEmptyState();
          UI.updateActionButtons();
          // 初次打开页面刷新一次次数（先显示缓存值，拿到新值再更新）
          TinifyService.fetchCount();
        },
        renderBrand() {
          document.getElementById("brand-name-text").textContent = AppMeta.name;
          document.getElementById("brand-version-text").textContent =
            `v${AppMeta.version}`;
          document.getElementById("brand-author-text").textContent =
            `by ${AppMeta.author}`;
        },
        toggleResizeInputs() {
          const methodSelect = document.getElementById("input-resize-method");
          const inputW = document.getElementById("input-resize-w");
          const inputH = document.getElementById("input-resize-h");

          if (methodSelect.value === "") {
            inputW.value = "";
            inputH.value = "";
            inputW.disabled = true;
            inputH.disabled = true;
          } else {
            inputW.disabled = false;
            inputH.disabled = false;
          }
        },
        fillSettingsForm() {
          const rs = Store.state.settings.resize || {};
          document.getElementById("input-resize-method").value =
            rs.method || "";
          document.getElementById("input-resize-w").value = rs.width || "";
          document.getElementById("input-resize-h").value = rs.height || "";

          this.toggleResizeInputs();

          const cv = Store.state.settings.convert || [];
          document
            .querySelectorAll('input[name="convertType"]')
            .forEach((cb) => (cb.checked = cv.includes(cb.value)));
          const pr = Store.state.settings.preserve || [];
          document
            .querySelectorAll('input[name="preserveMeta"]')
            .forEach((cb) => (cb.checked = pr.includes(cb.value)));
        },
        bindEvents() {
          const modalSettings = document.getElementById("modal-settings");

          document.getElementById("btn-settings").onclick = () => {
            this.fillSettingsForm();
            modalSettings.classList.add("active");
            setTimeout(
              () => document.getElementById("input-resize-method").focus(),
              50,
            );
          };
          document.getElementById("btn-close-settings").onclick = () =>
            modalSettings.classList.remove("active");
          document.getElementById("btn-cancel-settings").onclick = () =>
            modalSettings.classList.remove("active");
          modalSettings.addEventListener("mousedown", (e) => {
            if (e.target === modalSettings)
              modalSettings.classList.remove("active");
          });
          // 离开较久回来时刷新一次次数（10 分钟内回来不重复请求）
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) return;
            const last = Store.state.apiCountAt || 0;
            if (Date.now() - last > CONFIG.countStaleMs)
              TinifyService.fetchCount();
          });

          document.addEventListener("keydown", (e) => {
            if (e.key !== "Escape") return;
            if (modalSettings.classList.contains("active"))
              modalSettings.classList.remove("active");
            else {
              const confirmCancel =
                document.getElementById("btn-confirm-cancel");
              if (
                document
                  .getElementById("modal-confirm")
                  .classList.contains("active")
              )
                confirmCancel.click();
            }
          });

          // 处理缩放规则变更联动
          document
            .getElementById("input-resize-method")
            .addEventListener("change", () => this.toggleResizeInputs());

          // 强制校验只能输入整数，并限制最大值为2560
          const enforceIntegerAndRange = (e) => {
            let val = e.target.value;
            val = val.replace(/[^0-9]/g, "");
            if (val !== "") {
              let num = parseInt(val, 10);
              if (num > 2560) val = "2560";
            }
            e.target.value = val;
          };
          document
            .getElementById("input-resize-w")
            .addEventListener("input", enforceIntegerAndRange);
          document
            .getElementById("input-resize-h")
            .addEventListener("input", enforceIntegerAndRange);

          document.getElementById("btn-save-settings").onclick = () => {
            const btnSave = document.getElementById("btn-save-settings");
            if (btnSave.disabled) return;
            btnSave.disabled = true;
            setTimeout(() => {
              btnSave.disabled = false;
            }, 400);

            const method = document.getElementById("input-resize-method").value;
            const wStr = document.getElementById("input-resize-w").value;
            const hStr = document.getElementById("input-resize-h").value;
            const w = parseInt(wStr, 10);
            const h = parseInt(hStr, 10);

            if (method) {
              if (method === "scale") {
                if (!wStr && !hStr)
                  return UI.toast("scale 模式需要填写宽度或高度其中一项");
                if (wStr && hStr)
                  return UI.toast(
                    "scale 模式只能填写宽度或高度其中一项，不能同时填写",
                  );
              } else {
                if (!wStr || !hStr)
                  return UI.toast(`${method} 模式需要同时填写宽度和高度`);
              }
              if (wStr && (!Number.isInteger(w) || w <= 0))
                return UI.toast("宽度必须为正整数");
              if (hStr && (!Number.isInteger(h) || h <= 0))
                return UI.toast("高度必须为正整数");
              if (wStr && w > 2560) return UI.toast("缩放宽度不能大于 2560px");
              if (hStr && h > 2560) return UI.toast("缩放高度不能大于 2560px");
            }

            const convert = Array.from(
              document.querySelectorAll('input[name="convertType"]:checked'),
            ).map((cb) => cb.value);
            const preserve = Array.from(
              document.querySelectorAll('input[name="preserveMeta"]:checked'),
            ).map((cb) => cb.value);

            try {
              Store.save({
                resize: {
                  method,
                  width: Number.isInteger(w) && w > 0 ? String(w) : "",
                  height: Number.isInteger(h) && h > 0 ? String(h) : "",
                },
                convert,
                preserve,
              });
              modalSettings.classList.remove("active");
              UI.toast("配置已成功保存");
              UI.setApiCountText(Store.state.apiCount);
            } catch (e) {
              UI.toast("保存配置异常");
            }
          };

          const zone = document.getElementById("upload-zone");
          const fileInput = document.getElementById("file-input");

          zone.ondragover = (e) => {
            e.preventDefault();
            zone.classList.add("dragover");
          };
          zone.ondragleave = () => zone.classList.remove("dragover");
          zone.ondrop = (e) => {
            e.preventDefault();
            zone.classList.remove("dragover");
            this.handleFiles(e.dataTransfer.files);
          };

          fileInput.onchange = (e) => {
            this.handleFiles(e.target.files);
            e.target.value = "";
          };

          document.getElementById("btn-clear-all").onclick = async () => {
            const ok = await UI.confirm(
              "此操作将清空当前所有处理记录，未下载的文件将无法恢复。确定继续吗？",
            );
            if (ok) {
              document.getElementById("file-list").innerHTML = "";
              Utils.revokeAllBlobUrls();
              Store.clearStats();
              UI.checkEmptyState();
              UI.updateActionButtons();
              UI.toast("列表已清空");
            }
          };

          document.getElementById("btn-download-all").onclick = async () => {
            const btnDownloadAll = document.getElementById("btn-download-all");
            if (btnDownloadAll.dataset.busy === "1") return;
            if (typeof JSZip === "undefined") {
              UI.toast("打包组件未加载，请检查网络后逐个下载");
              return;
            }
            const btns = document.querySelectorAll(".btn-dl");
            if (btns.length === 0) return;
            if (btns.length === 1) return btns[0].click();
            btnDownloadAll.dataset.busy = "1";
            try {
              UI.toast(`正在打包 ${btns.length} 张图片，请耐心等待...`);
              const zip = new JSZip();
              const folderName = `${AppMeta.name}合集_${new Date().getTime()}`;
              const imgFolder = zip.folder(folderName);
              const nameCounter = {};

              for (let i = 0; i < btns.length; i++) {
                const url = btns[i].getAttribute("data-url");
                let originalName = btns[i].getAttribute("data-name");
                let baseName = originalName.includes(".")
                  ? originalName.substring(0, originalName.lastIndexOf("."))
                  : originalName;
                let ext = originalName.includes(".")
                  ? originalName.substring(originalName.lastIndexOf("."))
                  : "";
                let finalName = originalName;
                const lowerOriginal = originalName.toLowerCase();

                if (nameCounter[lowerOriginal] !== undefined) {
                  nameCounter[lowerOriginal]++;
                  finalName = `${baseName}(${nameCounter[lowerOriginal]})${ext}`;
                } else {
                  nameCounter[lowerOriginal] = 0;
                }

                const response = await fetch(url);
                if (!response.ok)
                  throw new Error(`文件获取失败: ${originalName}`);
                const blob = await response.blob();
                imgFolder.file(finalName, blob);
              }

              UI.toast("正在生成 ZIP 压缩包...");
              const content = await zip.generateAsync({ type: "blob" });
              const a = document.createElement("a");
              a.href = URL.createObjectURL(content);
              a.download = `${folderName}.zip`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(a.href), 5000);
              UI.toast("打包下载成功！");
            } catch (e) {
              console.error(e);
              UI.toast("打包失败，请尝试逐个点击下载");
            } finally {
              btnDownloadAll.dataset.busy = "";
            }
          };
        },

        handleFiles(files) {
          const currentItemsCount =
            document.querySelectorAll(".file-item").length;
          const incomingFiles = Array.from(files);
          const validFiles = [];

          if (incomingFiles.length > CONFIG.maxBatchFiles)
            return UI.toast(
              `单次最多选择 ${CONFIG.maxBatchFiles} 张图片`,
            );

          incomingFiles.forEach((file) => {
            if (!CONFIG.acceptedTypes.includes(file.type))
              UI.toast(`已跳过不支持的格式: ${file.name}`);
            else if (file.size <= 0)
              UI.toast(`已跳过空文件: ${file.name}`);
            else if (file.size > CONFIG.maxFileBytes)
              UI.toast(`已跳过超大文件(>15M): ${file.name}`);
            else validFiles.push(file);
          });

          if (validFiles.length === 0) return;
          if (currentItemsCount + validFiles.length > CONFIG.maxListFiles)
            return UI.toast(
              `抱歉，列表最多可容纳 ${CONFIG.maxListFiles} 张图片，当前已选 ${currentItemsCount} 张。请先清空后再试。`,
            );

          Store.state.activeTasks += validFiles.length;
          UI.updateActionButtons();

          const tasks = validFiles.map((file) => {
            const id = Utils.id();
            UI.createFileItem(file, id);
            return { file, id };
          });

          let currentIndex = 0;

          const processNext = async () => {
            if (currentIndex >= tasks.length) return;
            const { file, id } = tasks[currentIndex++];
            try {
              const res = await TinifyService.process(file, id);
              UI.renderSuccess(id, file.size, res.size, res.blobUrl, res.name);
            } catch (e) {
              UI.renderError(id, e.message);
              console.error(`处理失败 [${file.name}]:`, e);
            } finally {
              Store.state.activeTasks--;
              UI.updateActionButtons();
              processNext();
            }
          };

          for (let i = 0; i < Math.min(CONFIG.concurrency, tasks.length); i++)
            processNext();
        },
      };

      document.addEventListener("DOMContentLoaded", () => AppController.init());
    </script>
  </body>
</html>
