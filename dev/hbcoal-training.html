    /* ================= 连续学习 ================= */
    function armAutoStudyDeadline() {
      state.autoStudyStartedAt = Date.now();
      state.autoStudyDeadlineAt = state.autoStudyStartedAt + CONFIG.AUTO_STUDY_MAX_DURATION_MS;
    }
    function autoStudyExpired() {
      return state.autoStudy && Date.now() > state.autoStudyDeadlineAt;
    }
    async function advanceAutoStudy(finishedSession) {
      if (!state.autoStudy || autoStudyExpired()) {
        state.autoStudy = false;
        state.autoStudyCount = 0;
        $('auto-study-toggle').checked = false;
        await stopSession({ syncBeforeStop: true });
        collapseToBallAnimated();
        return;
      }
      // 连学上限 5 个课件：detail.wares 由 getCourseDetail 统一构建，各模块场景通用
      if (state.autoStudyCount >= CONFIG.AUTO_STUDY_MAX_WARES) {
        state.autoStudy = false;
        state.autoStudyCount = 0;
        $('auto-study-toggle').checked = false;
        await stopSession({ syncBeforeStop: true });
        showSessionNotice(`已连续学习 ${CONFIG.AUTO_STUDY_MAX_WARES} 个课件，自动连学停止`, 'info');
        setTimeout(() => { if (!state.studySession && !state.pendingStudy) collapseToBallAnimated(); }, 2600);
        return;
      }
      const detail = finishedSession.detail || null;
      const wares = detail?.wares || [];
      const idx = wares.findIndex((w) => String(w?.WareId ?? w?.wareId) === String(finishedSession.ware?.WareId ?? finishedSession.ware?.wareId));
      // 连学直接跳过外部 H5：课程级 source==1，或课件级 Type!=3
      const next = wares.slice(idx + 1).find((w) => wareProgress(w) < 100 && !isH5Course(detail?.course) && !isH5Ware(w));
      if (next && detail) {
        state.autoStudyCount += 1;
        await stopSession({ silent: true, syncBeforeStop: true });
        await startSession(detail, next);
        return;
      }
      state.autoStudy = false;
      state.autoStudyCount = 0;
      $('auto-study-toggle').checked = false;
      await stopSession({ syncBeforeStop: true });
      showSessionNotice('连续学习已完成本课程全部课件', 'success');
      setTimeout(() => { if (!state.studySession && !state.pendingStudy) collapseToBallAnimated(); }, 2600);
    }
    /* ================= 兑换积分 ================= */
    function stopExchangeViewTimers() {
      if (state.exchange.smsTimerId) { clearInterval(state.exchange.smsTimerId); state.exchange.smsTimerId = null; }
      state.exchange.smsCountdown = 0;

    function getExchangeNodeKey(node) {

    function getExchangeNodeDescription(node) {

    function canSelectExchangeNode(node) {
      // 兑换资格只看服务端：canExchange / isExchange 与服务端时长；服务端返回 0/1 数字，需归一化后判断
      return node && isTruthyFlag(node.canExchange) && !isTruthyFlag(node.isExchange)

    async function loadExchangeView() {
      const tierList = $('tier-list');

        const response = await requestJson({ path: CONFIG.STUDY_INFO_PATH, method: 'POST', lockKey: 'exchange-info' });

        state.tiers = Array.isArray(response?.data?.node) ? response.data.node : [];
        state.studyDuration = duration;
        $('exchange-duration').textContent = Math.round(duration).toLocaleString('zh-CN');

        renderTiers();
        updateExchangeForm();

        tierList.innerHTML = `<div class="empty-state">加载失败：${esc(error.message)}<br><button class="text-button" id="retry-tiers" type="button">点击重试</button></div>`;

    function renderTiers() {
      const tierList = $('tier-list');
      tierList.innerHTML = '';
      if (!state.tiers.length) { tierList.innerHTML = '<div class="empty-state">暂无可兑换档位</div>'; return; }
      const sorted = [...state.tiers].sort((a, b) => safeNumber(a?.metaTime) - safeNumber(b?.metaTime));
      sorted.forEach((node) => {
        const key = getExchangeNodeKey(node);
        const need = safeNumber(node?.metaTime);
        const got = safeNumber(node?.metaIntegral);
        const claimed = isTruthyFlag(node?.isExchange);
        const eligible = canSelectExchangeNode(node);
        const have = safeNumber(state.studyDuration);
        const pct = need > 0 ? Math.min(100, (have / need) * 100) : 100;
        const card = document.createElement('div');
        card.className = `tier${eligible ? ' eligible' : ''}${claimed ? ' claimed' : ''}`;

        card.innerHTML = `
          <div class="tier-top">
            <div class="tier-title">${need} 分钟 <span class="muted">→</span> ${got} 积分</div>

          </div>
          <div class="pbar brand"><div style="width:${pct}%"></div></div>
          <div class="tier-foot">
            <span class="tier-sub">${statusText}</span>

          </div>`;

    /* ================= 积分记录 ================= */
    function getIntegralDelta(record) {
      const raw = record?.integral ?? record?.score ?? 0;
      const n = safeNumber(raw);
      return n;
    }
    function integralRecordKey(record) {
      return String(record?.recordId ?? `${record?.actionCode}_${record?.getTime}_${record?.integral}`);
    }
    function classifyIntegralRecords(list) {
      const earned = [];
      const spent = [];
      (Array.isArray(list) ? list : []).forEach((record) => {
        const delta = getIntegralDelta(record);
        const category = String(record?.inteCategroy ?? '');
        if (delta < 0 || category === '2' || /消费|扣|兑换-/i.test(String(record?.actionName || ''))) spent.push(record);
        else earned.push(record);
      });
      return { earned, spent };
    }
    async function loadIntegralRecords() {
      const earnedList = $('integral-earned-list');
      const spentList = $('integral-spent-list');
      hideNotice($('integral-notice'));
      try {
        const [earnedResp, spentResp] = await Promise.all([
          requestJson({ path: CONFIG.INTEGRAL_LIST_PATH, method: 'POST', body: { scoreType: 0, pageIndex: 1, pageSize: 50 }, lockKey: 'integral-earned' }),
          requestJson({ path: CONFIG.INTEGRAL_LIST_PATH, method: 'POST', body: { scoreType: 1, pageIndex: 1, pageSize: 50 }, lockKey: 'integral-spent' })
        ]);
        const earned = earnedResp?.resultList || earnedResp?.data || [];
        const spent = spentResp?.resultList || spentResp?.data || [];
        state.integralRecords = { earned: Array.isArray(earned) ? earned : [], spent: Array.isArray(spent) ? spent : [] };
        renderRecordList(earnedList, state.integralRecords.earned, true);
        renderRecordList(spentList, state.integralRecords.spent, false);
      } catch (error) {
        showNotice($('integral-notice'), error.message || '积分记录加载失败', 'error');

    function renderRecordList(container, records, isEarned) {
      container.innerHTML = '';
      if (!records.length) { container.innerHTML = '<div class="empty-state">暂无记录</div>'; return; }
      records.forEach((record) => {
        const delta = getIntegralDelta(record);
        const sign = delta > 0 ? '+' : '';
        const row = document.createElement('div');
        row.className = 'record-item';
        row.innerHTML = `
          <div><div class="record-title">${esc(record?.actionName || '—')}</div>
          <div class="record-meta">${esc(formatDateTime(record?.getTime))}${record?.integralDesc ? ` · ${esc(record.integralDesc)}` : ''}</div></div>
          <div class="record-points ${isEarned ? 'positive' : 'negative'}">${sign}${delta}</div>`;
        container.appendChild(row);
      });
    }

    /* ================= 初始化 ================= */
    function bindStaticEvents() {
      $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = $('username').value.trim();
        const password = $('password').value;
        const domain = $('domain').value.trim();
        const notice = $('login-notice');
        hideNotice(notice);
        if (!username) { showNotice(notice, '请输入账号', 'warning'); $('username').focus(); return; }
        if (!password) { showNotice(notice, '请输入密码', 'warning'); $('password').focus(); return; }
        if (!domain) { showNotice(notice, '请输入企业域', 'warning'); $('domain').focus(); return; }
        const button = $('login-button');
        try {
          setButtonBusy(button, true, '登录中…');
          await login(username, password, domain);
          saveRemember(username, domain, $('remember-me').checked);
          renderAuthState();
          void afterLogin();
        } catch (error) {
          showNotice(notice, error.message || '登录失败', 'error');
        } finally {
          setButtonBusy(button, false);
        }
      });

      $('status-chip').addEventListener('click', () => {
        if (!state.auth) return;
        if (window.confirm('确认退出登录？')) logout();
      });

      // 主界面 Hero 入口：点分钟数进兑换，点积分可用进积分记录
      $('hero-duration-card').addEventListener('click', () => { switchView('exchange-view'); void loadExchangeView(); });
      $('hero-points-card').addEventListener('click', () => { switchView('integral-view'); void loadIntegralRecords(); });
      $('exchange-back').addEventListener('click', () => switchView('study-view'));
      $('integral-back').addEventListener('click', () => switchView('study-view'));

      document.querySelectorAll('#integral-tabs button').forEach((button) => {
        button.addEventListener('click', () => {
          document.querySelectorAll('#integral-tabs button').forEach((b) => {
            const on = b === button;
            b.classList.toggle('active', on);
            b.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          const tab = button.dataset.tab;
          $('integral-earned-list').classList.toggle('hidden', tab !== 'earned');
          $('integral-spent-list').classList.toggle('hidden', tab !== 'spent');
        });
      });

      // 开始按钮：待开始时开始学习，学习中时暂停/继续二合一
      $('btn-start').addEventListener('click', () => {
        if (state.studySession?.active) void pauseSession();
        else void startSessionFromSelection();
      });
      // 结束按钮：学习中时结束并同步，待开始时等同取消选择
      $('btn-end').addEventListener('click', async () => {
        if (state.studySession?.active) {
          if (!window.confirm('结束本次学习并同步进度？')) return;
          await stopSession({ syncBeforeStop: true });
          collapseToBallAnimated();
        } else {
          cancelSelection();
        }
      });
      // 右上角缩小：播放中→迷你台（出现在面板当前位置），未播/暂停→悬浮球
      $('btn-minimize').addEventListener('click', () => {
        const s = state.studySession;
        if (s?.active && !s.paused) minimizeToMini();
        else collapseToBallAnimated();
      });
      // 迷你台无按钮，点击整个迷你台展开为控制台（拖动不会误触发）
      $('session-mini').addEventListener('click', () => expandPanelFromMini());
      $('session-mini').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); expandPanelFromMini(); }
      });
      // 悬浮球恒为书本图标，点击总是打开控制台
      $('session-ball').addEventListener('click', () => expandPanelFromBall());
      makeFloatDraggable($('session-ball'));
      makeFloatDraggable($('session-mini'));
      makeFloatDraggable($('session-panel'));
      $('auto-study-toggle').addEventListener('change', (event) => {
        // 开关只改变状态，不弹提示、不改变布局
        state.autoStudy = event.target.checked;
        if (state.autoStudy) {
          if (state.autoStudyCount < 1) state.autoStudyCount = 1;
          armAutoStudyDeadline();
        } else {
          state.autoStudyCount = 0;
        }
      });

      $('refresh-exchange').addEventListener('click', () => void loadExchangeView());
      $('refresh-exchange-history').addEventListener('click', () => void loadExchangeHistory());
      $('exchange-send-sms').addEventListener('click', () => void sendExchangeSms());
      $('exchange-submit').addEventListener('click', () => void submitExchange());

      document.querySelectorAll('#learn-module-tabs button').forEach((button) => {
        button.addEventListener('click', () => switchLearnModule(button.dataset.module));
      });
      document.querySelectorAll('#mine-status-tabs button').forEach((button) => {
        button.addEventListener('click', () => switchMineStatus(Number(button.dataset.status)));
      });
      $('cc-reload-top').addEventListener('click', () => void loadCenterTopCourses());
    }
    async function afterLogin() {
      $('month-label').textContent = `${currentMonthLabel()}学习`;
      try {
        await loadSummary();
      } catch (error) {
        $('hero-goal-text').textContent = `总览加载失败：${error.message}`;
      }
      state.mine.loaded = true;
      await loadMineCourses();
    }
    function boot() {
      document.title = TOOL_META.name;
      $('tool-title').textContent = TOOL_META.name;
      $('tool-version').textContent = `v${TOOL_META.version}`;
      $('footer-text').textContent = `${TOOL_META.name} v${TOOL_META.version} · by ${TOOL_META.author}`;
      state.daily = loadDaily();
      loadRemember();
      bindStaticEvents();
      renderAuthState();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  </script>

  <!-- 全局单例浮动学习控制台：悬浮球 / 完整面板 / 小型学习台 -->
  <div id="global-toast" role="status" aria-live="polite"></div>
  <div id="session-float" class="hidden">
    <button id="session-ball" class="session-ball" type="button" aria-label="学习控制台">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
    </button>
    <section id="session-panel" class="panel session hidden" aria-label="学习控制台" aria-live="polite">
      <div class="session-top">
        <span id="session-course">—</span>
        <button class="icon-button" id="btn-minimize" type="button" aria-label="缩小">—</button>
      </div>
      <div class="session-ware" id="session-ware">—</div>
      <div class="session-progress-row">
        <div class="pbar session-pbar"><div id="session-progress-fill"></div></div>
        <span class="session-time-text num" id="session-time-text">00:00 / 00:00</span>
      </div>
      <div class="session-actions">
        <button class="primary-button" id="btn-start" type="button" disabled>开始</button>
        <button class="ghost-button" id="btn-end" type="button">结束</button>
        <label class="lianxue" aria-label="自动连学">
          <span>连学</span>
          <span class="switch"><input type="checkbox" id="auto-study-toggle"><span class="track"><span class="thumb"></span></span></span>
        </label>
      </div>
      <div class="notice" id="session-notice"></div>
    </section>
    <div id="session-mini" class="session-mini hidden" role="button" tabindex="0" aria-label="小型学习台，点击展开控制台">
      <div class="session-mini-fill" id="mini-fill"></div>
      <div class="session-mini-info">
        <div class="session-mini-ware" id="mini-ware-wrap"><span id="mini-ware">—</span></div>
        <div class="session-mini-time num" id="mini-time">00:00 / 00:00</div>
      </div>
    </div>

</body>
</html>
