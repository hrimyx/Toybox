<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toybox</title>
<meta name="description" content="Toybox —— 奇奇怪怪小工具导航中心">
<!-- 应用元信息，全局唯一数据源 -->
<meta name="app-name" content="Toybox">
<meta name="app-version" content="2.0.0">
<meta name="app-author" content="Hrimyx">
<style>
  /* =====================================================
     Design Tokens —— 冷蓝色彩体系
     绝对禁止硬编码，强制通过变量引用
     ===================================================== */
  :root {
    /* 核心品牌色（静态） */
    --brand-primary: #1A6AFF;
    --on-brand-primary: #FFFFFF;
    --brand-light: #6B9CFF;
    --on-brand-light: #0A0F1A;
    --brand-dark: #0D3B8C;
    --on-brand-dark: #FFFFFF;

    /* 辅助与点缀色（静态） */
    --accent-cyan: #00C4EB;
    --on-accent-cyan: #0A0F1A;
    --accent-coral: #E64A2E;
    --on-accent-coral: #FFFFFF;

    /* 语义反馈色 */
    --semantic-success: #059669;
    --semantic-success-bg: #E6FAF3;
    --semantic-danger: #D92644;
    --semantic-danger-bg: #FFEBEE;
    --semantic-warning: #D97706;
    --semantic-warning-bg: #FFF8E1;
    --on-semantic-warning: #FFFFFF;

    /* 结构与中性色（日间） */
    --surface-bg: #F7F9FC;
    --surface-card: #FFFFFF;
    --surface-overlay: #EBEEF5;
    --border-divider: #D0D7E5;
    --text-primary: #1A202C;
    --text-secondary: #4A5568;

    /* 布局与动效基础值 */
    --radius-sm: 8px;
    --radius-md: 14px;
    --shadow-card: 0 1px 2px color-mix(in srgb, var(--brand-dark) 6%, transparent), 
                   0 8px 24px color-mix(in srgb, var(--brand-dark) 8%, transparent);
    --transition-fast: 150ms ease;
    --transition-base: 220ms cubic-bezier(0.2, 0.6, 0.2, 1);
    
    /* 字体规范 */
    --font-display: 'Space Grotesk', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      /* 结构与中性色（夜间映射） */
      --surface-bg: #0A0F1A;
      --surface-card: #141C2B;
      --surface-overlay: #1F2A3F;
      --border-divider: #2C3A54;
      --text-primary: #E2E8F0;
      --text-secondary: #A0B0C8;
      
      /* 语义色夜间背景 */
      --semantic-success-bg: #0B2F26;
      --semantic-danger-bg: #3D0F1A;
      --semantic-warning-bg: #3D2E00;
      
      /* 暗黑模式文本可读性补偿：品牌主色作为文本/链接时映射为高亮版本 */
      --brand-primary-text: var(--brand-light);
    }
  }
  
  /* 日间模式明文补偿回退 */
  :root { --brand-primary-text: var(--brand-primary); }

  /* =====================================================
     全局重置与排版
     ===================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface-bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* =====================================================
     Header (包含动态背景光晕)
     ===================================================== */
  .site-header {
    padding: 28px 24px 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .site-header::before {
    content: "";
    position: absolute;
    top: -140px; left: 50%;
    width: 960px; height: 240px;
    transform: translateX(-50%);
    /* 彻底重构硬编码：使用 color-mix 生成带透明度的发光效果 */
    background: radial-gradient(closest-side, color-mix(in srgb, var(--brand-primary) 14%, transparent), transparent 70%);
    pointer-events: none;
  }
  .brand-lockup {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 32px; height: 32px;
    flex: none;
    color: var(--brand-primary-text);
  }
  .app-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(32px, 6vw, 48px);
    letter-spacing: -0.03em;
    margin: 0;
    background: linear-gradient(135deg, var(--brand-primary), var(--accent-cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .identity-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
  }
  .identity-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface-overlay);
    border: 1px solid var(--border-divider);
    padding: 4px 10px 4px 8px;
    border-radius: 999px;
  }
  .identity-icon {
    width: 12px; height: 12px;
    color: var(--brand-primary-text);
  }
  .identity-divider {
    width: 1px; height: 14px;
    background: var(--border-divider);
  }

  /* =====================================================
     搜索与操作控制区
     ===================================================== */
  .layout-container {
    max-width: 1220px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
  }
  .control-bar {
    padding: 12px 0 8px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .search-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .input-container {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 16px;
    width: 18px; height: 18px;
    color: var(--text-secondary);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 13px 16px 13px 44px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-divider);
    background: var(--surface-card);
    color: var(--text-primary);
    font-size: 15px;
    outline: none;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    min-height: 44px;
  }
  .search-input:focus {
    border-color: var(--brand-primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-primary) 18%, transparent);
  }
  .search-input::placeholder { color: var(--text-secondary); }

  .fav-toggle-btn {
    flex: none;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-divider);
    border-radius: var(--radius-md);
    background: var(--surface-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-fast);
  }
  .fav-toggle-btn svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor;
  }
  .fav-toggle-btn:hover {
    border-color: var(--brand-light);
    color: var(--brand-primary-text);
  }
  .fav-toggle-btn:focus-visible {
    outline: 2px solid var(--brand-primary);
    outline-offset: 2px;
  }
  .fav-toggle-btn.active {
    background: var(--semantic-warning);
    border-color: var(--semantic-warning);
    color: var(--on-semantic-warning);
  }
  .fav-toggle-btn.active svg { fill: currentColor; }

  /* =====================================================
     核心主视图：网格与卡片
     ===================================================== */
  main {
    flex: 1;
    padding-bottom: 56px;
  }
  .result-meta {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 12px 0 14px;
    min-height: 18px;
  }
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  @media (max-width: 1120px) { .tool-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 860px)  { .tool-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px)  { .tool-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

  .tool-card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface-card);
    border: 1px solid var(--border-divider);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-card);
    transition: transform var(--transition-base), border-color var(--transition-fast);
  }
  .tool-card:hover {
    transform: translateY(-3px);
    border-color: var(--brand-light);
  }
  .tool-card-link {
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    text-decoration: none;
    outline: none;
  }
  .tool-card-link:focus-visible {
    outline: 2px solid var(--brand-primary);
    outline-offset: 2px;
  }

  .tool-fav-btn {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 2;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-divider);
    border-radius: 50%;
    background: var(--surface-card);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all var(--transition-fast);
  }
  .tool-fav-btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; }
  .tool-fav-btn:hover {
    border-color: var(--semantic-warning);
    color: var(--semantic-warning);
  }
  .tool-fav-btn:focus-visible {
    outline: 2px solid var(--brand-primary); outline-offset: 2px;
  }
  .tool-fav-btn:active { transform: scale(0.9); }
  .tool-fav-btn.is-active {
    color: var(--semantic-warning);
    border-color: var(--semantic-warning);
    background: var(--semantic-warning-bg);
  }
  .tool-fav-btn.is-active svg { fill: currentColor; }

  .tool-card-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: 100%;
  }
  .tool-card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    padding-right: 26px;
  }
  .tool-icon {
    flex: none;
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    background: color-mix(in srgb, var(--tool-accent, var(--brand-primary)) 14%, var(--surface-card));
  }
  .tool-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14.5px;
    color: var(--text-primary);
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tool-desc {
    font-size: 12.5px;
    color: var(--text-secondary);
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tool-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
  }
  .tool-tag {
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
    color: var(--tool-accent, var(--brand-primary-text));
    background: color-mix(in srgb, var(--tool-accent, var(--brand-primary)) 12%, transparent);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .tool-arrow {
    width: 16px; height: 16px;
    color: var(--text-secondary);
    transition: transform var(--transition-fast), color var(--transition-fast);
  }
  .tool-card:hover .tool-arrow {
    transform: translate(2px, -2px);
    color: var(--brand-primary-text);
  }

  /* 缺省态 */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 16px;
    color: var(--text-secondary);
  }
  .empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }

  /* =====================================================
     全局组件：轻提示 (Toast) 与 Footer
     ===================================================== */
  .toast-container {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--brand-dark);
    color: var(--on-brand-dark);
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-base), transform var(--transition-base);
    z-index: 100;
    box-shadow: var(--shadow-card);
  }
  .toast-container.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  
  footer {
    text-align: center;
    padding: 24px 16px 32px;
    font-size: 12.5px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border-divider);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 480px) {
    .site-header { padding: 22px 16px 14px; }
    .layout-container { padding: 0 16px; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="brand-lockup">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 8 12 3 3 8l9 5 9-5Z"></path>
        <path d="M3 8v8l9 5 9-5V8"></path>
        <path d="M12 13v8"></path>
      </svg>
      <h1 class="app-title" id="uiAppTitle"></h1>
    </div>
    <div class="identity-row">
      <span class="identity-item">
        <svg class="identity-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3H4a1 1 0 0 0-1 1v5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.82 0l4.6-4.6a2 2 0 0 0 0-2.58Z"></path>
          <circle cx="7.5" cy="7.5" r="1.5"></circle>
        </svg>
        <span id="uiVersionText"></span>
      </span>
      <span class="identity-divider" aria-hidden="true"></span>
      <span class="identity-item">
        <svg class="identity-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span id="uiAuthorText"></span>
      </span>
    </div>
  </header>

  <div class="layout-container control-bar">
    <div class="search-wrap">
      <div class="input-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="sysSearchInput" class="search-input" type="text" placeholder="搜索工具名称、描述或分类…" maxlength="60" autocomplete="off">
      </div>
      <button type="button" id="sysFavToggleBtn" class="fav-toggle-btn" aria-label="只看收藏">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <main class="layout-container">
    <div id="uiResultMeta" class="result-meta" aria-live="polite"></div>
    <div class="tool-grid" id="uiToolGrid"></div>
  </main>

  <footer>
    <div class="layout-container"><span id="uiFooterAuthor"></span> - All Rights Reserved.</div>
  </footer>

  <div id="sysToast" class="toast-container" role="status" aria-live="polite"></div>

  <!-- 重构点：彻底抛弃基于 innerHTML 拼接。使用 Template 避免任意 XSS 问题 -->
  <template id="tplToolCard">
    <div class="tool-card">
      <a class="tool-card-link"></a>
      <button type="button" class="tool-fav-btn">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </button>
      <div class="tool-card-content" aria-hidden="true">
        <div class="tool-card-head">
          <div class="tool-icon"></div>
          <div class="tool-name"></div>
        </div>
        <div class="tool-desc"></div>
        <div class="tool-footer">
          <span class="tool-tag"></span>
          <svg class="tool-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </div>
      </div>
    </div>
  </template>

<script>
/**
 * Toybox App Script
 * 遵循《工具开发基础规范》，采用高内聚低耦合模块化重构
 */
(function () {
  'use strict';

  // =====================================================
  // 1. 全局防崩溃防护 (安全与健壮)
  // =====================================================
  window.addEventListener('error', e => console.error('Toybox Error:', e.message));
  window.addEventListener('unhandledrejection', e => console.error('Toybox Promise Error:', e.reason));

  // =====================================================
  // 2. 数据层设计 (单一数据源与统一数据封装)
  // =====================================================
  const TOOL_DATA = [
    { id: 'image-tinify', name: '图片压缩', desc: '轻量级图片压缩工具。', icon: '🖼️', category: '设计', accent: 'var(--accent-cyan)', url: './image-tinify.html' },
    { id: 'har-analyzer', name: 'HAR本地分析器', desc: 'HAR本地分析器，支持导入数据进行解析', icon: '🌐', category: '开发', accent: 'var(--brand-primary)', url: './har-analyzer.html' }
    // { id: 'json-formatter', name: 'JSON 格式化', desc: '格式化、压缩、校验 JSON 数据，支持树形结构查看。', icon: '🧩', category: '开发', accent: 'var(--brand-primary)', url: 'https://example.com/tools/json-formatter' },
    // { id: 'pomodoro', name: '番茄钟', desc: '简洁的番茄工作法计时器，支持自定义时长与提醒音。', icon: '⏱️', category: '效率', accent: 'var(--semantic-warning)', url: 'https://example.com/tools/pomodoro' },
    // { id: 'markdown-preview', name: 'Markdown 预览', desc: '实时渲染 Markdown 文本，支持导出为 HTML。', icon: '📝', category: '开发', accent: 'var(--brand-primary)', url: 'https://example.com/tools/markdown-preview' },
    // { id: 'unit-convert', name: '单位换算', desc: '长度、重量、温度等常用单位互相换算工具。', icon: '📐', category: '实用', accent: 'var(--semantic-success)', url: 'https://example.com/tools/unit-convert' },
    // { id: 'qr-generator', name: '二维码生成', desc: '输入文本或链接，即时生成可下载的二维码图片。', icon: '🔳', category: '实用', accent: 'var(--semantic-success)', url: 'https://example.com/tools/qr-generator' },
    // { id: 'word-counter', name: '字数统计', desc: '统计文本字数、字符数与阅读时长，支持中英文。', icon: '🔤', category: '效率', accent: 'var(--semantic-warning)', url: 'https://example.com/tools/word-counter' },
    // { id: 'random-picker', name: '随机抽签器', desc: '输入名单，随机抽取一项，适合抽奖或分组场景。', icon: '🎲', category: '娱乐', accent: 'var(--accent-coral)', url: 'https://example.com/tools/random-picker' },
    // { id: 'gradient-maker', name: '渐变生成器', desc: '可视化调节渐变角度与色标，一键复制 CSS 代码。', icon: '🌈', category: '设计', accent: 'var(--accent-cyan)', url: 'https://example.com/tools/gradient-maker' }
  ];

  const StorageManager = {
    keys: { FAV_LIST: 'toybox.favs_v2', FAV_MODE: 'toybox.favMode_v2' },
    
    get(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
      } catch (err) { return fallback; }
    },
    
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (err) { /* 静默降级 */ }
    }
  };

  const AppState = {
    keyword: '',
    favoritesOnly: StorageManager.get(StorageManager.keys.FAV_MODE, false),
    favoriteIds: new Set(StorageManager.get(StorageManager.keys.FAV_LIST, [])),
    
    toggleFav(id) {
      const isFav = this.favoriteIds.has(id);
      if (isFav) this.favoriteIds.delete(id);
      else this.favoriteIds.add(id);
      StorageManager.set(StorageManager.keys.FAV_LIST, Array.from(this.favoriteIds));
      return !isFav;
    },
    
    toggleFavMode() {
      this.favoritesOnly = !this.favoritesOnly;
      StorageManager.set(StorageManager.keys.FAV_MODE, this.favoritesOnly);
    }
  };

  // =====================================================
  // 3. 视图层设计 (DOM 操作隔离，模板绑定)
  // =====================================================
  const UIManager = {
    els: {
      grid: document.getElementById('uiToolGrid'),
      search: document.getElementById('sysSearchInput'),
      favToggle: document.getElementById('sysFavToggleBtn'),
      meta: document.getElementById('uiResultMeta'),
      toast: document.getElementById('sysToast'),
      cardTemplate: document.getElementById('tplToolCard')
    },
    
    toastTimer: null,
    
    showToast(message) {
      this.els.toast.textContent = message;
      this.els.toast.classList.add('show');
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => this.els.toast.classList.remove('show'), 2200);
    },

    readMeta() {
      const getMeta = (n, def) => {
        const el = document.querySelector(`meta[name="${n}"]`);
        return el ? el.getAttribute('content') : def;
      };
      return {
        name: getMeta('app-name', 'Toybox'),
        version: getMeta('app-version', '2.0.0'),
        author: getMeta('app-author', 'Unknown')
      };
    },

    renderGlobalInfo() {
      const meta = this.readMeta();
      document.title = meta.name;
      document.getElementById('uiAppTitle').textContent = meta.name;
      document.getElementById('uiVersionText').textContent = `v${meta.version}`;
      document.getElementById('uiAuthorText').textContent = meta.author;
      document.getElementById('uiFooterAuthor').textContent = `© ${new Date().getFullYear()} ${meta.author}`;
    },

    renderEmptyState(isEmptyFav) {
      this.els.grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${isEmptyFav ? '☆' : '🔍'}</div>
          <div>${isEmptyFav ? '还没有收藏任何工具，点击卡片右上角的星标试试。' : '没有找到匹配的工具，换个关键词试试。'}</div>
        </div>`;
    },

    // 核心安全重构：采用原生 DOM 节点操作替代 innerHTML
    createCardNode(tool, isFav, onFavClick) {
      const clone = document.importNode(this.els.cardTemplate.content, true);
      const card = clone.querySelector('.tool-card');
      const link = clone.querySelector('.tool-card-link');
      const btn = clone.querySelector('.tool-fav-btn');
      
      card.style.setProperty('--tool-accent', tool.accent);
      
      link.href = tool.url;
      link.setAttribute('aria-label', `${tool.name}：${tool.desc}`);
      
      btn.className = 'tool-fav-btn' + (isFav ? ' is-active' : '');
      btn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
      btn.setAttribute('aria-label', (isFav ? '取消收藏 ' : '收藏 ') + tool.name);
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        onFavClick(tool);
      });

      clone.querySelector('.tool-icon').textContent = tool.icon;
      clone.querySelector('.tool-name').textContent = tool.name;
      clone.querySelector('.tool-desc').textContent = tool.desc;
      clone.querySelector('.tool-tag').textContent = tool.category;
      
      return clone;
    },

    renderGrid(tools, state, onFavClick) {
      if (!tools.length) {
        this.els.meta.textContent = '';
        this.renderEmptyState(state.favoritesOnly);
        return;
      }

      this.els.meta.textContent = state.favoritesOnly 
        ? `收藏 · 共 ${tools.length} 个工具` 
        : `共 ${tools.length} 个工具`;

      const frag = document.createDocumentFragment();
      tools.forEach(tool => {
        const isFav = state.favoriteIds.has(tool.id);
        frag.appendChild(this.createCardNode(tool, isFav, onFavClick));
      });
      
      this.els.grid.innerHTML = '';
      this.els.grid.appendChild(frag);
    },
    
    updateControls(state) {
      this.els.favToggle.classList.toggle('active', state.favoritesOnly);
      this.els.favToggle.setAttribute('aria-pressed', state.favoritesOnly.toString());
    }
  };

  // =====================================================
  // 4. 控制器层 (业务逻辑粘合)
  // =====================================================
  const AppController = {
    // 防抖辅助函数
    debounce(fn, delay) {
      let timer = null;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    },

    getFilteredTools() {
      const kw = AppState.keyword.toLowerCase();
      return TOOL_DATA.filter(t => {
        const matchKw = !kw || t.name.toLowerCase().includes(kw) || t.desc.toLowerCase().includes(kw) || t.category.toLowerCase().includes(kw);
        return AppState.favoritesOnly ? (AppState.favoriteIds.has(t.id) && matchKw) : matchKw;
      });
    },

    handleFavClick(tool) {
      const added = AppState.toggleFav(tool.id);
      UIManager.showToast(added ? `已收藏 ${tool.name}` : `已取消收藏 ${tool.name}`);
      this.refreshGrid();
    },

    refreshGrid() {
      const data = this.getFilteredTools();
      UIManager.renderGrid(data, AppState, this.handleFavClick.bind(this));
    },

    bindEvents() {
      // 搜索校验与防抖
      UIManager.els.search.addEventListener('input', this.debounce((e) => {
        const safeVal = e.target.value.trim().slice(0, 60); // 合法性校验：截取限制
        AppState.keyword = safeVal;
        this.refreshGrid();
      }, 200));

      // 切换收藏模式
      UIManager.els.favToggle.addEventListener('click', () => {
        AppState.toggleFavMode();
        UIManager.updateControls(AppState);
        this.refreshGrid();
      });
    },

    init() {
      try {
        UIManager.renderGlobalInfo();
        UIManager.updateControls(AppState);
        this.bindEvents();
        this.refreshGrid();
      } catch (err) {
        console.error('Toybox App Init Failed:', err);
        UIManager.showToast('应用初始化失败');
      }
    }
  };

  // 启动应用
  document.addEventListener('DOMContentLoaded', () => AppController.init());

})();
</script>
</body>
</html>
